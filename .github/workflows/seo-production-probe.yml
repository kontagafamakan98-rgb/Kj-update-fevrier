name: SEO production probe (daily)

# ─── Pourquoi cette sonde est la SEULE lecture de la production ──────────────
# Elle remplace l'étape informative de `ci.yml` (job `lighthouse-ci`), RETIRÉE le
# 10/10/2026 : cette étape publiait un `::notice` par intégration absente et ne
# faisait jamais échouer le job. C'est précisément ce qui a laissé F9 ouvert —
# des intégrations (GA4, meta Search Console, liens sociaux, domaines GA de la
# CSP) absentes de la production, la CI verte, et AUCUN run rouge nulle part. Un
# rapport que personne ne lit et qui ne peut pas échouer n'est pas une
# vérification.
#
# Cette sonde-ci est STRICTE (`--strict`) : une intégration absente, ou une
# sonde qui ne peut pas conclure, fait échouer le run. Elle tourne une fois par
# jour au lieu de chaque push, à dessein : elle ne bloque aucune PR pour une
# variable d'exécution, mais elle rend le silence impossible — un run rouge
# quotidien est un fait visible, pas une note enterrée dans un log.
#
# ─── Le cron n'est PLUS le premier à voir un écart ──────────────────────────
# Depuis le 12/10/2026, la MÊME sonde stricte tourne aussi juste après chaque
# déploiement de production : dans le job `frontend-build` de `ci.yml`, sur un
# push de `main`, immédiatement après le step qui a constaté que la production
# sert le frontend de ce commit. Là, l'écart est constaté en minutes et reste
# attribuable à la livraison qui l'a introduit (coût mesuré : 4,1 s).
#
# Les deux ne se remplacent pas. La livraison répond à « ce build a-t-il perdu
# quelque chose ? » ; le cron répond à « la production est-elle conforme
# MAINTENANT ? », y compris quand rien n'a été poussé : une variable `VITE_*`
# retirée ou vidée sur Vercel, un redéploiement manuel (cf. `seo-vercel-env.yml`),
# un jeton de vérification qui expire, ou un push qui n'a déclenché aucune
# vérification de révision. Un seul des deux laisserait un angle mort ; c'est
# aussi pourquoi la commande est la même des trois côtés, sans variante : le cron,
# le step de `frontend-build`, et `npm run livrer` (`.github/scripts/livrer.py`),
# qui la lance juste après avoir confirmé que Vercel sert la révision livrée et
# rend le verdict dans le terminal. `.github/scripts/check-seo-probe-strict.py`
# refuse toute invocation hors `--strict`, dans les workflows COMME dans ce
# fichier de livraison.
#
# Elle n'a besoin d'AUCUN secret : elle lit du HTML public. C'est ce qui la rend
# capable de constater un écart de configuration que le dépôt ne peut pas
# connaître autrement (les `VITE_*` sont inlinées au build par Vercel).
on:
  schedule:
    # 06:17 UTC : hors des heures pleines, pour ne pas concurrencer les crons
    # d'autres dépôts sur un runner partagé.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Sonde SEO de la production (stricte)
    runs-on: ubuntu-latest
    # Plafond : sans lui, un blocage sur la production laisserait le job
    # patienter jusqu'à l'abandon du runner (360 min) au lieu de rougir.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Aucune dépendance à installer : le script n'utilise que des modules
      # `node:` et `fetch`. Il lit l'accueil réellement servi ET le sitemap, puis
      # échoue en nommant chaque intégration absente et la variable à poser.
      - name: Lire le HTML servi et échouer si une intégration manque
        working-directory: frontend
        run: node scripts/check-seo-production.js --strict
