name: Backend health probe (daily)

# ─── Sonde périodique de santé backend, PayDunya & fournisseur email ───────
# Surveille l'API publique https://api.kojoforafrica.cc.cd :
# 1. Vérifie le statut global (status == healthy) sur /health.
# 2. Vérifie la connexion persistante à la base MongoDB (database == connected).
# 3. Vérifie l'état du circuit breaker PayDunya (paydunya_circuit.state == closed).
#    Échoue immédiatement et alerte si le circuit est ouvert ('open').
# 3 bis. Juge le DIAGNOSTIC de paiement (`paiement` dans /health, 31/10/2026) :
#    la paire `closed` / 0 échec ne disait pas si les clés existent, si un
#    paiement a été exercé, ni POURQUOI il a échoué. La sonde refuse un bloc
#    absent (révision à redéployer), `configured: false`, `state: echec` (en
#    publiant son motif) et toute contradiction entre les deux lectures du même
#    circuit ; `inconnu` (configuré, aucune vente depuis le déploiement) est
#    publié en WARN — zéro vente n'est pas une panne.
# 4. Vérifie /monitor/email : le fournisseur email ACTIF répond et son
#    expéditeur est utilisable — un fournisseur muet échoue en le NOMMANT
#    (clé refusée, domaine non vérifié, expéditeur inactif, jeton révoqué,
#    EMAIL_PROVIDER=none), au lieu d'être découvert par un utilisateur qui
#    attend son code.
# 5. Vérifie /monitor : 503 (au moins `threshold` fournisseurs down) échoue en
#    nommant les pannes ; une panne isolée sous le seuil est publiée en WARN.
on:
  schedule:
    # 06:30 UTC : après la sonde SEO
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-probe:
    name: Sonde de santé backend, PayDunya & email
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Interroger /health, le fournisseur email actif et le composite
        run: python backend/scripts/check_health_probe.py
