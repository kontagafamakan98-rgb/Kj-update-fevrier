name: Alerte des sondes de production (toutes les 6 h)

# ─── LE DESTINATAIRE DES SONDES ─────────────────────────────────────────────
# Mesuré le 27/10/2026 : `POST /api/support/robot/chat` rendait 502 en une
# seconde, cinq fois sur cinq — l'assistant de `/support` et du canal WhatsApp
# était muet. Le dépôt le SAVAIT : `ai-assistant-probe` était rouge depuis le
# 26/10 14:31. Ce qui a manqué n'est ni un test ni une sonde : c'est quelqu'un
# qui l'apprenne. Treize crons mesuraient la production, aucun ne parlait.
#
# Ce workflow est le maillon qui manquait, et il est volontairement SILENCIEUX :
#   * tout est vert → il n'écrit RIEN (ni issue, ni commentaire, ni coche) ;
#   * une sonde est rouge → il ouvre UNE issue, ou met à jour celle qui existe
#     déjà (même panne = même empreinte = aucune réécriture) ;
#   * tout est revenu vert et une issue est ouverte → il la ferme en le disant.
#
# La liste des sondes n'est PAS recopiée ici : `alerte_sondes.py` lit les
# workflows qui portent un `schedule:` — une sonde ajoutée demain est surveillée
# sans qu'on touche à ce fichier, et une sonde retirée cesse d'être attendue.
#
# Trois sorties, jamais deux : 0 = verdict rendu (rouge signalé, ou tout vert),
# 2 = PRÉMISSE (jeton absent, API illisible, moins de huit sondes lues, aucun run
# lu) — le run est alors ROUGE, parce qu'une surveillance aveugle qui se tait est
# exactement la panne du 27/10, une couche plus haut.
# ─── LA CADENCE, MESURÉE PUIS CORRIGÉE (03/11/2026) ──────────────────────────
# Ce workflow était QUOTIDIEN, donc une panne planifiée pouvait rester muette
# jusqu'à 24 h : mesuré le 03/11, le job de sauvegarde (`backup-db.yml`) a
# échoué à 02:40 et l'alerte ne l'aurait dit qu'à 07:50 le lendemain, soit
# ~29 h après le début du run — pendant que la veille SEO, la typographie et
# `hreflang` étaient, elles, vertes, donc rien ne pressait personne.
#
# Quatre passages par jour (environ toutes les 6 h) bornent ce retard à la
# cadence elle-même : la dernière exécution manquée est lue au passage
# suivant, pas au suivant du lendemain.
#
# Ce que la cadence NE casse pas, et c'est ce qui autorise à la raccourcir :
#   * 07:50 est CONSERVÉ et reste le passage de référence — la dernière sonde
#     planifiée démarre à 07:32 et a 10 min de budget, donc ce passage lit des
#     runs TERMINÉS, tout le corpus d'un coup.
#   * aux trois autres heures, une sonde EN COURS n'est pas un rouge : elle est
#     classée « non jugée » (`statut` non terminé), et l'empreinte d'une issue
#     ne porte QUE les échecs — un run en cours ne réécrit donc aucune issue et
#     n'ouvre rien. C'est la règle du 27/10 (un `cancelled` n'est pas un rouge)
#     appliquée à l'heure : personne n'apprend une panne qui n'existe pas.
#   * le coût est de ~30 appels d'API par passage, très loin du quota horaire.
# Sept minutes après la minute des sondes horaires pleines, pour ne pas lire
# une sonde qui vient de démarrer à la même minute.
on:
  schedule:
    - cron: '50 7 * * *'   # passage de référence, après la dernière sonde du matin
    - cron: '20 13 * * *'
    - cron: '20 19 * * *'
    - cron: '20 1 * * *'
  workflow_dispatch:

permissions:
  actions: read    # lire la conclusion des runs des sondes
  issues: write    # n'écrire QUE l'issue d'alerte
  contents: read   # checkout : lire la liste des workflows du dépôt

concurrency:
  group: alerte-sondes
  cancel-in-progress: false

jobs:
  alerte:
    name: Alerte des sondes de production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Aucune neutralisation : la sortie du script est le verdict du run. Un 2
      # (prémisse) DOIT rougir ce job — c'est le seul cas où la surveillance est
      # muette, et un rouge est préférable à un silence.
      - name: Lire l'état des sondes et n'écrire que si quelque chose casse
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/alerte_sondes.py --branche "${{ github.event.repository.default_branch || 'main' }}"
