name: Secrets — historique complet (passe unique, rejouable)

# ─── Pourquoi ce workflow existe séparément de `secret-scan` ────────────────
# Le gate de PR juge les commits qu'UNE PR apporte (`base...HEAD`). Il ne peut
# pas juger l'historique : un constat de 2025 y resterait rouge pour toujours,
# et aucune PR ne peut corriger un commit passé. L'historique a donc sa PROPRE
# passe, à la demande — c'est ce qui rend le gate de PR à la fois rapide et
# honnête : on ne demande pas à une PR de répondre de trois ans de commits.
#
# ── Ce que la passe a trouvé, et ce qu'elle a coûté (20/10/2026) ─────────────
# `gitleaks 8.30.1 git --log-opts="--all"` : 2 115 commits, 32,1 Mo, 21
# constats, 6 valeurs distinctes, AUCUN secret réel. Les exceptions qui en
# découlent sont DÉCLARÉES dans `.gitleaks.toml` (empreintes SHA-256 de
# `etat-reference.json`, jeton factice de la sonde d'exposition, préfixe de
# repli JWT d'avant le fail-fast borné à SES commits, jeton volontairement
# invalide d'un script d'audit supprimé) — chacune bornée par chemin, commit et
# règle, jamais par valeur.
#
# ── Ce qu'elle ne peut pas faire ────────────────────────────────────────────
# Elle ne VOIT que les commits présents dans le clone (`fetch-depth: 0` : tout
# ce que le dépôt contient réellement). Un commit poussé puis supprimé de
# toutes les branches peut rester accessible par son SHA, hors de `--all` : le
# GitHub Security Lab le nomme, et cette passe ne le cherche pas. Elle ne
# réécrit rien non plus : trouver un secret ne le révoque pas — c'est une
# décision humaine (rotation), que le rapport nomme sans publier la valeur.
#
# ── Pourquoi un dispatch, et pas un cron ────────────────────────────────────
# L'historique ne change que par un push : le rejouer chaque nuit produirait le
# même verdict sur le même contenu, et un rouge permanent sur un fait ancien
# s'apprend à être ignoré — exactement ce que le gate de PR refuse. Le
# dispatch est là pour REJOUER la passe quand l'historique a bougé (fusion d'un
# import, réécriture d'une branche) ou pour la dater dans un rapport.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-history
  cancel-in-progress: false

jobs:
  historique:
    name: Historique complet (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          # `--all` ne peut lire que ce qui est dans le clone : un clone partiel
          # ferait de cette passe un vert sur l'historique qu'elle n'a pas.
          fetch-depth: 0

      - name: Installer gitleaks (version épinglée, empreinte vérifiée)
        run: sh .github/scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"

      - name: Scanner TOUT l'historique — BLOQUANT
        run: |
          set -euo pipefail
          ATTENDUS=$(git rev-list --count --all)
          echo "Historique jugé : $ATTENDUS commit(s)"
          {
            echo "### Scan de secrets — historique complet"
            echo ""
            echo "- \`--all\` : $ATTENDUS commit(s)"
          } >> "$GITHUB_STEP_SUMMARY"
          gitleaks git . --log-opts="--all" --config .gitleaks.toml --redact \
            --report-format json --report-path "$RUNNER_TEMP/secrets.json" \
            --exit-code 0 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          python3 .github/scripts/rapport-secrets.py \
            --rapport "$RUNNER_TEMP/secrets.json" \
            --journal "$RUNNER_TEMP/gitleaks.log" \
            --commits-attendus "$ATTENDUS"
