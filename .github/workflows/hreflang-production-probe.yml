name: Documents par langue et sitemap bilingue (daily)

# ─── Pourquoi cette sonde existe ────────────────────────────────────────────
# Depuis le 30/10/2026, le frontend publie un document par langue indexée
# (`/jobs` en français, `/en/jobs` en anglais), chacun avec son `<html lang>`, son
# `rel=canonical` et ses `<link rel="alternate" hreflang>` réciproques, et le
# sitemap du backend annonce les mêmes URL (`kojo_langues`).
#
# Trois gardes hors ligne le tiennent déjà : `check-prerender-shells.js` (sur
# l'artefact du build), `backend/tests/test_hreflang_sitemap.py` (le sitemap
# annonce les mêmes langues) et le test du module de déclaration. Ce qu'aucun ne
# peut dire, c'est ce que le DÉPLOIEMENT sert :
#
#   • un rewrite Vercel perdu (`/en/jobs` → `/en/jobs.html`) ne casse pas le
#     build : il rend la 404, ou pire la coquille de l'application — un document
#     valide, à la mauvaise langue et sans la page dedans ;
#   • un `lang="fr"` resté dans une coquille anglaise, un `canonical` qui pointe
#     la version française, une liste `hreflang` écrite d'un seul côté (une
#     déclaration non réciproque est ignorée par le moteur) ne se voient que sur
#     l'origine servie ;
#   • un sitemap qui n'énumère que le français dit au moteur que l'anglais
#     n'existe pas, quels que soient les documents.
#
# Trois sorties, jamais deux :
#   0 — chaque page déclarée sert, dans chaque langue, son lang, son canonical et
#       la même liste hreflang (x-default compris), et le sitemap énumère les
#       deux versions de chaque page qu'il publie ;
#   1 — refus nommé (statut, coquille SPA servie, lang faux, canonical croisé,
#       alternative manquante ou en trop, sitemap à moitié bilingue, alternative
#       sur une page monolingue, ou bloc `langues` de /health qui contredit ce
#       qui est servi) ;
#   2 — prémisse : corpus vide, aucune page lisible, SITEMAP ILLISIBLE, ou
#       /health illisible (transport, statut non-200, corps qui n'est pas du
#       JSON) — la partie concernée n'a pas été jugée, et un vert dirait qu'elle
#       l'a été. Une prémisse rougit le run.
#
# ─── Le bloc `langues` de /health, confronté (01/11/2026) ────────────────────
# Le bloc publie le VOLUME des langues depuis le 01/11/2026, et la sonde de
# santé du backend le juge pour lui-même. Ce que celle-ci ajoute est la seule
# chose qu'aucune autre ne dit : le confronter à ce qu'elle VIENT DE MESURER —
# parce qu'un bloc bien formé peut décrire un autre site que celui qui est
# servi, et c'est ce qui arrive quand le backend déployé est en retard sur le
# frontend (il annonce deux langues et un volume d'avant, chaque moitié étant
# « vraie »). Il est lu sur l'origine du BACKEND, pas sur celle du site :
# vercel.json ne proxifie que /api/** et /sitemap.xml, donc ${SITE_ORIGIN}/health
# répondrait 404. Les TOTAUX ne sont pas confrontés (le sitemap porte aussi des
# fiches /jobs/:id et des profils /workers/:id, que le bloc ne décrit pas) :
# c'est écrit dans la sonde et prouvé par un de ses cas.
#
# Aucune URL n'est recopiée : la sonde lit `src/config/page-meta.js` (les routes
# pré-rendues), `src/config/langues-indexees.js` (langues, préfixes, alternatives)
# et `src/config/liens-seo.js` (les pages monolingues). Une page ajoutée à la
# table est donc jugée le lendemain, sans toucher à ce fichier.
on:
  schedule:
    # 07:40 UTC : après les sondes de document (07:04 → 07:36), hors des heures
    # pleines.
    - cron: '40 7 * * *'
  workflow_dispatch:
    inputs:
      site:
        description: "Origine à juger (défaut : vide = production)"
        required: false
        default: ""
      route:
        description: "Route d'une seule page à juger (défaut : vide = les 12 pré-rendues)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    name: Documents /en, canonical et hreflang réciproques (production)
    runs-on: ubuntu-latest
    # Plafond : 25 requêtes HTTP, aucun navigateur installé. Une sonde qui ne
    # conclut pas doit rougir, pas patienter jusqu'à l'abandon.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # La sonde n'importe que des modules du dépôt (`langues-indexees.js`,
      # `page-meta.js`, `liens-seo.js`, `site-meta.js`) : aucune dépendance n'est
      # installée, et la passe reste à ~25 requêtes.
      - name: Mesurer les documents par langue et le sitemap
        working-directory: frontend
        env:
          SITE_A_JUGER: ${{ inputs.site }}
          ROUTE_A_JUGER: ${{ inputs.route }}
        run: |
          arguments=()
          if [ -n "$SITE_A_JUGER" ]; then
            arguments+=(--base "$SITE_A_JUGER")
          fi
          if [ -n "$ROUTE_A_JUGER" ]; then
            arguments+=(--route "$ROUTE_A_JUGER")
          fi
          node scripts/check-hreflang-production.js ${arguments[@]+"${arguments[@]}"}
