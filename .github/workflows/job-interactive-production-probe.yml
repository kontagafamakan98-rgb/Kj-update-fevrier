name: Job page interactive probe (daily)

# ─── Pourquoi cette sonde existe ────────────────────────────────────────────
# `check-job-page-production.js` (cron 07:10) juge le DOCUMENT servi de
# `/jobs/:id` : point d'entrée présent une fois, feuille avant le module, bloc
# `kojo-job-data` accordé. C'est nécessaire et ce n'est pas suffisant : un
# document parfait peut charger un module qui ne s'exécute pas (entrée 404,
# erreur au premier rendu), et un crawler n'en voit rien — il lit le HTML.
# Le seul arrivant d'un lien partagé, lui, reçoit alors une fiche statique, sans
# châssis ni bouton : une page morte qui passe tous les autres verts.
#
# Cette sonde ouvre donc la fiche dans un vrai Chromium, contexte VIERGE, et
# juge l'EXÉCUTION :
#   1. le montage — `#root` porte le châssis de l'application (`#root nav`), et
#      plus la coquille statique écrite par le backend ;
#   2. la fiche peinte — le `<h1>` de `#root` est celui du bloc
#      `kojo-job-data` (React a consommé la vue publique) ;
#   3. le geste — un clic RÉEL sur l'action de la carte mène à une navigation
#      CLIENTE : un marqueur posé dans `window` avant le clic survit, l'adresse
#      attendue est atteinte, `#root` porte encore le châssis. Un bouton sans
#      gestionnaire ou un `<a href>` sans routeur sont refusés, nommément.
#
# Aucune ÉCRITURE : le geste ouvre `/login` (mission ouverte) ou
# `/how-it-works` (bandeau de séquestre). Il ne soumet rien, ne propose rien.
#
# Trois sorties, jamais deux :
#   0 — fiche montée, peinte et interactive ; 1 — refus nommé ;
#   2 — prémisse : aucune fiche au sitemap, ou Chromium indisponible (outillage).
#       Une prémisse n'est jamais un vert.
#
# Le coût assumé : Chromium est installé à chaque run (~1 min), et la sonde ne
# juge qu'un moteur (Chromium) et une fiche par passage. La matrice des moteurs
# et le rendu visuel restent la suite e2e, sur pile locale.
on:
  schedule:
    # 07:16 UTC : après la sonde du document (07:10) et celle du profil
    # travailleur (07:04), hors des heures pleines.
    - cron: '16 7 * * *'
  workflow_dispatch:
    inputs:
      site:
        description: "Origine frontend à juger (défaut : vide = production)"
        required: false
        default: ""
      job:
        description: "Fiche à juger : identifiant ou URL /jobs/:id (défaut : vide = sitemap)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    name: Fiche mission interactive (production)
    runs-on: ubuntu-latest
    # Plafond : une production qui ne monte plus doit rougir, pas patienter
    # jusqu'à l'abandon du runner (installation du navigateur comprise).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Playwright vient du lockfile : l'installer au lock (et non un `npx`
      # flottant) garde le même binaire que la suite e2e, et le cache npm suit
      # `frontend/package-lock.json`.
      - name: Installer les dépendances du frontend
        working-directory: frontend
        run: npm ci

      # Sans binaire, la sonde rendrait une prémisse — jamais un vert, mais
      # aucune mesure. Le job DOIT échouer ici si l'installation casse.
      - name: Installer Chromium (sonde navigateur)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Juger le démarrage réel de /jobs/:id
        working-directory: frontend
        env:
          SITE_A_JUGER: ${{ inputs.site }}
          FICHE_A_JUGER: ${{ inputs.job }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          arguments=()
          if [ -n "$SITE_A_JUGER" ]; then
            arguments+=(--base "$SITE_A_JUGER")
          fi
          if [ -n "$FICHE_A_JUGER" ]; then
            arguments+=(--job "$FICHE_A_JUGER")
          fi
          node scripts/check-job-interactive-production.js ${arguments[@]+"${arguments[@]}"}
