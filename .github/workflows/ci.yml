name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend : tests Python (FakeDB + vrai MongoDB) ──────────────────────
  backend-tests:
    name: Backend tests (Python + MongoDB)
    runs-on: ubuntu-latest

    # Vrai MongoDB : la suite s'exécute contre une vraie instance (mode
    # TEST_MONGO_URL), ce qui couvre l'atomicité, les indexes et les
    # opérateurs réels que la FakeDB locale ne reproduit pas.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Syntax check (py_compile)
        working-directory: backend
        run: python -m py_compile server.py tests/*.py

      - name: Static check — no undefined names (pyflakes)
        working-directory: backend
        run: |
          pip install --quiet pyflakes
          UNDEFINED=$(python -m pyflakes kojo_*.py server.py | grep "undefined name" || true)
          if [ -n "$UNDEFINED" ]; then
            echo "$UNDEFINED"
            echo "::error::Noms non définis détectés (imports manquants lors du découpage)"
            exit 1
          fi
          echo "✓ Aucun nom non défini dans les modules kojo_*"

      - name: Run tests against real MongoDB
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-kojo-32-chars-minimum
          EMAIL_OTP_SECRET: ci-otp-secret-kojo-32-chars-minimum
          TEST_MONGO_URL: mongodb://localhost:27017
          DB_NAME: kojo_test
          APP_ENV: test
          REDIS_URL: ""
          DISABLE_TRUSTED_HOST_MIDDLEWARE: "true"
        run: python -m pytest tests/ -q --tb=short

  # ─── Frontend : tests Vitest + build Vite ────────────────────────────────
  frontend-build:
    name: Frontend tests + build (Node/Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://kojo-backend-03az.onrender.com/api
        run: npm run build

      - name: Check bundle size
        working-directory: frontend
        run: |
          BUILD_SIZE=$(du -sh build/ | cut -f1)
          echo "Bundle size: $BUILD_SIZE"
