name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Déploiement backend manuel à la demande (sans attendre un push qui
  # touche backend/**). Bouton « Run workflow » → sélectionner la branche
  # main. Le job deploy-fly s'exécute alors même sans changement de code.
  workflow_dispatch:

jobs:
  # ─── Méta-test des audits : vérifie que les garde-fous échouent sur une
  # régression injectée (sinon ils ne protègent rien). Indépendant : crée des
  # fixtures temporaires, assert exit 1 sur chaque audit, puis nettoie. ─────
  audit-regression-test:
    name: Audits détectent les régressions
    runs-on: ubuntu-latest
    # Un job sans plafond patiente 360 min avant que le runner ne l'abandonne :
    # un blocage (réseau, service) laisserait une PR « en cours » au lieu de
    # rougir. Plafonds ~3× la durée mesurée (CI-COVERAGE.md, §7).
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # `pyflakes` est installé à chaque run (non épinglé, donc rien dans le
      # dépôt ne dit quelle version il faut) : la clé de cache ne peut pas
      # décrire ce qui est installé, elle suit donc le fichier de référence des
      # dépendances Python du dépôt — comme `backend-tests` et `lighthouse-ci`.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (audit_api_returns.cjs requiert @babel/parser)
        working-directory: frontend
        run: npm ci

      - name: Injecter une régression backend (route sans docstring) → échec attendu
        working-directory: backend
        run: |
          cat > tests/fixtures_audit_regression.py <<'PYEOF'
          from fastapi import APIRouter
          router = APIRouter()


          @router.get("/regression/probe")
          async def regression_probe():
              return {"ok": True}
          PYEOF
          set +e
          python scripts/audit_docstrings.py --fail-on-warning tests/fixtures_audit_regression.py > /tmp/audit_out.txt 2>&1
          EXIT_CODE=$?
          set -e
          rm -f tests/fixtures_audit_regression.py
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::error::audit_docstrings.py a PASSÉ alors qu'une route sans docstring était injectée"
            cat /tmp/audit_out.txt
            exit 1
          fi
          echo "✓ audit_docstrings.py échoue sur une route sans docstring (exit $EXIT_CODE)"

      - name: Injecter une régression frontend (endpoint fantôme) → échec attendu
        working-directory: frontend
        run: |
          cat > src/services/fixtureRegression.js <<'JSEOF'
          import { api } from './api';

          export const regressionProbe = {
            /** @returns {Promise<object>} Appel vers un endpoint inexistant. */
            fetchMissing: () => api.get('/totally/missing-endpoint'),
          };
          JSEOF
          set +e
          node scripts/audit_api_returns.cjs --fail-on-warning > /tmp/audit_fe_out.txt 2>&1
          EXIT_CODE=$?
          set -e
          rm -f src/services/fixtureRegression.js
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::error::audit_api_returns.cjs a PASSÉ alors qu'un endpoint fantôme était injecté"
            cat /tmp/audit_fe_out.txt
            exit 1
          fi
          echo "✓ audit_api_returns.cjs échoue sur un endpoint fantôme (exit $EXIT_CODE)"

      - name: Injecter une régression syntaxe Python (py_compile) → échec attendu
        working-directory: backend
        run: |
          cat > tests/fixtures_pycompile_regression.py <<'PYEOF'
          from fastapi import APIRouter
          router = APIRouter()


          @router.get("/break")
          async def broken(  # parenthèse jamais fermée — SyntaxError
          PYEOF
          set +e
          python -m py_compile tests/fixtures_pycompile_regression.py > /tmp/pyc_out.txt 2>&1
          EXIT_CODE=$?
          set -e
          rm -f tests/fixtures_pycompile_regression.py
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::error::py_compile a PASSÉ alors qu'un fichier syntaxiquement invalide était injecté"
            cat /tmp/pyc_out.txt
            exit 1
          fi
          echo "✓ py_compile échoue sur une syntaxe invalide (exit $EXIT_CODE)"

      - name: Injecter une régression pyflakes (nom non défini) → échec attendu
        working-directory: backend
        run: |
          pip install --quiet pyflakes
          cat > kojo_routers_break.py <<'PYEOF'
          from fastapi import APIRouter
          router = APIRouter()


          @router.get("/break")
          async def broken():
              return undefined_variable_xyz
          PYEOF
          UNDEFINED=$(python -m pyflakes kojo_routers_break.py | grep "undefined name" || true)
          rm -f kojo_routers_break.py
          if [ -z "$UNDEFINED" ]; then
            echo "::error::pyflakes a PASSÉ alors qu'un nom non défini était injecté"
            exit 1
          fi
          echo "✓ pyflakes échoue sur un nom non défini"

      - name: Vérifier le passage sans régression (baseline)
        working-directory: backend
        run: |
          python scripts/audit_docstrings.py --fail-on-warning
          python -m py_compile server.py tests/*.py
          cd ../frontend
          node scripts/audit_api_returns.cjs --fail-on-warning
          echo "✓ Baseline : audits, py_compile et pyflakes passent sans régression injectée"

  # ─── Garde-fou permanent des workflows : actionlint + shellcheck ─────────
  # S'exécute à CHAQUE push/PR (comme le reste du workflow) : un changement de
  # workflow invalide (syntaxe YAML cassée, expression ${{ }} erronée, chemin
  # de step/needs inconnu, script shell buggé) fait échouer le run AVANT toute
  # conséquence. Actionlint embarque les problem matchers (annotations inline
  # sur les fichiers concernés).
  workflow-lint:
    name: Workflow lint (actionlint + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # actionlint : validité syntaxe ET sémantique de ci.yml (expressions
      # ${{ }}, if:, needs, uses, concurrency...). L'action officielle scane
      # .github/workflows/*.yml — si CI lui-même est invalide à un commit, ce
      # job échoue (le garde-fou se teste lui-même). Tag ÉPINGLÉ (v1.7.12) :
      # le dépôt rhysd/actionlint ne publie pas de tag flottant « v1 ».
      - name: Lint workflows (actionlint)
        uses: rhysd/actionlint@v1.7.12

      # Épinglage des `uses:` : chaque référence d'action doit viser un tag de
      # VERSION ou un SHA, jamais une branche. Une référence non résoluble fait
      # échouer le job AVANT ses étapes — c'est arrivé le 2026-08-27 avec
      # `rhysd/actionlint@v1` (« Unable to resolve action »), un rouge
      # d'infrastructure sans rapport avec le code. Voir
      # .github/scripts/check-workflow-pins.py.
      #
      # Le garde prend UN chemin : il est donc appelé sur TOUS les fichiers de
      # .github/workflows/. Tant qu'il ne voyait que ci.yml, ajouter un second
      # workflow ouvrait un trou invisible — précisément le défaut qu'il existe
      # pour empêcher (le 18/09/2026, seo-vercel-env.yml est né sans garde).
      #
      # `python3` (et non `python`) : ce job n'installe pas Python via
      # setup-python, seule la commande `python3` de l'image du runner est
      # garantie — le script est en stdlib pure, aucun paquet à installer.
      - name: Check action pins (no branch refs)
        run: |
          for workflow in .github/workflows/*.yml; do
            python3 .github/scripts/check-workflow-pins.py "$workflow"
          done

      # Assertions d'existence sur un export (`callable(...)`, `is not None`
      # comme condition entière, `.toBeDefined()`) : elles restent vertes même
      # quand l'export ne fait plus rien, et elles reviennent au prochain ajout
      # de test. Ce garde empêche le nettoyage du 18/09/2026 de se reperdre —
      # voir .github/scripts/check-test-existence-assertions.py, dont les cas
      # acceptés/refusés sont verrouillés par
      # backend/tests/test_existence_assertion_guard.py.
      - name: Check test assertions describe behaviour (no export existence)
        run: python3 .github/scripts/check-test-existence-assertions.py

      # La sonde SEO a DEUX modes, et le mode INFORMATIF est celui qui a laissé
      # F9 ouvert (quatre intégrations SEO/analytics absentes de la production,
      # un `::notice` par fait constaté, aucun run rouge nulle part). L'étape
      # informative de ce fichier a été retirée le 10/10/2026 pour cette raison
      # exacte — mais rien n'empêchait de la reposer, et le mode par DÉFAUT du
      # script reste l'informatif : c'est l'oubli de `--strict` qui est
      # silencieux, pas le rappel.
      #
      # Le garde lit TOUT `.github/workflows/` (même choix que celui des pins) :
      # un workflow ajouté demain est couvert sans être inscrit ici. Il refuse
      # aussi une étape stricte qui ne peut PAS échouer (`continue-on-error`,
      # commande neutralisée), et il REFUSE DE CONCLURE s'il ne lit aucune
      # invocation — un garde qui ne voit rien ne prouve rien. Voir
      # .github/scripts/check-seo-probe-strict.py.
      - name: Check the SEO probe is always invoked strict (no informative step)
        run: python3 .github/scripts/check-seo-probe-strict.py

      # ── LA FAMILLE de F9, pas seulement la sonde SEO ──────────────────────
      # F9 avait une cause unique — une étape qui publie un rapport sans pouvoir
      # faire rougir le run — et la sonde SEO n'en était qu'une INSTANCE. La
      # syntaxe qui la produisait est, elle, disponible partout :
      # `continue-on-error: true`, une commande neutralisée (`|| true`, `|| :`,
      # `|| exit 0`), des erreurs ignorées (`set +e`). Rien n'empêchait d'en
      # reposer une ailleurs : le step serait vert, le rapport publié, personne
      # ne rougirait — exactement le silence que F9 a coûté deux jours.
      #
      # L'inventaire mesuré le 12/10/2026 : 7 formes sur 152 étapes lues, et
      # AUCUNE n'était un défaut — quatre harnais de mutation qui encadrent UNE
      # commande dont l'échec est le résultat attendu, l'extraction d'un tableau
      # pip-audit, un `kill` de PID déjà sorti, une invite sdkmanager. Ce garde
      # ne les interdit pas : il les rend VISIBLES et exige qu'elles soient
      # DÉCLARÉES, une par une, avec leur motif, dans
      # .github/scripts/informative-steps.json. Une déclaration périmée, un
      # compte qui change, un motif trop court : refusés. Et sous 40 étapes lues,
      # il refuse de conclure (un garde qui ne voit rien ne prouve rien).
      - name: Check no workflow step can fail silently (declared registry)
        run: python3 .github/scripts/check-informative-steps.py

      # ── LES DEUX PÉRIMÈTRES DU GATE, LA MÊME LISTE ────────────────────────
      # Deux chemins appliquent le même gate et, le 12/10/2026, ils ne
      # jugeaient pas la même chose : la protection de `main` exigeait HUIT
      # checks nommés pendant que ce fichier en déclarait ONZE, et la livraison
      # automatique (.github/scripts/livrer.py) attendait, elle, TOUS les
      # check-runs. Une fusion faite dans l'interface GitHub pouvait donc passer
      # avec la suite e2e rouge (15 rouges / 27 exécutions, dont un cas réel) et
      # avec des avis de sécurité de PRODUCTION non corrigés — quand le trajet
      # de livraison refusait ces mêmes runs.
      #
      # La liste vit UNE fois (.github/scripts/gate-perimetre.json) : la
      # protection de `main` et la livraison attendent exactement ces checks.
      # Ce garde rend le verdict HORS LIGNE, donc dans un job requis : chaque
      # check déclaré doit nommer un job de `ci.yml` — par son identifiant ET par
      # le nom que GitHub rapportera (un nom qui a dérivé ferait attendre les
      # deux périmètres un check-run qui n'arrivera jamais) — et tout job de
      # `ci.yml` doit être soit déclaré, soit exempté AVEC son motif.
      #
      # La protection de branche RÉELLE, elle, ne se lit qu'avec un jeton admin
      # du dépôt : ce job ne peut pas l'obtenir, c'est pourquoi cette comparaison
      # vit dans le pré-vol de `livrer.py` (qui a le jeton) et dans
      # `check-gate-perimetre.py --en-ligne` pour un run manuel. Le garde refuse
      # de conclure sous ses planchers de lecture (8 checks, 10 jobs lus) : un
      # lecteur cassé rendrait tous ses refus muets.
      - name: Check the delivery and branch protection gate the same checks
        run: python3 .github/scripts/check-gate-perimetre.py

      # ── UNE MUTATION LAISSÉE EN PLACE NE SURVIT PLUS À UNE SUITE LOCALE ───
      # Le harnais de mutation écrit dans un fichier RÉEL du dépôt, restaure, et
      # VÉRIFIE sa restauration par empreinte : tant qu'il va au bout, rien ne
      # reste derrière lui. Mais un processus TUÉ entre l'écriture et la
      # restauration (Ctrl-C, commande expirée, runner annulé) ne restaure rien,
      # et RIEN ne le disait : la suite locale repassait verte sur un dépôt muté,
      # garde neutralisé compris.
      #
      # Ce garde refuse qu'un fichier du dépôt s'écarte de son ÉTAT DE RÉFÉRENCE
      # sans l'avoir déclaré. Le périmètre se DÉRIVE des mutations déclarées
      # (guard-proofs.json), moins la machinerie déclarée hors périmètre dans
      # .github/scripts/etat-reference.json — une surface aveugle se déclare, avec
      # motif, remède et date. Il refuse une dérive non déclarée (avec ses deux
      # empreintes), une MUTATION ENCORE EN PLACE (que le registre des preuves
      # nomme), une cible sans état de référence, une entrée périmée, une
      # déclaration muette, et refuse de conclure sous son plancher de lecture.
      #
      # Ce qu'il a trouvé à sa pose, le 16/10/2026 : une mutation restée en place
      # dans frontend/scripts/check-prerender-shells.js — le refus du catch-all
      # neutralisé dans l'arbre de travail, sans que rien ne le signale.
      - name: Check no repo file drifted from its reference state (declared)
        run: python3 .github/scripts/check-etat-reference.py

      # ── UNE PREUVE DATÉE NE VAUT QUE FRAÎCHE ──────────────────────────────
      # `backend/SAUVEGARDES_ATLAS.md` est ce qui autorise à dire « on est prêt
      # à restaurer » : son §3 porte un exercice DATÉ, et c'est la seule preuve
      # que les commandes de restauration ont été lancées pour de vrai. Rien ne
      # disait qu'elle PÉRIMAIT : un exercice d'il y a six mois reste « daté »,
      # donc vert à la lecture, alors qu'il ne décrit plus une capacité mais une
      # intention — le dépôt a changé, les commandes ont bougé, la personne qui
      # les a lancées n'est plus forcément là. Même famille que F9/F17 : un fait
      # qu'on croit mesuré parce qu'il est écrit.
      #
      # Le garde lit le SEUL repère stable — un titre `##`/`###` nommant un
      # exercice ET portant une date JJ/MM/AAAA —, écarte un titre « non
      # exécuté » (§3bis : préparé n'est pas fait), refuse une date illisible,
      # impossible ou future, et juge l'âge contre la cadence que le runbook
      # ANNONCE lui-même (trimestre) plus une marge. Un runbook tronqué le fait
      # refuser de conclure : un lecteur cassé ne rend pas un vert.
      #
      # Aucune neutralisation ici : une étape qui ne peut pas rougir ne
      # surveille rien (cf. check-informative-steps.py).
      - name: Check the dated restoration drill is still recent
        run: python3 .github/scripts/check-exercice-restauration.py

      # ── LA RÉPARATION DU BUS N'EST PAS PLUS BAVARDE QUE CE QU'ELLE REMPLACE ─
      # Le pub/sub Redis n'a pas d'historique : chaque interruption de
      # l'abonnement ouvre une fenêtre aveugle, et la réparation est une
      # relecture TOTALE des flux locaux (`resync`, backend/kojo_live.py). Un
      # plancher borne cette cadence pour qu'un Redis qui bat de l'aile ne la
      # transforme pas en tornade de requêtes. Le module ÉNONCE la règle —
      # « relire à chaque reprise serait plus bavard que le sondage remplacé
      # (2 req/min) » — mais rien ne la vérifiait : le plancher valait 10 s,
      # TROIS FOIS plus bavard que le sondage remplacé, et aucune suite ne
      # confrontait les deux. Une rafale de reconnexions produisait donc six
      # relectures par minute et par flux, chacune un aller-retour complet côté
      # client — plus d'allers-retours que le mécanisme remplacé.
      #
      # Le seuil du sondage remplacé est LU là où il est déclaré une seule fois
      # (`ANCIEN_SONDAGE_MS`, .github/scripts/check-fly-env-drift.py — que la
      # sonde en ligne et le test du repli client lisent déjà), jamais recopié :
      # deux seuils divergeraient en silence, ce qui est l'incident du 18/10/2026
      # côté battement de cœur (15 s contre 20 s, deux sources).
      #
      # Aucune neutralisation : une étape qui ne peut pas rougir ne surveille
      # rien (cf. check-informative-steps.py).
      - name: Check the resync floor is not chattier than the poll it replaced
        run: python3 .github/scripts/check-resync-parite.py

      # shellcheck (pré-installé sur ubuntu-latest) : analyse statique des
      # scripts shell du dépôt. Échoue sur les erreurs (les warnings restent
      # informatifs — comportement par défaut de shellcheck).
      - name: Lint shell scripts (shellcheck)
        run: |
          shellcheck .github/scripts/*.sh
          shellcheck backend/scripts/*.sh


  # ─── Fly : comparaison doc↔prod des variables d'environnement ───────────
  # Vérifie que fly.toml [env] (référence commitée) reste synchronisé avec
  # l'environnement réellement servi par la machine Fly, et que chaque
  # secret OBLIGATOIRE (documenté dans DEPLOY_FLYIO.md) a bien un digest
  # déployé. Échoue en cas de DRIFT (fly.toml commité mais jamais
  # redéployé) ou de secret manquant (config incomplète avant boot). Les
  # valeurs des secrets restent illisibles (digests opaques) ; seul leur
  # digest de présence/stabilité est vérifié.
  fly-env-drift:
    name: Fly env doc-prod (drift + secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # FORMAT des variables critiques dans les RÉFÉRENCES du dépôt
      # (fly.toml, .env.example, DEPLOY_FLYIO.md) : CORS_ORIGINS,
      # VAPID_CLAIMS_EMAIL, BACKEND_PUBLIC_URL, FRONTEND_APP_URL,
      # TRUSTED_HOSTS, REDIS_URL, MONGO_URL. Et les DÉLAIS DU FLUX, jugés sur
      # ce que le dépôt DÉCLARE et sur les défauts LUS : le battement
      # (`KOJO_SSE_HEARTBEAT_SECONDS`, deux battements dans la fenêtre de
      # silence du client), le bail qui en DÉCOULE (`PARTAGE_LEASE_SECONDS`),
      # et le repli du client (`FALLBACK_POLL_MS`, moins bavard que le sondage
      # remplacé et identique dans ses deux déclarations). Et le CONTRAT DES
      # DEUX DÉLAIS DU BUS (reprise bornée [1 s, un battement], file ≥
      # MAX_STREAMS_TOTAL × reprise). Sans quoi une PR qui casse un de ces
      # contrats ne rougissait qu'APRÈS la fusion, une fois déployée.
      # Déterministe — SANS token ni réseau (audit local rejouable), lancé à
      # chaque push et chaque PR.
      # Une surcharge posée en secret sur Fly échappe à cette passe : elle est
      # DÉCLARÉE dans la sortie, et c'est l'étape en ligne ci-dessous qui la
      # juge (FLY_API_TOKEN).
      - name: Audit hors ligne (formats + délais du flux et du bus)
        run: python .github/scripts/check-fly-env-drift.py --refs-only

      # flyctl est requis par le check (flyctl secrets list). Référence ÉPINGLÉE
      # sur un SHA (= tag v1, runtime node24) : elle valait @master, une branche
      # qui suit le travail amont sans revue et peut disparaître (cf. le rouge
      # `actionlint@v1` du 2026-08-27 : un `uses:` non résoluble fait échouer le
      # job avant ses étapes). L'action installe `flyctl` en version latest par
      # défaut, donc épingler l'ACTION ne fige pas la CLI.
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Check fly.toml env vs runtime + secret presence
        run: python .github/scripts/check-fly-env-drift.py
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # ── Sonde email RÉELLE : SPF / DKIM / DMARC lus sur un message reçu ────
      # Le domaine est authentifié (SPF, deux CNAME DKIM chez Brevo, DMARC) et
      # Brevo répond `dkimError: false` — rien de tout cela ne dit qu'un email
      # LIVRÉ passe les trois. La sonde envoie un OTP via l'API de production
      # vers un alias Gmail dédié puis lit l'`Authentication-Results` que Gmail
      # pose à la RÉCEPTION, seul endroit où les verdicts existent : une boîte
      # jetable ne les enregistre pas, et les recalculer sur la copie reçue est
      # impossible (le récepteur réécrit le corps, le `bh` signé ne correspond
      # plus). Échec bruyant si un verdict n'est pas `pass`.
      #
      # main uniquement : un run de PR enverrait un vrai email de production et
      # lirait la boîte de test pour rien.
      #
      # `--require-secrets` : sur `main`, l'absence des identifiants est un ÉCHEC
      # (code 1), pas une `::notice`. Ce job est un check REQUIS, donc son vert se
      # lit « les trois verdicts ont été lus » — un secret retiré éteindrait la
      # sonde en silence, et personne ne relit la notice d'un run vert. Les deux
      # secrets sont posés depuis le 18/09/2026 (mesuré sur le dépôt) : ce mode ne
      # coûte rien aujourd'hui. Un poste qui ne les a pas garde l'annulation
      # explicite, sans le drapeau.
      - name: Sonde email authentifié (SPF/DKIM/DMARC lus dans Gmail, main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python .github/scripts/check-email-auth.py --require-secrets
        env:
          KOJO_PROBE_IMAP_USER: ${{ secrets.KOJO_PROBE_IMAP_USER }}
          KOJO_PROBE_IMAP_PASSWORD: ${{ secrets.KOJO_PROBE_IMAP_PASSWORD }}
          # Alignement SPF exigé ? La sonde publie TOUJOURS la phrase
          # d'alignement (enveloppe SPF et `d=` comparés au domaine du From) ;
          # passer cette variable de dépôt à 1 fait ÉCHOUER le job si DMARC ne
          # repose que sur DKIM. À poser quand le sous-domaine brandé de Brevo
          # est en place : le gain est alors verrouillé sans toucher au code.
          #   gh variable set KOJO_REQUIRE_SPF_ALIGNMENT --body 1
          KOJO_REQUIRE_SPF_ALIGNMENT: ${{ vars.KOJO_REQUIRE_SPF_ALIGNMENT }}

  # ─── Backend : tests Python (FakeDB + vrai MongoDB) ──────────────────────
  backend-tests:
    name: Backend tests (Python + MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Vrai MongoDB : la suite s'exécute contre une vraie instance (mode
    # TEST_MONGO_URL), ce qui couvre l'atomicité, les indexes et les
    # opérateurs réels que la FakeDB locale ne reproduit pas.
    #
    # Vrai Redis : il ne sert qu'à UNE étape, celle qui prouve la traversée du
    # bus temps réel entre deux workers (`tests/test_live_bus_deux_workers.py`).
    # Le reste de la suite garde `REDIS_URL=""` — c'est-à-dire le produit SANS
    # bus, que ses cas éprouvent —, donc ce service ne change leur verdict.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies (lock vérifié par empreintes)
        working-directory: backend
        # `--require-hashes` : chaque distribution est épinglée ET son fichier
        # est vérifié contre l'empreinte SHA-256 de requirements.lock. Un
        # fichier remplacé sur PyPI fait rougir l'installation.
        run: pip install --require-hashes -r requirements.lock

      - name: Syntax check (py_compile)
        working-directory: backend
        run: python -m py_compile server.py tests/*.py

      - name: Static check — no undefined names (pyflakes)
        working-directory: backend
        run: |
          pip install --quiet pyflakes
          # Le corpus est COMPTÉ avant d'être jugé : « aucun nom non défini » sur un
          # glob qui ne résout plus (zéro fichier lu) serait un vert qui ne repose
          # sur rien. C'est la règle des planchers de lecture du dépôt, et le rapport
          # publie le compte lu.
          FICHIERS=$(find . -maxdepth 1 \( -name 'kojo_*.py' -o -name 'server.py' \) | wc -l)
          if [ "$FICHIERS" -lt 20 ]; then
            echo "::error::pyflakes n'a lu que $FICHIERS fichier(s) (plancher 20) — le corpus est cassé, ce contrôle ne prouve rien"
            exit 1
          fi
          # `|| STATUT=$?` : pyflakes sort en 1 dès qu'il a un constat, ce qui est un
          # VERDICT, pas une erreur — le code est CAPTURÉ, jamais avalé. Cette forme
          # empêche l'abandon du step : elle est DÉCLARÉE dans
          # .github/scripts/informative-steps.json avec son motif, pour qu'elle ne
          # soit pas anonyme (même règle que les autres étapes qui ne peuvent pas
          # échouer).
          STATUT=0
          python -m pyflakes kojo_*.py server.py > /tmp/pyflakes.txt 2>&1 || STATUT=$?
          # Les deux filtres sont des `awk` : ils rendent TOUJOURS 0, donc ils n'ont
          # pas besoin d'avaler un code de sortie — aucune neutralisation de plus ici.
          awk '/undefined name/' /tmp/pyflakes.txt > /tmp/pyflakes-undefined.txt
          if [ -s /tmp/pyflakes-undefined.txt ]; then
            cat /tmp/pyflakes-undefined.txt
            echo "::error::Noms non définis détectés (imports manquants lors du découpage)"
            exit 1
          fi
          # Pyflakes a-t-il RENDU un verdict ? Ses diagnostics s'écrivent
          # `fichier:ligne:colonne: message` — la forme est reconnue par son MOTIF
          # (`:ligne:colonne: `), pas par l'absence de `:` devant, parce qu'un
          # chemin absolu en porte un (`C:/…/kojo_x.py:2:12: …`) : l'ancrer sur le
          # début de ligne ferait passer un diagnostic légitime pour un
          # sans-verdict, c'est-à-dire un faux rouge.
          # Tout le reste — traceback, « No module named », sortie d'un processus
          # mort — EST un sans-verdict, et un sans-verdict ne doit pas se lire comme
          # un vert (la leçon de F9, CI-COVERAGE.md). Les autres catégories de
          # pyflakes (« imported but unused ») restent HORS du gate, À DESSEIN :
          # elles ne disent rien d'un import manquant du découpage. Elles sont
          # PUBLIÉES, pas tues.
          awk 'NF && $0 !~ /:[0-9]+:[0-9]+: /' /tmp/pyflakes.txt > /tmp/pyflakes-sans-verdict.txt
          if [ -s /tmp/pyflakes-sans-verdict.txt ]; then
            cat /tmp/pyflakes-sans-verdict.txt
            echo "::error::pyflakes n'a pas rendu de verdict (sortie code $STATUT qui n'est pas un diagnostic) — rien n'a été vérifié"
            exit 1
          fi
          if [ -s /tmp/pyflakes.txt ]; then
            echo "Autres constats pyflakes (hors gate : ce contrôle ne juge que les noms non définis) :"
            cat /tmp/pyflakes.txt
          fi
          echo "✓ Aucun nom non défini dans les $FICHIERS fichier(s) lus (pyflakes, code $STATUT)"

      - name: Docstrings des endpoints (audit_docstrings.py, strict)
        working-directory: backend
        run: python scripts/audit_docstrings.py --fail-on-warning

      # ── Les durées publiées sont-elles celles que le code applique ? ────────
      # PRIVACY.md est le document que personne ne relit quand un délai change,
      # et la durée d'un TTL vivait jusqu'ici dans trois fichiers qui ne se
      # parlaient pas. Le tableau du document est donc ENGENDRÉ depuis
      # backend/kojo_retention.py — le module dont kojo_core crée ses index — et
      # cette étape refuse une divergence en nommant la collection et la colonne
      # fautives, plutôt qu'un « le document ne correspond pas ».
      #
      # Cette étape est le SEUL exécutant sur le dépôt réel : c'est ici que le
      # verdict et les `::error` sont publiés, donc ici qu'un relecteur de PR les
      # lit. backend/tests/test_privacy_policy_guard.py ne la rejoue pas — il
      # prouve, sur des copies mutées hors du dépôt, que le garde SAIT échouer,
      # et vérifie que cette étape est la seule.
      #
      # Dans CE job (et pas workflow-lint) : le garde importe le module réel, donc
      # kojo_settings et ses dépendances, installées par requirements.lock.
      - name: Check published retention durations match the code
        run: python .github/scripts/check-privacy-policy.py

      # ── Santé d'import : le VERDICT est publié en annotation de PR ──────────
      # Un fichier présent peut porter un `NameError` que personne ne voit (le
      # 2026-08-27, il a atteint la production alors que toutes les assertions
      # d'existence étaient vertes). Le verdict — périmètre, modules importés, ce
      # qui n'est PAS couvert, et un `::error` par module cassé — est produit par
      # backend/tests/test_import_health.py, comme la sonde SEO publie les siens.
      #
      # Ce fichier tourne aussi dans la suite complète, mais pytest CAPTURE le
      # `print` des tests : ses annotations n'y seraient lues par personne, ni en
      # vert ni en rouge. `--capture=tee-sys` recopie la sortie capturée dans le
      # journal du job, que GitHub transforme en annotations. Deux secondes, et
      # sans MongoDB (importer n'est pas se connecter).
      - name: Santé d'import — verdict publié en annotation
        working-directory: backend
        run: python -m pytest tests/test_import_health.py -q --tb=short --capture=tee-sys

      - name: Run tests against real MongoDB
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-kojo-32-chars-minimum
          EMAIL_OTP_SECRET: ci-otp-secret-kojo-32-chars-minimum
          TEST_MONGO_URL: mongodb://localhost:27017
          DB_NAME: kojo_test
          APP_ENV: test
          REDIS_URL: ""
          DISABLE_TRUSTED_HOST_MIDDLEWARE: "true"
        # test_import_health.py tourne déjà à l'étape précédente (celle qui publie
        # le verdict en annotation) : on ne paie pas deux fois la même preuve.
        run: python -m pytest tests/ -q --tb=short --ignore=tests/test_import_health.py

      # ── Temps réel : la traversée du bus, DEUX workers et un VRAI Redis ─────
      # `tests/test_live_bus.py` porte le protocole du bus avec un double ; il ne
      # peut pas dire ce que le bus promet : qu'un événement publié dans un
      # process atteigne un flux servi par un AUTRE process. Ce fichier-là le
      # dit, sans double : deux `uvicorn` sur deux ports, `POST /api/messages`
      # sur l'un, `GET /api/messages/stream` sur l'autre, et le MÊME identifiant
      # de message des deux côtés.
      #
      # Étape à part, et pas dans la suite principale : `TEST_REDIS_URL` est le
      # mandat (posé = le test juge ; absent = il se déclare inapplicable). Le
      # fichier vérifie LUI-MÊME que cette étape existe encore (dernier cas),
      # pour qu'une étape supprimée rougisse au lieu de laisser un test que
      # personne n'exécute.
      #
      # Le SECOND fichier de cette étape garde la perte d'enveloppe EN VOL : le
      # banc `scripts/charge/mesure_panne_redis.py` l'a mesurée (799/800 le
      # 19/10/2026, la manquante comptée nulle part) mais un banc ne garde rien.
      # Ici le chemin est celui du produit contre le VRAI Redis du job, avec un
      # proxy TCP devant lui qui s'arrête : l'enveloppe retirée du tampon doit
      # revenir au bus, ou être COMPTÉE perdue — jamais disparaître.
      - name: Temps réel — bus partagé, deux workers uvicorn et vrai Redis
        working-directory: backend
        env:
          TEST_MONGO_URL: mongodb://localhost:27017
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: python -m pytest tests/test_live_bus_deux_workers.py tests/test_live_bus_panne_redis.py -q --tb=short

      # Les refus du générateur de cartes OG (frontend/scripts/gen-og-images.py)
      # sont ce qui empêche une carte d'annoncer autre chose que sa page, et
      # backend/tests/test_gen_og_images.py les verrouille. Mais un test qu'on n'a
      # jamais vu échouer ne prouve rien : cette preuve avait été faite à la main
      # (mutations du générateur, restaurées à l'empreinte SHA-1), donc hors du
      # dépôt, et rien ne pouvait la rejouer.
      #
      # Ce garde la rejoue — sur des COPIES temporaires, le dépôt n'est jamais
      # modifié. Il n'a pas de table à tenir : il LIT les refus dans l'arbre du
      # générateur (chaque `raise SystemExit` que porte un `if`), neutralise un
      # refus à la fois (`if <condition>:` devient `if False:`, à la position exacte
      # de la condition) et exige que la suite échoue. Et un rouge quelconque ne
      # suffit pas : il mesure l'appartenance et exige que chaque refus ait un test
      # À LUI, qui rougit sous lui et sous aucun autre — sinon une casse collatérale
      # ferait croire à un refus verrouillé.
      #
      # Quatre choses échouent donc ici : un refus ajouté au générateur que personne
      # n'exerce (il est muté sans qu'on ait à le déclarer), un `raise` sorti du
      # corps de son `if` (la dérivation ne saurait plus quand il tombe), un refus
      # que seul un test partagé fait rougir, et une suite déjà rouge sur les copies
      # intactes — l'état de référence, sans lequel aucun rouge ne serait concluant.
      # Voir .github/scripts/check-og-test-mutations.py, prouvé par
      # backend/tests/test_og_mutation_guard.py.
      #
      # Dans CE job (et pas workflow-lint) : le fichier de test importe le
      # générateur réel, donc Pillow, installé ici par requirements.lock.
      #
      # Cette étape est le SEUL endroit qui rejoue les mutations (3,0 à 5,0 s mesurés
      # sur le runner selon le run) : le test du garde prouve qu'il sait refuser —
      # un refus que personne n'exerce, un test partagé entre deux refus, un `raise`
      # sans `if`, une condition écrite ailleurs — sans jamais lancer pytest : les
      # décisions s'éprouvent sur des verdicts écrits d'avance, et de cette étape la
      # suite ne vérifie que le CÂBLAGE (une occurrence, dans ce job, qui installe ses
      # dépendances). La même preuve n'est donc payée qu'une fois par push.
      # PORTÉE : cette étape, comme les deux runners de mutation, ne choisit pas
      # son filtre — elle DEMANDE à la table des preuves si le rejeu est dû, et
      # relaie le verdict. La portée se dérive des entrées que l'étape déclare
      # porter (le générateur, sa preuve, le harnais OG) plus leurs imports et
      # chemins cités : ajouter une dépendance à ce harnais élargit donc la
      # portée sans que rien ici ne change. Sur `main` et en dispatch, il n'y a
      # pas de base de comparaison : le rejeu est ENTIER.
      - name: Portée du rejeu OG (dérivée de la table des preuves)
        id: portee_og
        env:
          # Vides hors `pull_request` : c'est alors le rejeu entier qui est dû,
          # et c'est la même fonction qui le décide pour les trois étapes.
          KOJO_MUTATIONS_DEPUIS: ${{ github.event.pull_request.base.sha }}
          KOJO_BRANCHE_DE_BASE: ${{ github.base_ref }}
        run: python .github/scripts/check-guard-mutations.py --etape og --changed-from

      - name: Check OG refusals are locked by their tests (mutation replay)
        if: steps.portee_og.outputs.rejeu == 'oui'
        run: python .github/scripts/check-og-test-mutations.py

      # Le harnais GÉNÉRIQUE de mutation des gardes : chaque entrée de
      # .github/scripts/guard-proofs.json neutralise une ligne d'un garde RÉEL et
      # exige que SA preuve déclarée rougisse en la nommant. Le garde est restauré
      # à l'octet et son empreinte SHA-1 vérifiée ; une mutation qui ne mord pas —
      # ou dont le littéral a disparu — est un échec, jamais un succès silencieux.
      #
      # Ici le runner Python (pytest) ; le runner Node (Vitest) l'est dans
      # frontend-build, seul job qui installe les dépendances du frontend. Le
      # registre est validé par backend/tests/test_guard_failure_proofs.py, qui
      # vérifie AUSSI la présence de ces deux invocations : retirer une étape
      # éteindrait la moitié de la preuve sans que rien ne rougisse.
      # PORTÉE : ce job ne choisit ni runner ni filtre — il DEMANDE à la table,
      # par le nom de l'étape déclarée (`--etape runner-python`), si son rejeu est
      # dû, et relaie le verdict. Ce que l'étape rejoue se dérive de la table :
      # les mutations de ce runner, chacune avec la fermeture de ses dépendances
      # (garde, preuve, modules importés ou cités, fichiers partagés du runner).
      # La référence de la PR arrive par l'environnement ; `_base_du_changement`
      # en fait la même chose pour les trois étapes, et « pas de base » veut dire
      # preuve ENTIÈRE (17 s sur le runner pour les 11 mutations).
      - name: Portée du rejeu Python (dérivée de la table des preuves)
        id: portee_python
        env:
          KOJO_MUTATIONS_DEPUIS: ${{ github.event.pull_request.base.sha }}
          KOJO_BRANCHE_DE_BASE: ${{ github.base_ref }}
        run: python .github/scripts/check-guard-mutations.py --etape runner-python --changed-from

      - name: Mutations des gardes — preuve d'échec (runner Python)
        if: steps.portee_python.outputs.rejeu == 'oui'
        env:
          KOJO_MUTATIONS_DEPUIS: ${{ github.event.pull_request.base.sha }}
          KOJO_BRANCHE_DE_BASE: ${{ github.base_ref }}
        run: python .github/scripts/check-guard-mutations.py --etape runner-python --rejouer --changed-from

  # ─── Frontend : tests Vitest + build Vite ────────────────────────────────
  frontend-build:
    name: Frontend tests + build (Node/Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # HISTORIQUE COMPLET, exigé par la vérification de révision du frontend
      # (`git rev-list -1 HEAD -- frontend/`, plus bas) : sur un clone
      # superficiel, ce calcul ne verrait que le commit poussé et la seconde
      # révision acceptée serait toujours fausse.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Audit des retours des services (audit_api_returns.cjs, strict)
        working-directory: frontend
        run: node scripts/audit_api_returns.cjs --fail-on-warning

      # Un drapeau est un DESSIN du registre (`src/config/flags.js`), jamais un
      # caractère : les données pays/langue portaient un champ `flag` valant un
      # EMOJI, que la coquille publiait pendant que React peignait un SVG — deux
      # peintures pour un même drapeau, dépendantes de la police du visiteur. Le
      # champ a été retiré ; ce garde refuse qu'il REVIENNE (emoji de drapeau dans
      # le code de `src/`, ou champ `flag` dans les cinq modules de données
      # déclarés). Il ne lit que `src/`, donc il passe AVANT le build : un
      # `flag: '🇲🇱'` recopié rougit ici, sans attendre qu'un build le publie.
      - name: Check no flag emoji in country/language/geolocation data
        working-directory: frontend
        run: node scripts/check-drapeaux-emoji.js

      # Une `@keyframes` doit être JOUÉE, et une animation jouée doit être
      # DÉCLARÉE : le garde « aucun sélecteur sans porteur » juge des SÉLECTEURS,
      # jamais un nom d'ANIMATION, donc les deux directions de cet angle mort
      # étaient à la main. La seconde est SILENCIEUSE (un `@keyframes` manquant
      # n'est pas une erreur pour un navigateur) : l'animation ne tourne plus et
      # aucun test n'échoue. Le décodeur est conscient du JavaScript parce que
      # LE SUJET Y EST ENTIÈREMENT sur cet arbre : `ToastContainer.js` et
      # `serviceWorkerRegistration.js` déclarent leurs `@keyframes` dans un
      # littéral de gabarit, et les usages sont un objet de style JSX et un
      # `cssText` — un lecteur CSS seul rendrait un vert VIDE. Il ne lit que
      # `src/`, donc il passe AVANT le build.
      - name: Check every @keyframes is played and every played animation is declared
        working-directory: frontend
        run: node scripts/check-keyframes-animations.js

      # AUCUN VERDICT NE PORTE SUR UN TEMPS ABSOLU sans être déclaré et classé.
      # Le défaut d'origine est mesuré : un garde jugeait la hauteur du document
      # pré-rendu contre un nombre de pixels absolu relevé sur une machine — vert
      # ici, rouge ailleurs, parce que le verdict portait sur l'HÔTE. Ce défaut
      # vit aussi dans un budget Lighthouse en millisecondes et dans un délai de
      # test. Le garde n'essaie pas de rendre portables les métriques de
      # laboratoire : il empêche qu'une borne entre en SILENCE et décide seule.
      # Chaque borne des surfaces déclarées doit porter une classe d'un
      # vocabulaire fermé et une justification ; une borne qui DÉCIDE (classe
      # HOTE ou MESURE) n'est tolérée que si un angle accepté nomme ce qui la
      # compense ; une borne nouvelle, une borne disparue et une surface
      # introuvable rougissent. Il lit des fichiers de configuration, donc il
      # passe AVANT le build.
      - name: Check no verdict rests on an absolute time bound
        working-directory: frontend
        run: node scripts/check-juges-de-temps.js

      # LE DOCUMENT QUE JUGENT LES GARDES CI-DESSOUS est publié ici, une fois :
      # les gardes qui suivent lisent CE `build/`, et `bundle-size-report` (plus
      # bas) MESURE ce même répertoire au lieu de le reconstruire. Les deux jobs
      # construisaient avec exactement la même commande et le même
      # `VITE_API_URL` — une égalité garantie par un commentaire, donc par la
      # mémoire de qui lit l'autre job — et le rapport pouvait alors mesurer un
      # artefact que le garde n'avait jamais jugé.
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.kojoforafrica.cc.cd/api
        run: npm run build

      # L'artefact part DÈS que le build existe : si un garde rougit plus bas,
      # ce job s'arrête — et `bundle-size-report`, qui en dépend, ne tourne pas
      # non plus : il n'y a rien à lui livrer, donc rien à mesurer. Durée de vie
      # courte, le consommateur étant le job suivant du même run.
      - name: Publier le build pour le rapport de taille
        uses: actions/upload-artifact@v4
        with:
          name: build-frontend
          path: frontend/build
          retention-days: 1
          if-no-files-found: error

      # Vérifie le PRÉ-RENDU par route dans les artefacts de build : jobs.html
      # et login.html doivent contenir leur shell statique (h1/formulaire →
      # LCP avant React) + og:image dédié, et index.html doit garder #root
      # VIDE. Échoue le job en cas de régression silencieuse (plugin de
      # pré-rendu désactivé, shell perdu, contenu ajouté à l'index).
      - name: Check prerender shells (jobs/login html)
        working-directory: frontend
        run: node scripts/check-prerender-shells.js

      # LA FEUILLE CRITIQUE EST RECOPIÉE DANS CHAQUE DOCUMENT, et elle est lue
      # AVANT le premier paint : c'est le prix du plugin d'inlining
      # (`vite-plugins/inline-critical-css.js`, gain mesuré ~140 ms). Ce fait
      # vivait en PROSE dans `check-bundle-size.js`, et dans son budget le plus
      # large (le build total) : il ne disait donc ni QUELLE page avait enflé ni
      # de combien — et son compte écrit à la main avait dérivé (annoncé
      # « 69 Ko × 22 pages », mesuré le 09/10/2026 : 14 documents, dont 13
      # portant la même feuille, 900 980 o = 0,86 Mo — reporté sur la mesure du
      # 11/10/2026 : 995 321 o = 0,95 Mo, budget 78 848 o). Ce garde tient la
      # grandeur PAGE PAR PAGE : dépassement chiffré, plancher (une page qui a
      # PERDU sa feuille est plus légère, donc un plafond seul la déclarerait
      # « meilleure »), nombre de blocs `<style>`, feuille divergente d'une page
      # qui ne l'a pas déclarée, page pré-rendue sans ligne, ligne périmée — et
      # il refuse de conclure si son build est vide ou incomplet. La table est
      # la mesure du build réel ; preuve d'échec dans
      # scripts/__tests__/check-css-inline-budget.test.js.
      - name: Check inline CSS budget per prerendered page
        working-directory: frontend
        run: node scripts/check-css-inline-budget.js

      # Les deux gardes de coquille lisent le HTML publié ; celui-ci lit les
      # FICHIERS LIVRÉS (`build/assets/*.js` et `*.css`), seul endroit où vit
      # l'URL qu'un composant écrit en clair (`script.src = 'https://…'`). Il
      # refuse une origine TIERCE non classée dans `scripts/origines-bundles.js`,
      # une entrée de classement PÉRIMÉE (qu'aucun fichier livré ne porte plus) et
      # un motif vide — donc ajouter une dépendance qui parle à un tiers rougit
      # ici tant que personne n'a écrit POURQUOI elle a le droit d'y être.
      - name: Check third-party origins in delivered JS/CSS bundles
        working-directory: frontend
        run: node scripts/check-origines-bundles.js

      # LA COUVERTURE DES CLASSES DE TIERS. Le dépôt regarde les tiers par cinq
      # canaux (les deux gardes statiques ci-dessus, plus le parcours sans geste,
      # le parcours après geste et la carte différée), et chacun publie ses
      # limites en prose — mais RIEN ne reliait une CLASSE de tiers (« lien
      # rendu », « chargé après interaction »…) aux canaux qui peuvent
      # l’observer. Un classement qu’aucun canal ne confronte est une exemption
      # invérifiable : elle survit à son contrôle et justifie alors le suivant.
      # Ce garde refuse une classe ORPHELINE (aucun canal ne l’observe), une
      # classe sans ligne, une ligne périmée, une raison d’absence donnée à un
      # canal qui observe, un canal cité qui n’existe pas, une absence muette,
      # un module ou une sonde ABSENT sur disque, et une déclaration `CE_QUE_*`
      # vidée ou renommée. La matrice et la règle vivent dans
      # scripts/couverture-tiers.js ; preuve d’échec dans
      # scripts/__tests__/check-couverture-tiers.test.js.
      - name: Check third-party class coverage (no class observed by no channel)
        working-directory: frontend
        run: node scripts/check-couverture-tiers.js

      # LE CORPUS DE PRODUCTION VIDE NE DOIT PLUS PASSER POUR UN VERT. Mesure du
      # 12/10/2026 : la production ne servait aucune mission vivante
      # (`GET /api/jobs?status=open` → `[]`, sitemap de 8 URL dont zéro fiche,
      # `open_jobs: 0`), et TROIS sondes — `check-og-images.js`,
      # `check-og-job-200.js`, `check-seo-production.js` — sortaient en 0 en
      # annonçant chacune, en `::notice`, qu'elles n'avaient rien pu mesurer : un
      # lecteur du résumé ne pouvait pas distinguer « vérifié » de « rien
      # mesuré » (la forme de silence que F9 a coûtée). Les surfaces aveugles
      # sont désormais DÉCLARÉES (scripts/corpus-missions.js : chemin, motif,
      # remède, date) et les sondes les publient en `::warning` — non déclarée,
      # une surface fait REFUSER la sonde. Ce garde audit l'inventaire : il balaie
      # TOUT `scripts/` pour qu'une lecture du corpus par une sonde non déclarée
      # soit refusée (une sonde ajoutée demain est couverte sans être inscrite
      # nulle part), refuse une déclaration PÉRIMÉE, MUETTE, un motif ou un
      # remède qui ne dit rien, et REFUSE DE CONCLURE sous ses planchers de
      # lecture. Preuve d'échec dans scripts/__tests__/check-corpus-missions.test.js.
      - name: Check the production corpus inventory (declared blind surfaces)
        working-directory: frontend
        run: node scripts/check-corpus-missions.js

      # Le garde ci-dessus compare les textes que le plan DÉCLARE. Celui-ci
      # compare TOUT ce que les coquilles publient — chaque fragment visible des
      # HTML du build — aux textes que la page peut publier : un mot ajouté à la
      # main dans une coquille, ou une phrase restée dans le plugin après que la
      # page a changé, n'était ni déclaré ni comparé, donc invisible. Il refuse
      # en nommant la coquille, le fragment et les textes de page les plus
      # proches (règle stricte : texte entier, composition de textes entiers, ou
      # valeur dérivée déclarée).
      - name: Check shell text provenance (every published fragment ↔ page text)
        working-directory: frontend
        run: node scripts/check-shell-text-provenance.js

      # Ce qu'une coquille déclare comme RESSOURCE est demandé au premier
      # affichage, par le préchargeur, avant React : une origine tierce y est un
      # transfert d'adresse IP vers un domaine qu'on n'exploite pas, et un point
      # de panne sur la route critique du premier rendu. Le parcours e2e de la
      # carte différée prouve le COMPORTEMENT (à l'appui, iframe montée au clic)
      # mais ne lit pas ce que le build publie : un <script src> distant ajouté
      # au plugin de pré-rendu, un @font-face sur un CDN ou un preconnect vers
      # une régie ne feraient rougir aucun test de comportement. Les origines
      # autorisées viennent de scripts/site-meta.js, et la règle (ce qui
      # télécharge, ce qui est distant, le sort des rel) du module
      # scripts/shell-remote-resources.js.
      - name: Check shell remote resources (no third-party in the first screen)
        working-directory: frontend
        run: node scripts/check-shell-remote-resources.js

      # AUCUN SÉLECTEUR SANS PORTEUR. Il remplace l'élagage au build
      # (`vite-plugins/purge-css-mort.js`, supprimé) qui retirait silencieusement
      # les règles mortes de la feuille inlinée : une suppression au build masque
      # la dette (les sources décrivaient un site qui n'existait plus) et ne
      # jugeait qu'à la RÈGLE ENTIÈRE, donc un nom mort écrit à côté d'un
      # sélecteur vivant lui échappait — mesuré le 25/09/2026 : 105 noms de
      # classes, 4 769 o = 6,85 % de la feuille servie. La règle (ce qu'est un
      # porteur, le corpus des poseurs, les décodeurs de sélecteur) vit dans
      # scripts/css-selecteurs-morts.js ; le garde rend DEUX verdicts — les
      # feuilles source (fichier, ligne, nom, sélecteur : actionnable) et la
      # feuille livrée (une règle servie sans porteur, c'est-à-dire l'utilitaire
      # qu'un composant éliminé du bundle fait générer à Tailwind) — après avoir
      # REFUSÉ de juger si son corpus, ses feuilles ou ses pages sont sous les
      # planchers de lecture.
      - name: Check no CSS selector without a poser (source and shipped sheets)
        working-directory: frontend
        run: node scripts/check-css-selecteurs-morts.js

      # AUCUNE CLASSE POSÉE SANS RÈGLE — la TROISIÈME direction du même fait, et
      # la seule que rien ne tenait. Le garde ci-dessus juge les noms d'une
      # feuille (un sélecteur sans porteur, une règle servie sans porteur) et son
      # verdict final promet davantage qu'il ne vérifie : « et une classe POSÉE
      # doit exister dans la feuille servie » — vrai des neuf noms de la
      # blocklist, de personne d'autre. Le sujet est le HTML des PAGES livrées, et
      # c'est une mesure : Tailwind scanne src/**, donc un littéral de className
      # écrit là a sa règle par construction, tandis que le corpus du bundle ne
      # sait pas distinguer une classe d'un fragment de gabarit, d'un argument de
      # code ou de prose (mesuré : 515 jetons sans règle, tous du bruit). Ce qui
      # reste est exactement le trou : les coquilles pré-rendues
      # (vite-plugins/prerender/**) ne sont PAS dans le content de Tailwind, donc
      # une classe qui n'y est écrite que là n'est peinte par personne — et c'est
      # la peinture du premier écran, celle que les gardes de géométrie comparent
      # sans jamais lire les classes. Trouvé à son premier passage : « opacity-50 »
      # sur le bouton de suivi de /support, que React grise par
      # `disabled:opacity-50` — la coquille publiait un bouton plein. Le garde
      # REFUSE de juger sous cinq planchers de lecture (pages, feuilles, règles,
      # noms servis, classes posées) et refuse une exemption sans motif comme une
      # exemption périmée. La règle vit dans scripts/classes-sans-regle.js ;
      # preuve d'échec dans scripts/__tests__/check-classes-sans-regle.test.js.
      - name: Check no class posed without a rule (shipped pages ↔ served sheet)
        working-directory: frontend
        run: node scripts/check-classes-sans-regle.js

      # AUCUNE CLASSE RECOPIÉE D'UNE COQUILLE PAR RENDU PRÉALABLE — le fait que le
      # garde ci-dessus ne peut pas voir, par construction. Une coquille
      # pré-rendue et React peignent la MÊME page deux fois, et jusqu'ici les deux
      # peintures RECOPIAIENT leurs classes : mesuré le 09/10/2026, 236 listes de
      # classes écrites en littéral dans vite-plugins/prerender/**, dont 203
      # avaient un jumeau EXACT dans src/**. Rien ne rougissait quand un seul des
      # deux côtés changeait — une classe recopiée ne déplace aucun texte, elle
      # change une bordure, une ombre ou un état grisé, et aucune sonde ne le
      # voyait (celles de géométrie comparent l'encre et le text-align, celles de
      # texte comparent les mots). Le garde tient les deux moitiés : ce qui est
      # partagé vit dans un domicile unique (src/config/classes-chrome.js, lu par
      # React ET par la coquille — un champ lu par un seul canal est un défaut) et
      # toute autre liste doit avoir un jumeau chez React ou être déclarée propre à
      # la coquille AVEC son motif. Les 23 listes qui sont passées au domicile
      # (18 du chrome, 5 conteneurs de page) ne sont plus des copies du tout. La
      # règle vit dans scripts/classes-coquilles.js ; preuve d'échec dans
      # scripts/__tests__/check-classes-coquilles.test.js (12 mutations au
      # registre) ; les deux pistes ont été déclarées dans le registre de preuves.
      - name: Check no class copied by a prerendered shell (declared home + twins)
        working-directory: frontend
        run: node scripts/check-classes-coquilles.js

      # AUCUN JETON SANS LECTEUR, AUCUN MOT ÉTRANGER. Le garde ci-dessus juge des
      # NOMS DE CLASSES ; celui-ci juge des JETONS — deux sujets distincts, et le
      # second n'était tenu par rien : mesuré le 08/10/2026, le `:root` de
      # src/index.css déclarait vingt-trois jetons shadcn dont UN SEUL servait
      # (`--radius`, lu treize fois dans la feuille livrée) ; `--foreground`
      # peignait la couleur de texte de la page (rgb(10, 10, 10) relevé au
      # navigateur) et il est passé à la palette du site, `--background` et
      # `--border` étaient battus par une règle plus tardive (fond #f9fafb
      # d'App.css ; préflight pour la bordure : 17 éléments en #e7e5e4 sur `/`,
      # zéro à la valeur du jeton), et les dix-neuf autres n'étaient lus NULLE
      # PART. Trois verdicts : un jeton déclaré par une feuille du site doit être
      # lu par l'artefact livré ; un `var(--x)` lu par la CONFIGURATION doit être
      # déclaré (Tailwind lit ses propres `--tw-*`, d'où ce périmètre) ; et
      # quatre mots sont refusés par leur nom, chacun avec sa mesure — la police
      # du gabarit `source-code-pro`, un jeton de `@radix-ui`, une animation du
      # `Accordion` de shadcn, un `@apply` d'une couleur du thème retiré. Les
      # commentaires sont blanchis avant lecture (le commentaire qui documente un
      # retrait citait « --chart-4: 280 65% 60% » et le garde y lisait une
      # déclaration). La règle vit dans scripts/reliquats-css.js ; preuve d'échec
      # dans scripts/__tests__/check-reliquats-css.test.js.
      - name: Check no design token without a reader and no foreign vocabulary
        working-directory: frontend
        run: node scripts/check-reliquats-css.js

      # Les DEUX canaux qui publient les métadonnées d'une page — la coquille
      # pré-rendue (build) et les pages au runtime — doivent annoncer le même
      # titre, la même description et la même carte, lus dans les tables uniques
      # src/config/page-meta.js et og-cards.js. Avant ce garde, chacun les
      # déclarait de son côté (ex. /login) : changer un texte ou une image d'un
      # seul côté ne cassait rien, et /register n'annonçait aucun texte au
      # runtime (l'onglet gardait le titre de la page précédente).
      - name: Check page meta agrees (runtime pages ↔ prerendered shells)
        working-directory: frontend
        run: node scripts/check-page-meta.js

      # Une fiche mission (/jobs/:id) n'a pas de coquille pré-rendue à comparer :
      # son HTML est produit par le backend À LA REQUÊTE. Son contrat app ↔
      # pré-rendu n'était donc vérifié qu'en HTTP, contre un serveur debout et
      # une mission réellement créée en base — jamais sur une PR dont le
      # pré-déploiement est protégé, et jamais contre ce que l'APPLICATION
      # annonce. Ce garde exécute les deux implémentations sur une mission de
      # référence : le pré-rendu en important backend/kojo_job_og.py (module sans
      # dépendance, donc importable avec le python3 du runner), l'application en
      # appelant src/utils/jobSeo.js. Il échoue si un titre, une description ou
      # une carte ne dit plus la même chose des deux côtés.
      - name: Check job OG contract (app ↔ prerender, offline)
        working-directory: frontend
        run: node scripts/check-job-og-contract.js

      # Le profil public d'un travailleur (/workers/:id) est la SECONDE page que
      # le backend produit à la requête (depuis le 20/10/2026, elle n'est plus
      # servie par le gabarit nu en noindex). Le contrat est le même que pour la
      # fiche mission, donc le garde l'est aussi : il exécute
      # backend/kojo_worker_og.py et src/utils/workerSeo.js sur cinq profils de
      # référence et exige le même titre, la même description (coupe en POINTS
      # DE CODE, éprouvée sur des caractères astraux), les deux cartes et le
      # canonical. Sans cette étape, un titre retouché d'un seul côté publierait
      # deux vérités : l'onglet et la carte de partage.
      - name: Check worker OG contract (app ↔ prerender, offline)
        working-directory: frontend
        run: node scripts/check-worker-og-contract.js

      # La CSP du site est déclarée UNE fois (src/config/csp.js) et recopiée en
      # Python (backend/kojo_csp.py) pour que les documents pré-rendus la
      # publient. Ce garde exécute les DEUX calculs sur sept jeux d'entrées et
      # exige des chaînes IDENTIQUES, puis rend les quatre documents (fiche,
      # fiche 404, profil, profil 404) et vérifie qu'ils publient cette
      # politique — et que le plugin du build ne la contourne pas. Sans lui, la
      # copie Python dérivait en silence au premier fournisseur ajouté d'un seul
      # côté, et un lien partagé démarrait l'application sans la politique du
      # reste du site.
      - name: Check CSP contract (site ↔ documents pré-rendus)
        working-directory: frontend
        run: node scripts/check-csp-contract.js

      # Régression « chunk partagé pack2PageI18n » : le découpage par scope
      # (un dictionnaire par page lazy) ne doit pas réapparaître comme chunk
      # commun portant ≥ 3 dictionnaires (l'ancien monolithe ~60 kB chargé
      # par toutes les pages secondaires). Échoue le job si une fusion de
      # dictionnaires est détectée dans les chunks buildés.
      - name: Check pack2PageI18n chunk splitting (build)
        working-directory: frontend
        run: node scripts/check-pack2-chunks.js

      # Hygiène des dictionnaires pack2PageI18n : une clé qu'aucune page
      # consommatrice n'appelle (pageT statique/dynamique ou clé d'erreur
      # littérale) et un override wo/bm/mos identique à fr (déjà hérité via
      # withBase) sont du poids mort dans le chunk lazy de la page. Ces deux
      # dérives avaient été corrigées à la main dans le scope register ; ce
      # check permanent remplace l'audit manuel (audit-all-scopes.tmp.cjs) que
      # personne ne lançait. Il échoue le job si l'une réapparaît.
      - name: Check pack2PageI18n i18n hygiene (unused keys + redundant overrides)
        working-directory: frontend
        run: node scripts/check-pack2-i18n-hygiene.js

      # Périmètre des projets Firefox et WebKit de Playwright : la liste « qui
      # mérite trois moteurs » vivait dans un commentaire de
      # playwright.config.js, et rejouer toute la suite trois fois triplerait le
      # job — donc un parcours qui MESURE UN GESTE ajouté demain (un appui, une
      # molette, une bascule de taille) n'entrait dans ce périmètre que si
      # quelqu'un y pensait. Le garde croise le registre des gestes
      # (scripts/moteurs-gestes.js) avec le testMatch des deux projets, exige
      # que chaque parcours du périmètre PUBLIE ses mesures (sinon trois relevés
      # identiques ne se comparent pas) et que la CI installe les trois
      # binaires ; il refuse de juger si l'arbre est trop petit pour qu'il ait
      # lu son sujet.
      - name: Check the multi-engine perimeter (Firefox + WebKit gesture journeys)
        working-directory: frontend
        run: node scripts/check-moteurs-gestes.js

      # Garde-fou du découpage services/api vs services/apiEndpoints : les
      # groupes d'endpoints LAZY (jobsAPI, usersAPI, paymentAPI…) doivent
      # rester confinés dans apiEndpoints — importés uniquement par les pages
      # lazy. Échoue le job si un fichier ré-importe un groupe lazy depuis
      # services/api (niveau source), si un marqueur URL lazy réapparaît dans
      # le chunk d'entrée index-*.js (niveau bundle), ou si un marqueur core
      # (auth/me, login…) disparaît du shell.
      - name: Check services/api split (lazy groups out of entry chunk)
        working-directory: frontend
        run: node scripts/check-api-split.js

      # Garde-fou du lot Open Graph : le pré-rendu par route référence des
      # cartes versionnées dans public/ (og-jobs, og-login, variantes carrées,
      # favicon sombre) que scripts/gen-og-images.py régénère. Le check lit le
      # manifeste DANS ce générateur (dimensions + pages) et échoue si un
      # second générateur apparaît, si un PNG est manquant/invalide, s'il ne
      # respecte pas ses dimensions ou si un og-*.png orphelin subsiste.
      - name: Check Open Graph assets (generator + PNG dimensions)
        working-directory: frontend
        run: node scripts/check-og-assets.js

      # Garde-fou de la famille « icônes » : les icônes PWA et le favicon clair,
      # produits par public/icons/generate_icons.py. Ce générateur est en stdlib
      # pure (ni police, ni Pillow), donc son résultat est comparable sur ce
      # runner — encore faut-il comparer la bonne chose : la zlib variant d'une
      # installation à l'autre, les OCTETS d'un PNG regénéré diffèrent de ceux
      # committés alors que les PIXELS sont identiques (mesuré : 101 592 contre
      # 101 049). Le check compare donc les empreintes de PIXELS du manifeste,
      # REJOUE le générateur en dossier temporaire, et échoue aussi sur un
      # favicon.ico invalide (celui qui était committé faisait 100 octets de
      # zéros, alors qu'index.html le référence comme favicon principal), sur une
      # copie qui diverge, sur un actif sans générateur modifié et sur une icône
      # qui n'est déclarée par personne.
      - name: Check generated icons family (pixels + manifest)
        working-directory: frontend
        run: node scripts/check-generated-icons.js

      # Garde-fou de la MESURE du poinçon — le dessin lui-même, et non la
      # conformité de ses artefacts. L'atelier du 28/09/2026 avait mesuré trois
      # choses (le contraste de la lettre sur la matière : 2,67:1, illisible ;
      # le débordement de l'arc d'ombre : 0,55 unité de liseré peint DEHORS, sur
      # le fond ; les pixels peints hors du disque), corrigé le dessin avec
      # elles, puis été supprimé — il ne restait que de la prose et deux nombres
      # dans un journal, c'est-à-dire rien qui rougisse à la prochaine retouche
      # de la géométrie. Le check rejoue les trois, sur la géométrie DÉCLARÉE
      # (src/config/marque-kojo.json, la même que lisent la page, la coquille et
      # le rasteriseur) et sur les PNG CLAIRS réellement servis, décodés ici en
      # Node (zlib + dé-filtrage, aucune dépendance) : seuil de contraste WCAG
      # 1.4.11 (3:1), rayon + demi-trait ≤ rayon du disque pour les cinq cercles,
      # et zéro pixel peint hors du disque — avec sa contrepartie, sans quoi
      # « rien dehors » serait vrai d'une image transparente.
      - name: Check the poinçon's measurements (contrast, circles, overflow)
        working-directory: frontend
        run: node scripts/check-marque-kojo.js

      # Garde-fou de la famille « photos du héros » : les Six JPEG de l'accueil
      # sont désormais doublés de variantes AVIF et WebP à DEUX largeurs (480 et
      # 720), publiées par un `<picture>` — et c'est le commentaire de
      # src/config/photos-heros.js qui justifie ce choix en publiant les OCTETS
      # mesurés (AVIF 720 = 213 059 o à six pour −62,9 % contre le JPEG, WebP
      # 720 = 264 938 pour −53,9 %). Rien ne reliait ce tableau au disque : une
      # variante régénérée avec un autre réglage pesait autre chose que les
      # octets publiés, une variante DÉCLARÉE mais jamais générée se serait
      # téléchargée en 404 (le `<picture>` ne le dit pas — le navigateur
      # retombe alors sur le JPEG de 63 Ko en croyant en servir 20), une source
      # recodée sans régénérer les variantes laissait des variantes qui n'étaient
      # plus celles de la photo affichée, et une variante plus LOURDE que son
      # repli faisait télécharger davantage à un navigateur moderne. Le check lit
      # l'EN-TÊTE de chaque fichier (boîte `ispe` d'un AVIF, premier morceau d'un
      # WebP : `VP8X`, `VP8 ` ou `VP8L`), le compare au manifeste de
      # scripts/gen-hero-images.py et à la table de la config, et refuse aussi un
      # total qui ne suit plus les fichiers, un ordre de formats où le premier
      # publié serait le plus lourd, un encodage orphelin, et une photo de tête
      # dont la variante n'économise plus la moitié du JPEG. Il n'a besoin ni de
      # Pillow ni de Python : les 24 fichiers sont lus en Node. Preuve d'échec :
      # scripts/__tests__/check-hero-images.test.js (une mutation, un refus
      # nommé), rejouée par le harnais de mutation.
      - name: Check hero photo variants (disk ↔ manifest ↔ config)
        working-directory: frontend
        run: node scripts/check-hero-images.js

      # Garde-fou du manifeste PWA : il déclarait « any maskable » sur ses deux
      # icônes alors qu'AUCUNE ne tenait dans la zone de sécurité (contenu à un
      # rayon de 0,495 pour une limite de 0,400) et que le fichier « -maskable »
      # invoqué était un duplicata au pixel près de l'icône normale. Le check
      # croise manifest.json avec l'inventaire de la famille (existence,
      # dimensions, type, purpose) et exige qu'un « maskable » soit PROUVÉ par
      # la mesure, dans les deux sens : aucune fausse revendication, et aucune
      # variante fabriquée pour le masque qui ne serait jamais servie.
      # Depuis le 07/10/2026 il juge AUSSI l'installation elle-même : « id »,
      # « start_url » et « scope » doivent rester sous le domaine du site (une
      # entrée absolue ailleurs ferait ouvrir l'application installée sur un
      # domaine qu'on n'exploite pas), et chaque entrée de la liste de précache
      # du service worker doit être un littéral de chaîne SOUS CE DOMAINE — une
      # liste vide ou une adresse calculée est refusée, parce qu'un vert sur une
      # liste vide ne dirait rien de son contenu.
      - name: Check PWA manifest (declared icons, maskable safe zone, install origin, service-worker precache)
        working-directory: frontend
        run: node scripts/check-pwa-manifest.js

      # Garde-fou du ROUTAGE complet : le rewrite « /jobs/(.*) » → backend
      # (route OG déclarée côté backend), le proxy /api, sitemap/robots, CHAQUE
      # route de production de src/App.js (deux formes : /route et /route/),
      # l'absence de catch-all (une URL inconnue doit répondre 404, pas 200),
      # et les règles exactes rendues inatteignables par un motif placé avant
      # (le bug réel : /jobs/ après /jobs/(.*) → 404 JSON en production).
      # Ce garde couvre la CONFIGURATION qui achemine la requête ; le cycle
      # complet, lui, tourne désormais sur chaque PR contre la pile locale du
      # job lighthouse-ci (check-og-job-200.js) et en processus via
      # backend/tests/test_job_og_cycle.py.
      - name: Check SPA routing (vercel.json rewrites, routes App.js, URL inconnue → 404)
        working-directory: frontend
        run: node scripts/check-spa-routes.js

      # Garde-fou du shell statique de l'ACCUEIL : sans lui, le HTML servi à
      # « / » ne contient que `<div id="root"></div>` — un crawler sans
      # JavaScript y voit 19 mots, aucun h1, aucun lien interne, aucun lien de
      # contact (mesuré par un audit SEO externe le 16/09/2026). Le shell
      # reproduit Home.js avec les textes de src/i18n/fr.json ; ce check exige
      # un h1 unique, un title ≤ 60, une description ≤ 160, ≥ 300 mots, des
      # liens internes et tel:/mailto:, le N.A.P. identique à
      # src/config/contact.json, le LocalBusiness, et que chaque classe
      # Tailwind du shell existe bien dans le CSS du build (vite.config.js
      # n'est PAS scanné par Tailwind : une classe inventée ne serait jamais
      # stylée).
      - name: Check home page static shell (h1, contenu, liens, N.A.P., SEO local)
        working-directory: frontend
        run: node scripts/check-home-shell.js

      # Budgets RÉELS (JS initial, plus gros chunk, build total) : l'ancienne
      # version se contentait d'afficher `du -sh build/` et ne pouvait donc
      # jamais échouer — un bundle doublé passait en vert. Les seuils sont
      # documentés dans scripts/check-bundle-size.js (mesure du 16/09/2026 :
      # 98,5 Ko gzip de JS initial, chunk vendor-sentry 156,4 Ko, build 2,81 Mo)
      # et le check est couvert par scripts/__tests__/check-bundle-size.test.js.
      - name: Check bundle size
        working-directory: frontend
        run: node scripts/check-bundle-size.js

      # Hygiène des branches locales et des réfs distantes : refuse en CI une branche
      # fusionnée périmée ou une réf distante orpheline.
      - name: Check git branches hygiene
        working-directory: frontend
        run: node scripts/check-git-branches.js

      # Fermeture de la classe de bug du panneau de notifications : détecte et refuse
      # tout composant à état partagé dont un écouteur global dépend d'une ref locale.
      - name: Check no shared-state component listener depends on local ref
        working-directory: frontend
        run: node scripts/check-composants-etat-partage-ecouteurs.js

      # Autre moitié de la classe de bug du panneau de notifications : refuse tout
      # contrôle interactif qu'un changement d'état déclenché PENDANT l'appui
      # (onMouseDown/onPointerDown/onTouchStart) démonte avant que le `click` n'arrive.
      - name: Check no interactive control unmounted during press
        working-directory: frontend
        run: node scripts/check-appui-demontage-controles.js

      # Parité du levier "content-visibility" du formulaire de /register : les
      # quatre blocs différés (photo, légal, envoi, lien) doivent être posés par
      # les DEUX canaux (src/pages/Register.js ET shells-routes.js) et porter
      # leur constante de hauteur de contenu dans src/App.css. Une classe posée
      # d'un seul côté, ou une constante disparue, ferait diverger les deux
      # peintures ou effondrerait le document — la parité e2e n'est mesurée que
      # sur les routes déclarées, donc ce garde refuse la divergence à la source.
      - name: Check deferred form blocks parity (/register)
        working-directory: frontend
        run: node scripts/check-formulaire-differe.js

      # Même harnais que dans backend-tests, runner Node (Vitest) : les mutations
      # des gardes frontend sont rejouées ici, seul job qui a `node_modules`.
      # Aucun `working-directory` : le harnais résout la racine du dépôt depuis
      # son propre fichier, pas depuis le répertoire courant.
      #
      # PÉRIMÈTRE : ces 55 mutations démarrent chacune un runner Vitest et pèsent
      # l'essentiel de l'étape (~2,5 min). Sur une PR, seules celles dont le GARDE,
      # la PREUVE, un module importé ou un fichier partagé du runner a changé sont
      # rejouées ; sur `main` (et en dispatch), la preuve est ENTIÈRE — aucun
      # changement ne peut alors justifier de sauter une mutation, sinon un garde
      # cesserait d'être prouvé sans que rien ne rougisse. Le choix « quelles
      # mutations sont concernées » appartient à la table, qui déclare cette étape
      # sous un NOM : le job demande `--etape runner-node` et rien d'autre, comme
      # les deux autres étapes. La RÉFÉRENCE de comparaison est décidée au même
      # endroit (`_base_du_changement`) : le script ne fait plus ici quinze lignes
      # de git fetch. Si la base est introuvable, on rejoue TOUT : jamais moins.
      - name: Portée du rejeu Node (dérivée de la table des preuves)
        id: portee_node
        env:
          # Vides hors `pull_request` (push sur main, workflow_dispatch) : c'est
          # l'invocation ENTIÈRE qui tourne alors. Passés par l'environnement
          # plutôt qu'interpolés dans le script : un nom de branche n'a rien à
          # faire dans une ligne de commande.
          KOJO_MUTATIONS_DEPUIS: ${{ github.event.pull_request.base.sha }}
          KOJO_BRANCHE_DE_BASE: ${{ github.base_ref }}
        run: python3 .github/scripts/check-guard-mutations.py --etape runner-node --changed-from

      - name: Mutations des gardes — preuve d'échec (runner Node)
        if: steps.portee_node.outputs.rejeu == 'oui'
        env:
          KOJO_MUTATIONS_DEPUIS: ${{ github.event.pull_request.base.sha }}
          KOJO_BRANCHE_DE_BASE: ${{ github.base_ref }}
        run: python3 .github/scripts/check-guard-mutations.py --etape runner-node --rejouer --changed-from

      # ── Le frontend SERVI est-il celui de ce commit ? ──────────────────────
      # POLITIQUE DU JOB, définie ICI (cf. CI-COVERAGE.md, F10) :
      #   • le déploiement de production du frontend est fait par VERCEL depuis
      #     l'app GitHub — aucun job ne le commande, donc rien, dans la CI, ne
      #     lisait le code réellement servi : un build échoué, annulé, ou en
      #     retard laissait `main` vert pendant que le site servait l'ancien
      #     bundle (exactement ce que F8 a fermé côté backend) ;
      #   • ce qui doit être vrai : aucun changement de `frontend/**` n'est
      #     absent de la production. C'est une propriété d'ARBRE, pas de SHA.
      #     Le build PUBLIE l'arbre de `frontend/` (`kojo-build-tree`) et le
      #     garde le compare à celui des commits attendus : deux SHA différents
      #     avec le MÊME arbre sont acceptés (fusion documentaire : Vercel
      #     laisse la production sur le build précédent, mesuré le 21/10/2026) ;
      #     deux arbres différents sont refusés. Le SHA égal reste le chemin
      #     rapide ;
      #   • le commit SERVI n'a plus besoin d'exister dans ce clone (il le
      #     fallait pour lire son arbre) : le cas « arbre incomparable » en
      #     code 2 a disparu, et `fetch-depth` ne sert plus à ça ;
      #   • la fenêtre d'attente (~3 min) absorbe un déploiement en cours :
      #     mesuré, Vercel termine 0,4 à 0,6 min après le commit ;
      #   • un refus nomme sa cause (aucune révision annoncée / aucun arbre
      #     annoncé / arbre différent / site injoignable — défi de l'edge Vercel
      #     compris) ; une invocation qui ne dit pas quoi comparer échoue en
      #     code 2, jamais en vert.
      # `main` seulement : sur une PR, la production ne dit rien de la PR.
      # ── CODE 2 : PRÉMISSE, DONC AUCUN VERDICT ──────────────────────────────
      # Deux cas rendent 2, et aucun ne décrit le code livré : le déploiement de
      # production est EN FILE chez Vercel (QUEUED/BUILDING/INITIALIZING, lu par
      # l'API — la fusion de #184 a attendu 22 min le 21/10/2026, et `main`
      # rougissait sur cette file), ou la révision attendue est illisible dans ce
      # clone. Le step TOLÈRE donc 2 en le disant (`::warning` + résumé), et
      # échoue sur 1 (révision ≠ attendue, build en ERROR/CANCELED, aucun
      # déploiement, production muette, site injoignable).
      #
      # La sortie `sert` est ce qui empêche le faux vert voisin : les deux
      # lectures qui SUIVENT (sonde SEO stricte, actifs servis) supposent qu'un
      # déploiement NOUVEAU vient d'être mis en ligne. Sur une prémisse, elles ne
      # sont pas exécutées — juger l'ancien artefact en le présentant comme le
      # nouveau serait exactement le vert que ce dépôt refuse.
      - name: Le frontend servi est-il celui de ce commit ?
        id: revision-servie
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_NAME: ${{ secrets.VERCEL_PROJECT_NAME }}
        run: |
          # `-e` REMIS le 12/10/2026 : le step s'en passait sans motif écrit, et un
          # step qui n'abandonne pas sur une commande en échec peut perdre son
          # verdict en route (garde `.github/scripts/check-informative-steps.py`).
          set -euo pipefail
          ATTENDU="${{ github.sha }}"
          # Le step travaille depuis frontend/ : le chemin `frontend/` serait
          # alors cherché sous frontend/frontend/ et renverrait vide. Le point
          # courant représente toute la surface frontend du dépôt.
          DERNIER_FRONTEND="$(git rev-list -1 HEAD -- .)"
          if [ -z "$DERNIER_FRONTEND" ]; then
            echo "::error::aucune révision attendue calculée — la vérification ne peut pas conclure"
            exit 2
          fi
          echo "Révisions acceptées : $ATTENDU (commit poussé) ou $DERNIER_FRONTEND (dernier commit ayant touché frontend/) — le verdict porte sur l'arbre frontend/ PUBLIÉ par l'artefact, comparé à ceux de ces commits"
          STATUT=0
          node scripts/check-deployed-revision.js --attendu "$ATTENDU" --sinon "$DERNIER_FRONTEND" --tentatives 9 --delai 20 || STATUT=$?
          if [ "$STATUT" -eq 2 ]; then
            echo "sert=non" >> "$GITHUB_OUTPUT"
            echo "::warning title=Révision servie — aucun verdict::la révision servie n'a pas reçu de verdict (prémisse nommée ci-dessus : déploiement Vercel encore en file, ou révision attendue illisible dans ce clone). Les deux lectures qui en dépendent — sonde SEO stricte et actifs servis — sont SAUTÉES sur ce run."
            echo "Révision servie : aucune conclusion (prémisse, code 2) — la sonde SEO stricte et la vérification des actifs ne sont pas exécutées sur ce run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$STATUT" -ne 0 ]; then
            echo "sert=non" >> "$GITHUB_OUTPUT"
            exit "$STATUT"
          fi
          echo "sert=oui" >> "$GITHUB_OUTPUT"

      # ── LA PRODUCTION VIENT D'ÊTRE DÉPLOYÉE : la sonde SEO stricte la lit ────
      # Le step ci-dessus vient de constater que la production SERT le frontend de
      # ce commit, c'est-à-dire qu'un déploiement NOUVEAU est en ligne. C'est le
      # seul instant où un écart introduit par ce build est encore attribuable à
      # ce run : les intégrations SEO/analytics (GA4, Search Console, Plausible,
      # profils sociaux) ne vivent que dans des variables `VITE_*` INLINÉES au
      # build par Vercel, donc un build qui les perd n'échoue nulle part — le HTML
      # servi est simplement plus pauvre.
      #
      # La sonde QUOTIDIENNE (`.github/workflows/seo-production-probe.yml`,
      # `17 6 * * *`) constate le même fait, mais jusqu'à 24 h plus tard : F9 a vécu
      # deux jours avec quatre intégrations absentes de la production et la CI
      # verte. Ici l'écart est constaté en minutes, sur la livraison qui l'a
      # introduit.
      #
      # MÊME commande que le cron (`--strict`), pas une variante — et c'est aussi
      # celle que `npm run livrer` lance de son côté : trois définitions de
      # « conforme » divergeraient, et l'une deviendrait plus indulgente que les
      # autres. Coût mesuré le 12/10/2026 : 4,1 s (accueil + sitemap + ses 8 pages).
      #
      # Il ne tourne QUE si le step précédent a conclu : un frontend pas encore
      # déployé arrête le job LÀ — juger l'ancien artefact en le présentant comme
      # le nouveau serait le faux vert que ce dépôt refuse. Même garde que lui
      # (`main` seulement) : sur une PR, la production ne dit rien de la PR, et un
      # repli local ferait refuser la sonde (elle ne conclut pas sur du local).
      - name: La production vient d'être déployée — la sonde SEO stricte la lit maintenant
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.revision-servie.outputs.sert == 'oui'
        working-directory: frontend
        run: node scripts/check-seo-production.js --strict

      # ── LES ACTIFS SERVIS SONT-ILS CEUX DE L'ARTEFACT ? ─────────────────
      # Le step de révision prouve que le HTML servi vient de `main` ; il ne dit
      # RIEN du JS, du CSS ni des polices que ce HTML charge. Vercel déploie un
      # artefact atomiquement, mais rien ne le re-vérifiait (c'était l'angle
      # mort déclaré de F19) : un HTML neuf servi avec des actifs restés en
      # arrière donne une page qui ne correspond pas à son bundle, et `main`
      # restait vert.
      #
      # La chaîne jugée est HTML → manifeste → octets : le build écrit
      # `asset-manifest.json` (une empreinte SHA-256 par actif) et ancre
      # l'empreinte de CE manifeste dans chaque page (`kojo-build-assets`). Le
      # manifeste doit être celui annoncé (sinon il vient d'un autre build, et
      # il ne garantit rien), et chaque actif doit porter l'empreinte qu'il
      # déclare. Un manifeste sous son plancher est un refus, jamais un vert.
      #
      # Les IMAGES et CARTES OG sont échantillonnées (tête et queue, 4 Kio de
      # chaque côté) en plages HTTP, sous un budget d'octets : le fichier entier
      # ferait télécharger des mégaoctets. Budget épuisé = `N sur M` déclaré +
      # `::warning`, zéro contenu lu = refus.
      #
      # MÊME garde `main` : sur une PR, la production ne dit rien de la PR. Le
      # step tourne APRÈS la révision et la sonde SEO : il juge un artefact dont
      # le déploiement a déjà été constaté, et il ne retarde pas la sonde SEO
      # (qui doit rester collée à la vérification de révision).
      #
      # CE QU'ELLE COÛTE EST PUBLIÉ, vert compris : fichiers jugés, octets
      # réellement téléchargés, requêtes, durée et part du budget des contenus
      # partent dans le résumé du run (`$GITHUB_STEP_SUMMARY`, que le script
      # écrit lui-même — rien à cabler ici). Sans ce chiffre, un manifeste qui
      # grossit à chaque image ajoutée ne se verrait que le jour du refus, sur
      # une livraison qui n'a rien changé.
      - name: Les actifs servis sont-ils ceux de l'artefact ?
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.revision-servie.outputs.sert == 'oui'
        working-directory: frontend
        run: node scripts/check-deployed-assets.js

      # ── LA PREVIEW DE LA PR EST-ELLE L'ARTEFACT DE SA TÊTE ? ────────────────
      # La sonde ci-dessus ne juge que `main`, et c'est structurel : une PR ne
      # dit rien de la production. Elle laissait donc l'artefact d'une PR
      # vérifié par PERSONNE avant fusion — l'écart se découvrait en production,
      # sur la livraison qu'il fallait corriger. Ici la MÊME chaîne (HTML →
      # manifeste ancré → octets de chaque actif, contenus échantillonnés sous
      # budget) est jouée sur le déploiement Vercel de la RÉVISION poussée.
      #
      # L'origine se RÉSOUT par la révision (`--sha`), pas par le commentaire de
      # l'app Vercel : ce dernier peut désigner un commit précédent, et une
      # chaîne cohérente sur un artefact périmé rendrait un vert sur le mauvais
      # objet. Le filtre `sha` de l'API Vercel ne rend que CE commit.
      #
      # La preview est fermée par défaut (Deployment Protection) : le jeton de
      # contournement part en en-tête sur CHAQUE lecture, et il n'est jamais
      # imprimé. Un mur de protection sans jeton n'accuse pas l'artefact : c'est
      # une PRÉMISSE (code 2), publiée en `::warning` et dans le résumé du run —
      # jamais un vert, jamais un rouge du code de la PR. Le code 2 est donc
      # TOLÉRÉ ici, explicitement : sur une PR issue d'un fork les secrets ne
      # sont pas fournis, et sur un projet sans déploiement de PR il n'y a rien
      # à juger. Ce que la tolérance coûte est écrit : ces PR-là ne sont pas
      # vérifiées avant fusion (limite déclarée dans CI-COVERAGE.md).
      #
      # Le code 1 (chaîne incohérente, manifeste d'un autre build, actif
      # réécrit, build de la PR en ERROR) ÉCHOUE le job, donc le check requis
      # `frontend-build` — la correction se fait avant la fusion, pas après.
      - name: Preview Vercel — l'artefact de cette PR est-il ancré à son commit ?
        if: github.event_name == 'pull_request'
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_NAME: ${{ secrets.VERCEL_PROJECT_NAME }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          KOJO_REVISION_PR: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "Preview de la révision ${KOJO_REVISION_PR} — chaîne HTML → manifeste → octets"
          STATUT=0
          node scripts/check-deployed-assets.js --preview --sha "$KOJO_REVISION_PR" --tentatives 12 --delai 15 || STATUT=$?
          if [ "$STATUT" -eq 2 ]; then
            echo "::warning title=Preview Vercel — aucun verdict::l'artefact de cette PR n'a pas pu être jugé (cause nommée ci-dessus et dans le résumé du run) : aucune conclusion n'est tirée de cet artefact. La production reste jugée sur main par le step précédent."
            exit 0
          fi
          exit "$STATUT"

      # ── COMBIEN la base est-elle en retard, et depuis QUAND la production ? ──
      # Le step ci-dessus répond OUI/NON (« le frontend servi est-il celui de ce
      # commit »), et seulement sur `main`. Il ne dit ni de combien de commits la
      # base est en retard sur la branche de travail, ni depuis quand la
      # production n'a pas été reconstruite — les deux nombres sur lesquels se
      # prend la décision de livrer. MESURÉ le 07/10/2026 : dix commits ont
      # attendu d'être livrés et aucun run ne l'a rappelé.
      #
      # Il tourne AUSSI SUR LES PR, et c'est là qu'il sert : la branche de travail
      # est justement celle dont on veut savoir ce qu'elle porte. Il ne peut pas
      # rendre une PR rouge : sans borne déclarée il ne publie que des ::notice
      # (une branche de travail PORTE des commits non livrés, ce n'est pas un
      # défaut), et une production injoignable ou sans en-tête de datation est
      # NOMMÉE sans être jugée. Ses seuls refus par défaut sont « je ne peux pas
      # lire mon sujet » (aucune base, git illisible) — une base distante existe
      # toujours ici, le job clonant l'historique entier (fetch-depth: 0).
      #
      # Le compte de commits est CORRIGÉ du squash : mesuré le 08/10/2026 sur ce
      # dépôt, `origin/main..HEAD` valait 14 et l'attente réelle 0 (l'arbre de la
      # tête était celui de la base). Un compte brut ferait chercher un retard
      # inexistant à chaque branche issue d'une fusion par squash.
      #
      # LA MESURE N'EST PRISE QU'UNE FOIS PAR RUN. Le rapport de taille
      # (`bundle-size-report`, plus bas) publie CES DEUX PHRASES dans le
      # commentaire de PR : il les REÇOIT (artefact ci-dessous) au lieu de
      # rappeler le garde — deux appels, c'étaient deux sondes de production et
      # deux lectures de git pour un chiffre qui pouvait différer d'un job à
      # l'autre, et un commentaire annonçant un autre nombre que l'annotation du
      # run. La révision mesurée est donc déclarée ICI, une seule fois : la tête
      # de la PR sur `pull_request` (HEAD y est le commit de FUSION simulé, qui
      # contient déjà `main` et ne dirait rien de ce que la PR porte), le commit
      # poussé sinon.
      - name: Retard de la base et âge du déploiement de production (signal)
        working-directory: frontend
        env:
          REVISION_MESUREE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/check-retard-main.js \
            --base origin/main \
            --tete "$REVISION_MESUREE" \
            --markdown .bundle-size/livraison.md

      # Durée de vie courte : l'artefact est consommé par le job SUIVANT du même
      # run (`bundle-size-report`). `if-no-files-found: error` : un rapport de PR
      # sans sa mesure dirait « non mesuré » pour un câblage cassé, plus difficile
      # à lire qu'un step en échec qui nomme sa cause.
      - name: Publier la mesure de livraison pour le commentaire de PR
        uses: actions/upload-artifact@v4
        with:
          name: retard-livraison
          path: frontend/.bundle-size/livraison.md
          retention-days: 1
          if-no-files-found: error

  # ─── Frontend : rapport de taille publié en commentaire de PR ────────────
  # `check-bundle-size.js` est un garde BINAIRE (« dans les budgets » ou
  # « dépassé ») : il ne dit pas COMBIEN un changement coûte, et ses seuils
  # (~30-40 % de marge) laissent passer une dérive. Ce job publie les trois
  # mesures réelles avec leur écart :
  #   • vs la dernière mesure de `main` — « l'effet de cette PR par rapport à
  #     la base », la référence étant transportée par le cache Actions ;
  #   • vs la mesure précédente de CETTE PR — relue dans la charge utile du
  #     commentaire précédent, donc « depuis le dernier push ».
  # Si une référence manque, la colonne est omise et la raison est écrite
  # dans le commentaire : un écart calculé contre une référence douteuse
  # serait pire que pas d'écart du tout.
  #
  # Job ADVISORY : il ne fait PAS partie des 8 checks requis de la protection
  # de branche, donc un échec ici ne bloque aucune fusion. Les mesures sont de
  # toute façon écrites dans le résumé du run ($GITHUB_STEP_SUMMARY) : le
  # commentaire n'est qu'un canal plus lisible, pas la seule trace.
  bundle-size-report:
    name: Bundle size report (PR comment)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: frontend-build
    permissions:
      contents: read
      pull-requests: write

    steps:
      # Historique complet : la cadence de livraison compare la révision (la tête
      # de la PR) à `origin/main`, que seul un clone complet fournit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # CE JOB N'INSTALLE RIEN ET NE CONSTRUIT RIEN, et ce n'est pas une
      # économie au jugé : `bundle-size-report.js` n'importe que des modules
      # `node:` (`fs`, `path`, `url`) plus `check-bundle-size.js`, lui-même
      # `node:zlib` — aucune dépendance installée n'est lue. C'est ce qui permet
      # de RECEVOIR le build au lieu de le refaire : il mesure donc l'artefact
      # que les gardes viennent de juger (artefact `build-frontend`, publié par
      # `frontend-build`, dont ce job dépend), au lieu de reconstruire avec
      # « exactement les mêmes entrées » — une égalité qu'un commentaire ne
      # garantit pas et que deux builds séparés ne peuvent pas tenir.
      - name: Récupérer le build mesuré par frontend-build
        uses: actions/download-artifact@v4
        with:
          name: build-frontend
          path: frontend/build

      # Référence = dernière mesure de `main`. La clé embarque le SHA (donc
      # n'est jamais réutilisée telle quelle) et `restore-keys` sélectionne la
      # plus récente : sur une PR, GitHub autorise la restauration des caches
      # de la branche de base — c'est exactement « la mesure de main ».
      # Absente au tout premier run : le rapport le dit au lieu d'inventer un
      # écart (« première mesure »).
      - name: Restore size baseline (main)
        uses: actions/cache/restore@v4
        with:
          path: frontend/.bundle-size
          key: bundle-size-baseline-${{ github.sha }}
          restore-keys: |
            bundle-size-baseline-

      # Cadence de livraison, dans le MÊME commentaire : de combien `main` est en
      # avance sur la révision mesurée, et depuis quand la production sert un
      # artefact reconstruit.
      #
      # La mesure est REÇUE, jamais refaite ici : elle est prise une seule fois par
      # run, par `frontend-build` (dont ce job dépend), qui la publie en artefact.
      # La révision qu'elle a mesurée est celle que le commentaire annonce : la tête
      # de la PR, jamais le commit de fusion (qui contient déjà `main`). Le
      # `continue-on-error` de l'ancienne étape n'a plus lieu d'être : ce job ne
      # mesure plus rien ici, il LIT une mesure — et un artefact manquant est un
      # câblage cassé, donc un échec nommé, pas un rapport muet.
      - name: Récupérer la mesure de livraison (prise une seule fois par run)
        uses: actions/download-artifact@v4
        with:
          name: retard-livraison
          path: frontend/.bundle-size

      # Au premier run de `main`, .bundle-size/baseline.json n'existe pas : le
      # script le détecte (existsSync) et rend un rapport sans écarts.
      - name: Mesurer, comparer et publier (commentaire de PR)
        working-directory: frontend
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/bundle-size-report.js \
            --baseline .bundle-size/baseline.json \
            --out .bundle-size/current.json \
            --markdown .bundle-size/comment.md \
            --livraison .bundle-size/livraison.md \
            --summary "$GITHUB_STEP_SUMMARY" \
            --post

      # La mesure du run devient la référence des runs suivants — sur `main`
      # UNIQUEMENT : sauvegarder aussi depuis les PR ferait proliférer des
      # caches par PR et fausserait « la mesure de main ».
      - name: Publish size baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: frontend
        run: cp .bundle-size/current.json .bundle-size/baseline.json

      - name: Save size baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: frontend/.bundle-size
          key: bundle-size-baseline-${{ github.sha }}

  # ─── Tests E2E Playwright : parcours utilisateurs sous navigateur réel ──────
  # Exécute la suite Playwright (frontend/e2e/*.spec.js : user-flows, notifications,
  # LCP de /contact, et la géométrie du LCP de chaque route pré-rendue).
  # La suite ENTIÈRE tourne sur Chromium ; les DEUX parcours d'APPUI
  # (appuis-exterieurs.spec.js, notifications.spec.js) sont REJOUÉS sur Firefox
  # et WebKit (projets `firefox` et `webkit` de playwright.config.js), parce que
  # la séquence d'événements d'un appui tactile est un fait de MOTEUR :
  # `pointerdown → touchstart → pointerup → touchend → mousedown → mouseup →
  # click`. Le panneau de notifications se ferme sur `mousedown` et AGIT sur
  # `click` ; un moteur qui n'émettrait pas les événements de compatibilité, ou
  # dans un autre ordre, referait la panne historique (« l'appui ne supprime
  # jamais ») sans qu'aucun cas Chromium ne le voie. Les trois moteurs sont
  # donc installés ci-dessous.
  # Complète les tests unitaires jsdom et les vérifications statiques de build :
  #   1. Moteur réel : exécute le bundle JS compilé dans un vrai Chromium headless,
  #      garantissant le rendu DOM, l'exécution CSS et l'absence de runtime error.
  #   2. Contrôle CSP en condition réelle : vérifie que la Content Security Policy
  #      autorise les requêtes réseau, iframes, styles et images sans blocage.
  #   3. Parcours complets multi-pages : géolocalisation & permissions GPS,
  #      assistance/support (formulaires, validation email, dialogue robot) et
  #      authentification complète travailleur avec redirection /dashboard et /jobs.
  #   4. Couplage client/serveur : dialogue HTTP réel avec la fixture locale
  #      scripts/playtest-api-server.mjs (port 8123) et Vite preview (port 4173).
  #   5. LCP pré-rendu : la géométrie de l'élément LCP est comparée, route par
  #      route et à deux tailles, entre la peinture de la COQUILLE (bundle
  #      d'entrée bloqué) et celle de React — une peinture plus grande côté React
  #      ré-élit l'élément LCP et fait entrer le JavaScript dans le LCP simulé
  #      (voir frontend/e2e/lcp-geometrie.spec.js).
  #   6. Coût du DOCUMENT pré-rendu : « Style & Layout » (RecalcStyleDuration +
  #      LayoutDuration du renderer, lus au CDP) mesuré route par route et à deux
  #      conditions, sur une page neuve dont le bundle d'entrée est bloqué — donc
  #      le document seul, jamais React. Le budget vient d'un RELEVÉ (minima de
  #      5 runs, table dans frontend/scripts/style-layout-budgets.cjs) et le
  #      verdict est bidirectionnel : au-dessus il nomme le budget, en dessous
  #      (×0,6 du relevé) il refuse un document qui a perdu sa matière — une
  #      coquille qui cesse de publier son corps est une régression du contrat
  #      SEO / sans-JavaScript (voir frontend/e2e/style-layout-document.spec.js).
  #      Aucun job ni budget Lighthouse ajouté : c'est le job e2e existant qui la
  #      porte, ~1 min de plus.
  #   7. Classes calculées : pour chaque route pré-rendue et chaque taille, les
  #      éléments rendus qui occupent la même boîte dans la coquille et chez React
  #      doivent porter les mêmes classes ; un écart non déclaré échoue en nommant
  #      la paire (voir frontend/e2e/classes-coquille-react.spec.js).
  #   8. Session au rechargement, dans la topologie de la PRODUCTION : page et API
  #      sur deux hôtes, cookie rangé chez l'API, session jugée par la sonde
  #      livrée (directApi). Le proxy /api de la pile locale rend tout
  #      même-origine et laissait passer le défaut mesuré en production le
  #      12/10/2026 : réintroduit le 16/10/2026, il ne fait rougir que le rejeu
  #      cross-site (voir frontend/e2e/session-proxy.spec.js, et sa contre-épreuve
  #      qui tue la session à l'instant que la sonde juge).
  #   9. Multi-moteurs sur les gestes : les cas d'APPUI sont rejoués sur Firefox
  #      et WebKit, où la lecture du tactile par le moteur diffère de Chromium —
  #      c'est sur ces deux moteurs qu'un défaut de feuille de style a fait
  #      tomber la carte de /jobs dans l'ErrorBoundary (« Oups »), invisible en
  #      Chromium (voir frontend/e2e/appuis-exterieurs.spec.js).
  #  10. Accessibilité MESURÉE : axe (WCAG 2.1 A/AA) sur les DIX routes publiques,
  #      dans un vrai navigateur (le contraste ne se calcule pas en jsdom). Les
  #      constats `serious`/`critical` sont refusés, les `minor`/`moderate` sont
  #      PUBLIÉS dans le journal au lieu d'être tus. Le scan n'est pas déclaré
  #      fiable sur parole : deux cas INJECTENT le défaut (image sans `alt`,
  #      bouton sans nom accessible) et exigent que le MÊME analyseur le trouve —
  #      un garde qu'on n'a jamais vu rougir peut être aveugle (voir
  #      frontend/e2e/accessibilite-routes-publiques.spec.js).
  #  11. Parcours CLAVIER d'une page publique : le lien d'évitement est le
  #      PREMIER arrêt de Tab, son activation déplace le focus DANS `main`, la
  #      tabulation suivante y reste (la barre est sautée) — sur DEUX routes,
  #      parce que le chrome porte le lien, pas une page ; et sur le document
  #      SERVI, sans JavaScript, puisque c'est là qu'arrive un visiteur à froid.
  #      Les preuves d'échec retirent le lien puis l'identifiant de `main` et
  #      exigent que les MÊMES vérifications disent non (voir
  #      frontend/e2e/clavier-parcours-public.spec.js).
  #      Ces deux points n'ajoutent aucun job : ils tournent dans CE job, qui est
  #      un check REQUIS (`.github/scripts/gate-perimetre.json`) — un défaut
  #      d'accessibilité bloque donc la fusion comme les autres.
  e2e-playwright:
    # Le NOM de ce job est le nom du check REQUIS (`.github/scripts/gate-perimetre.json`,
    # protection de main, `livrer.py`) : il reste donc celui d'avant le passage à
    # trois moteurs, et la description du périmètre vit dans les commentaires
    # ci-dessus. Le renommer ici sans changer la protection de main ferait
    # attendre un check que personne ne publie.
    name: E2E Playwright tests (Chromium)
    runs-on: ubuntu-latest
    # 20 → 30 min le 22/10/2026 : le cache des binaires est indexé sur
    # l'empreinte de `frontend/package-lock.json`, donc l'ajout d'UNE
    # dépendance de test (`@axe-core/playwright`) l'a invalidé et le job a payé
    # le téléchargement complet des trois moteurs — deux passes de suite, tuées
    # à 20 min dans `playwright install --with-deps` avant même de lancer un
    # test (runs 39827179335 et sa reprise). Une fois le cache réamorcé, la
    # suite tient largement dans 30 min ; le délai ne change AUCUN critère, il
    # cesse seulement de confondre « installation lente » et « tests rouges ».
    timeout-minutes: 30
    needs: frontend-build
    # Le tableau des écarts par moteur est publié en COMMENTAIRE de PR (même
    # mécanique que le rapport de taille du bundle : un seul commentaire,
    # marqueur invisible, charge utile relue au push suivant). Ce job a donc
    # besoin du droit d'écrire dans la PR — sans lui, la publication échoue à
    # la première PR et le tableau reste invisible là où on le lit.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Le suffixe `v2` accompagne le passage à trois moteurs : les caches
          # `v1` ne contenaient que Chromium, et un « cache-hit » dessus ferait
          # échouer les projets firefox/webkit sur des binaires absents.
          #
          # `restore-keys` est la partie qui compte : le cache EXACT reste lié au
          # lock, mais une clé qui ne correspond plus (l'ajout d'UNE dépendance
          # suffit) ne repart plus de zéro — `playwright install` réutilise les
          # binaires restaurés et ne télécharge que les absents. C'est
          # exactement ce qui manquait le 22/10/2026, où 493 Mo ont été
          # retéléchargés avant que le job ne meure à 20 min : `cache-hit`
          # valant `false` sur une restauration partielle, la branche complète
          # (`install --with-deps`, qui ne retélécharge rien de présent) est
          # bien celle qui s'exécute, donc aucune version d'outil n'est jugée
          # à tort sur des binaires périmés.
          key: playwright-browsers-v2-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-browsers-v2-${{ runner.os }}-

      - name: Install Playwright browser dependencies (and binaries if cache miss)
        working-directory: frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium firefox webkit
          fi

      - name: Build frontend for E2E (fixture API URL)
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8123/api
        run: npm run build

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npm run test:e2e

      # `if: always()` : le tableau des écarts est une MESURE, et une MESURE se
      # publie aussi les jours de rouge — c'est même le jour où on la lit. Le
      # script ne recalcule rien (les relevés et les écarts viennent de
      # e2e/helpers/moteurs.js) et ne fait pas échouer le job pour une table
      # vide : il DIT le vide, avec son compte de relevés.
      - name: Publish engine gap table as PR comment (always)
        if: always()
        working-directory: frontend
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/ecarts-moteurs-report.js \
            --releves test-results/mesures-moteurs.jsonl \
            --table test-results/ecarts-moteurs.md \
            --markdown .ecarts-moteurs/comment.md \
            --summary "$GITHUB_STEP_SUMMARY" \
            --post

      # `if: always()` — et non `failure()` : le tableau des écarts par moteur est
      # une MESURE, pas un verdict. Un artefact publié les jours de rouge
      # seulement n'existe pas le jour où l'on veut comparer un moteur à l'autre
      # sur une exécution verte, c'est-à-dire presque toujours.
      - name: Upload Playwright report and engine gaps (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Le rapport HTML, le RÉSUMÉ des écarts placé DANS le rapport
          # (frontend/playwright-report/ecarts-moteurs.md, déposé par
          # e2e/reporters/ecarts-moteurs.js après la génération du rapport), et
          # la table elle-même — le seul endroit qui dit ce que Firefox et
          # WebKit ont mesuré des mêmes gestes.
          path: |
            frontend/playwright-report/
            frontend/test-results/ecarts-moteurs.md
          retention-days: 7

  # ─── Performance : budgets Lighthouse CI (10 pages : publiques, protégées) ──
  # Audite le DÉPLOIEMENT VERCEL RÉEL en condition mobile simulée (Slow 4G
  # + CPU 4x) et BLOQUE la PR si un budget est dépassé.
  #
  # URLs auditées (multi-URL, cf. frontend/lighthouserc.cjs, dont les
  # DEPLOYMENT_PATHS sont la LISTE DES PAGES DU PROJET : la table route → carte
  # OG des gardes en DÉRIVE, aucun second exemplaire à tenir à jour) :
  #   • /          — accueil (publique)
  #   • /register, /forgot-password — pages d'authentification PUBLIQUES, dont
  #     le CLS a été corrigé par les PR #19 (wrapper Register en min-h-full) et
  #     #20 (ForgotPasswordSkeleton calibré) : les auditer est ce qui empêche la
  #     correction de régresser sans que personne ne le voie. C'est vrai depuis
  #     le 18/09/2026 seulement : leur budget CLS propre (0,015 pour /register,
  #     scripts/lhci-cls-budgets.cjs) attrape la valeur d'avant #19 (0,0165),
  #     que le plafond global de 0,15 tolérait.
  #   • /login, /how-it-works, /support, /payment — pages pré-rendues qui
  #     n'étaient mesurées nulle part (ajoutées le 18/09/2026) ; /payment est
  #     protégée, les trois autres sont publiques.
  #   • /dashboard, /jobs, /profile — pages PROTÉGÉES, authentifiées via un
  #     token Bearer obtenu en se connectant avec le COMPTE CLIENT DÉDIÉ CI
  #     (secrets LHCI_CI_EMAIL / LHCI_CI_PASSWORD). Ce compte est distinct des
  #     comptes de test e2e partagés (README) : il n'est jamais touché à la
  #     main, donc les pages auditées ont un état déterministe et les budgets
  #     Lighthouse restent stables d'un run à l'autre. Les identifiants ne sont
  #     JAMAIS en clair dans le workflow ni dans le repo.
  #
  # Résolution de l'URL cible SANS VERCEL_TOKEN (seul FLY_API_TOKEN existait
  # dans les secrets, on a depuis ajouté LHCI_TEST_*) :
  #   • pull_request → l'app GitHub « Vercel » poste un commentaire avec
  #     l'URL de preview ; on la lit via l'API GitHub (GITHUB_TOKEN auto).
  #   • main (push) → AUCUNE URL : la pile LOCALE du job est la surface
  #     auditée. Le 20/09/2026, deux runs sur un arbre inchangé sont tombés
  #     rouges à cause du DÉFI de sécurité de l'edge Vercel servi à un client
  #     qui le sollicite en rafale depuis une IP de runner (reproduit : 403 +
  #     `X-Vercel-Mitigated: challenge` dès la ~33e requête d'une rafale) : le
  #     verdict dépendait d'un quota côté tiers. Détail et compromis assumé
  #     dans .github/scripts/resolve-vercel-url.sh et CI-COVERAGE.md.
  #   • Sinon → repli sur une pile LOCALE « forme production » : MongoDB +
  #     backend du dépôt + serveur local qui rejoue la table de rewrites de
  #     vercel.json devant le build (cf. plus bas).
  #
  # ── Le cycle /jobs/:id s'exécute désormais SUR LES PR ──────────────────────
  # La fiche mission n'existe que par le rewrite `/jobs/(.*)` → backend. Sur une
  # PR, la preview Vercel est protégée : resolve-vercel-url.sh retombait sur un
  # serveur statique nu, qui ne sert pas cette route, et check-og-job-200.js
  # sortait en 0 avec un ::notice — le cycle HTTP (création → fiche OG →
  # suppression → 404 + noindex + sitemap) ne tournait donc JAMAIS sur une PR,
  # et une régression ne se voyait qu'après fusion.
  # Le repli local rejoue maintenant la CONFIGURATION de production (la table
  # de rewrites, lue dans vercel.json) devant le CODE de la PR : le cycle
  # s'exécute en vraies requêtes HTTP, sur une base MongoDB jetable, sans
  # écriture en production et sans aucun secret supplémentaire.
  lighthouse-ci:
    name: Lighthouse performance budgets
    runs-on: ubuntu-latest
    # ~560 s mesurés le 20/09/2026 (13 pages × 3 runs) ; la pile locale ajoute
    # la préparation (pip install + provisioning MongoDB), déjà comptée.
    timeout-minutes: 30
    needs: frontend-build

    # MongoDB éphémère du repli local : c'est LUI qui rend le cycle /jobs/:id
    # possible sur une PR (création / suppression / sitemap). Aucun accès à une
    # base distante, donc aucune écriture en production depuis une PR.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # L'API inlinée est le BACKEND LOCAL du job (port 8000, démarré plus bas).
      # Ce build n'est servi QUE par la pile locale (le repli depuis le
      # 20/09/2026) : sur un déploiement réel, c'est Vercel qui sert son propre
      # build. Pointer l'API locale est ce qui rend les pages PROTÉGÉES
      # réellement authentifiables ici : le jeton Bearer posé par le job vient
      # du backend local, il n'est valable que contre lui — avec l'API de
      # production, /auth/me répondait 401 et /dashboard, /profile et /payment
      # se rendaient en redirection vers /login (mesures qui ne décrivent
      # aucune de ces pages, raison pour laquelle le repli n'auditait que
      # l'accueil).
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8000/api
        run: npm run build

      # Résout l'URL du déploiement Vercel à auditer : commentaire Vercel
      # de la PR (API GitHub, sans token supplémentaire) ou URL de prod sur
      # main. Sortie KOJO_LHCI_BASE_URL → lighthouserc.cjs l'utilise comme collect.url
      # (repli build local si non résolue). Logique dans
      # .github/scripts/resolve-vercel-url.sh.
      - name: Resolve Vercel deployment URL
        id: vercel-url
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/resolve-vercel-url.sh

      # ── Garde CORS de la PRODUCTION — main uniquement, BLOQUANTE ───────────
      # Le 18/09/2026, la bascule du frontend sur `kojoforafrica.cc.cd` a cassé
      # le site SANS une ligne de journal serveur : `allow_origins` était
      # construit sans `FRONTEND_APP_URL`, le motif Vercel (`allow_origin_regex`)
      # couvrait la production tant que le site vivait sous `*.vercel.app`, et
      # après la bascule Starlette refusait le préflight en 400 — AVANT les
      # routes, donc aucune trace applicative. Seules les consoles des visiteurs
      # le disaient.
      #
      # La sonde rejoue la paire que le navigateur exige (origine canonique du
      # site ↔ API inlinée par le build), préflight + GET crédité, et ÉCHOUE si
      # l'origine n'est pas autorisée — un `::notice` serait passé inaperçu,
      # c'est précisément ce qui s'est produit. Elle échoue aussi quand l'API
      # reste injoignable : une vérification qui n'a pas pu s'exécuter doit se
      # voir. Les réessais internes (6 × 15 s) absorbent la fenêtre du
      # déploiement Fly, qui tourne dans ce même run et peut encore servir une
      # instance ancienne — celle qui refuse la nouvelle origine.
      #
      # ⚠️ main uniquement, et c'est structurel : la sonde mesure la paire
      # DÉPLOYÉE. Sur une PR de migration de domaine, la production porte encore
      # l'ancienne configuration — un rouge y serait un faux positif au moment
      # même où il faut fusionner. L'ordre qui évite la panne reste : backend
      # (`FRONTEND_APP_URL` / `CORS_ORIGINS`) d'abord, frontend ensuite.
      - name: Garde CORS de la production (préflight réel, main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: frontend
        run: node scripts/check-cors-preflight.js

      # ── Repli local « forme production » (aucune preview Vercel exploitable) ─
      # Preview PROTÉGÉE par Deployment Protection (détectée par
      # resolve-vercel-url.sh) ou commentaire Vercel absent : on rejoue en local
      # ce que Vercel fait, devant le code de la PR.
      #
      # Les quatre steps suivants ne tournent QUE dans ce cas (`if` sur la
      # variable écrite par le résolveur : un déploiement réel audité sur main
      # n'a pas besoin de tout ça).
      # ⚠️ Le nom de la variable n'est PAS `LHCI_URL` : lhci active yargs
      # `.env('LHCI')`, donc toute variable `LHCI_<x>` devient l'option `--<x>`
      # du CLI. `LHCI_URL` devenait `--url`, une URL UNIQUE qui écrasait le
      # tableau d'URLs de lighthouserc.cjs (constaté : « 1 URL(s) » auditées
      # en CI, les pages protégées jamais mesurées). Le préfixe `KOJO_LHCI_`
      # n'est capturé par aucun motif yargs, et un test l'exige.
      - name: Set up Python 3.11 (repli local)
        if: ${{ !env.KOJO_LHCI_BASE_URL }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      # Le BACKEND DE LA PR est lancé pour de vrai (uvicorn) : c'est lui qui
      # sert le pré-rendu de la fiche /jobs/:id et les cartes Pillow, donc le
      # code backend de la PR est exercé en HTTP, pas seulement en processus.
      - name: Install backend dependencies (repli local)
        if: ${{ !env.KOJO_LHCI_BASE_URL }}
        working-directory: backend
        run: pip install --require-hashes -r requirements.lock

      # Compte client VÉRIFIÉ dans la base jetable : POST /api/jobs exige
      # user_type=client et DELETE /api/jobs/:id exige d'être la propriétaire.
      # Le mot de passe est généré à chaque run et ne quitte jamais le runner
      # (il ne protège qu'une MongoDB éphémère) : aucune valeur que seul
      # l'utilisateur possède n'est nécessaire pour exercer ce cycle.
      - name: Provision the local CI client account (repli local)
        if: ${{ !env.KOJO_LHCI_BASE_URL }}
        working-directory: backend
        run: |
          set -euo pipefail
          # Le service container MongoDB met quelques secondes à accepter les
          # connexions : sans cette attente, la provision échouerait au hasard
          # du démarrage (serverSelectionTimeoutMS = 10 s du script).
          MONGO_READY=""
          for _ in $(seq 1 30); do
            if python -c "import pymongo; pymongo.MongoClient('mongodb://localhost:27017', serverSelectionTimeoutMS=1000).admin.command('ping')" 2>/dev/null; then
              MONGO_READY=1
              break
            fi
            sleep 1
          done
          if [ -z "$MONGO_READY" ]; then
            echo "::error::MongoDB (service container) injoignable sur localhost:27017"
            exit 1
          fi
          PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"
          # Domaine RÉEL (kojo.sn, comme les fixtures de backend/tests) et non
          # un domaine réservé (`.test`, `.example`…) : /api/auth/login valide
          # l'adresse avec pydantic/email-validator, qui refuse les domaines à
          # usage spécial — mesuré sur le run du 17/09/2026.
          echo "KOJO_LHCI_LOCAL_EMAIL=ci-og-cycle@kojo.sn" >> "$GITHUB_ENV"
          echo "KOJO_LHCI_LOCAL_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          CI_PASSWORD="$PASSWORD" python scripts/provision_ci_test_account.py \
            "mongodb://localhost:27017/kojo_lhci_ci" "ci-og-cycle@kojo.sn"

      # Backend local + serveur de rewrites, puis PREUVE que la pile sert
      # réellement la fiche /jobs/:id (sonde 404 + noindex) : sans ce contrôle,
      # une pile mal démarrée ferait « ignorer » le cycle en vert, c'est-à-dire
      # exactement le trou qu'on ferme.
      #
      # FRONTEND_APP_URL = l'adresse de CE serveur : le pré-rendu backend
      # construit les og:image et le canonical de la fiche à partir d'elle, et
      # check-og-job-200.js compare les deux (KOJO_ORIGIN).
      # KOJO_BACKEND_URL = le backend LOCAL : la création et la suppression de
      # la mission de test ne touchent donc jamais la production.
      #
      # Serveurs en arrière-plan : nohup + log redirigé pour survivre aux steps
      # suivants (les logs sont publiés en artifact en cas d'échec).
      - name: Serve local stack (backend + table de rewrites de vercel.json)
        if: ${{ !env.KOJO_LHCI_BASE_URL }}
        working-directory: backend
        run: |
          set -euo pipefail
          LOCAL_BASE="http://127.0.0.1:4174"
          LOCAL_BACKEND="http://127.0.0.1:8000"

          nohup env \
            MONGO_URL="mongodb://localhost:27017" \
            DB_NAME="kojo_lhci_ci" \
            APP_ENV="test" \
            REDIS_URL="" \
            DISABLE_TRUSTED_HOST_MIDDLEWARE="true" \
            EMAIL_PROVIDER="none" \
            JWT_SECRET="$(openssl rand -hex 32)" \
            EMAIL_OTP_SECRET="$(openssl rand -hex 32)" \
            FRONTEND_APP_URL="$LOCAL_BASE" \
            uvicorn server:app --host 127.0.0.1 --port 8000 \
            > /tmp/kojo-local-backend.log 2>&1 &
          echo $! > /tmp/kojo-local-backend.pid

          for _ in $(seq 1 45); do
            curl -sf "$LOCAL_BACKEND/health" >/dev/null 2>&1 && break
            sleep 1
          done
          if ! curl -sf "$LOCAL_BACKEND/health" >/dev/null 2>&1; then
            echo "::error::le backend local n'a pas répondu sur $LOCAL_BACKEND/health"
            tail -50 /tmp/kojo-local-backend.log
            exit 1
          fi

          nohup node ../frontend/scripts/vercel-rewrite-server.js \
            --port 4174 --root ../frontend/build \
            --config ../frontend/vercel.json --backend "$LOCAL_BACKEND" \
            > /tmp/kojo-local-rewrites.log 2>&1 &
          echo $! > /tmp/kojo-local-rewrites.pid

          for _ in $(seq 1 30); do
            curl -sf "$LOCAL_BASE/" >/dev/null 2>&1 && break
            sleep 1
          done
          if ! curl -sf "$LOCAL_BASE/" >/dev/null 2>&1; then
            echo "::error::le serveur de rewrites n'a pas répondu sur $LOCAL_BASE"
            tail -50 /tmp/kojo-local-rewrites.log
            exit 1
          fi

          # Sonde de capacité : la fiche inconnue doit répondre 404 + noindex.
          # C'est la MÊME observation que celle des scripts (elle décide si le
          # cycle s'exécute) : la vérifier ici nomme la cause au lieu de laisser
          # le cycle s'annoncer « ignoré ».
          PROBE_HEADERS="$(curl -sS -D - -o /dev/null "$LOCAL_BASE/jobs/00000000-0000-4000-8000-000000000000")"
          PROBE_STATUS="$(printf '%s' "$PROBE_HEADERS" | head -1 | awk '{print $2}')"
          if [ "$PROBE_STATUS" != "404" ] || ! printf '%s' "$PROBE_HEADERS" | grep -qi 'noindex'; then
            echo "::error::la pile locale ne sert pas la route /jobs/:id (HTTP $PROBE_STATUS) — le cycle ne pourrait pas s'exécuter"
            printf '%s\n' "$PROBE_HEADERS" | head -20
            exit 1
          fi
          echo "Sonde /jobs/:id : 404 + noindex (pré-rendu backend servi par la pile locale)"

          # Jeton du compte local : le cycle et l'audit des pages protégées
          # utilisent le même en-tête que sur un déploiement réel.
          LOGIN_JSON="$(curl -sS -X POST "$LOCAL_BACKEND/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$KOJO_LHCI_LOCAL_EMAIL\",\"password\":\"$KOJO_LHCI_LOCAL_PASSWORD\"}")"
          TOKEN="$(printf '%s' "$LOGIN_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")"
          if [ -z "$TOKEN" ]; then
            echo "::error::login du compte CI local échoué — réponse: ${LOGIN_JSON:0:200}"
            exit 1
          fi
          AUTH_HEADER="$(python3 -c "import json,sys; print(json.dumps({'Authorization': 'Bearer ' + sys.argv[1]}))" "$TOKEN")"

          {
            echo "KOJO_LHCI_BASE_URL=$LOCAL_BASE"
            echo "KOJO_BACKEND_URL=$LOCAL_BACKEND"
            echo "KOJO_ORIGIN=$LOCAL_BASE"
            echo "KOJO_LHCI_AUTH_HEADER=$AUTH_HEADER"
            echo "KOJO_LHCI_LOCAL_STACK=1"
          } >> "$GITHUB_ENV"
          echo "Pile locale prête : $LOCAL_BASE (build frontend + $LOCAL_BACKEND + table de rewrites)"

      # Authentifie les pages protégées : se connecte au backend prod avec le
      # COMPTE CLIENT DÉDIÉ CI (secrets LHCI_CI_EMAIL/LHCI_CI_PASSWORD) et
      # stocke le token Bearer dans KOJO_LHCI_AUTH_HEADER. Ce compte est isolé des
      # comptes e2e partagés → l'état audité (/dashboard,/jobs,/profile) est
      # déterministe. Pendant la transition, on retombe sur les anciens
      # secrets LHCI_TEST_* s'ils sont encore définis. Les pages reçoivent cet
      # en-tête lors du collect → le shell React les rend authentifiées
      # (sinon /auth/me → 401 et redirection vers /login).
      - name: Authenticate CI test account (fetch Bearer token)
        id: ci-auth
        # Le repli local a déjà posé son propre jeton (compte provisionné dans
        # la base jetable) : les secrets ne servent que sur un déploiement réel.
        if: env.KOJO_LHCI_LOCAL_STACK != '1'
        env:
          LHCI_CI_EMAIL: ${{ secrets.LHCI_CI_EMAIL }}
          LHCI_CI_PASSWORD: ${{ secrets.LHCI_CI_PASSWORD }}
          LHCI_TEST_EMAIL: ${{ secrets.LHCI_TEST_EMAIL }}
          LHCI_TEST_PASSWORD: ${{ secrets.LHCI_TEST_PASSWORD }}
        run: |
          EMAIL="${LHCI_CI_EMAIL:-$LHCI_TEST_EMAIL}"
          PASSWORD="${LHCI_CI_PASSWORD:-$LHCI_TEST_PASSWORD}"
          if [ -z "$EMAIL" ]; then
            echo "::error::Secrets LHCI_CI_EMAIL/LHCI_CI_PASSWORD (ou LHCI_TEST_* en transition) non définis — les pages protégées ne seront pas auditées"
            exit 1
          fi
          LOGIN_JSON=$(curl -sS -X POST "https://api.kojoforafrica.cc.cd/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")
          TOKEN=$(printf '%s' "$LOGIN_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$TOKEN" ]; then
            echo "::error::Login du compte CI dédié échoué (vérifier les secrets) — réponse: ${LOGIN_JSON:0:200}"
            exit 1
          fi
          # JSON sérialisé pour l'env : {\"Authorization\": \"Bearer <token>\"}
          AUTH_HEADER=$(python3 -c "import json,sys; print(json.dumps({'Authorization': 'Bearer ' + sys.argv[1]}))" "$TOKEN")
          echo "KOJO_LHCI_AUTH_HEADER=$AUTH_HEADER" >> "$GITHUB_ENV"
          echo "Token récupéré (${#TOKEN} chars, compte: $EMAIL)"

      # Vérifie que chaque page auditée sert un og:image ABSOLU et spécifique
      # par route — le HTML servi est exactement ce que reçoit un crawler sans
      # JS (le pré-rendu OG). Échoue le job (→ PR bloquée) si un og:image est
      # absent, relatif, ou ne correspond pas à la carte attendue de la route
      # (/, /jobs, /login). KOJO_LHCI_BASE_URL (résolue plus haut : déploiement
      # réel, sinon pile locale) est lue par le script via process.env. Le script
      # OBSERVE si la base auditée sert /jobs/:id (sonde 404 + noindex) : sur la
      # pile locale elle le sert, donc la fiche y est vérifiée aussi.
      - name: Check OG images per route (crawler view)
        working-directory: frontend
        run: node scripts/check-og-images.js

      # Verrouille les DEUX chemins de /jobs/:id. Chemin 200 : crée une mission
      # de test avec le COMPTE CLIENT CI, vérifie la carte OG RÉELLE de cette
      # mission (og:image wide + carrée, og:title présent, PNG 1200x630 /
      # 1200x1200) puis la SUPPRIME — toujours, y compris si la vérification
      # échoue (finally). Sans lui, ce chemin n'était exercé que les jours où
      # une mission existait en base : check-og-images se rabattait alors sur le
      # chemin 404. Toujours AVANT Lighthouse CI, pour que la mission de test
      # ait disparu de la liste quand /jobs est audité (et parce qu'un échec de
      # nettoyage doit bloquer le job, pas passer inaperçu).
      # Chemin 404 (APRÈS le DELETE, donc plus aucun effet de bord en base) : la
      # fiche doit répondre 404 + noindex, sa carte Pillow 404, et le sitemap ne
      # plus la lister — une fiche morte restée en 200 garde sa carte et reste
      # indexable. Contrepartie vérifiée AVANT suppression : la mission doit
      # APPARAÎTRE dans le sitemap, sinon « absente du sitemap » serait vrai à
      # vide. Les sondes post-suppression portent un paramètre de cache-busting
      # car la fiche vivante est servie avec s-maxage=3600 (l'URL nue pourrait
      # renvoyer un 200 sorti du cache CDN).
      # Ce script ne saute QUE si la base auditée ne sert pas la route (sonde de
      # capacité) : un serveur statique nu. La pile locale du repli REJOUE la
      # table de rewrites devant le backend de la PR, donc le cycle s'y exécute
      # — c'est ce qui ferme le seul trou de couverture des PR. La mission de
      # test est créée et supprimée dans la MongoDB JETABLE du job
      # (KOJO_BACKEND_URL = backend local) : aucune écriture en production.
      # KOJO_LHCI_BASE_URL, KOJO_BACKEND_URL, KOJO_ORIGIN et
      # KOJO_LHCI_AUTH_HEADER sont déjà dans l'environnement (steps précédents,
      # via $GITHUB_ENV) ; les secrets servent de repli si le jeton n'a pas été
      # résolu par le login du déploiement réel.
      - name: Check /jobs/:id OG path (create → 200 → delete → 404 + noindex + sitemap)
        working-directory: frontend
        env:
          LHCI_CI_EMAIL: ${{ secrets.LHCI_CI_EMAIL }}
          LHCI_CI_PASSWORD: ${{ secrets.LHCI_CI_PASSWORD }}
          LHCI_TEST_EMAIL: ${{ secrets.LHCI_TEST_EMAIL }}
          LHCI_TEST_PASSWORD: ${{ secrets.LHCI_TEST_PASSWORD }}
        run: node scripts/check-og-job-200.js

      # LA FORME d'une fiche /jobs/:id, jugée sur une mission de CONTRÔLE : le
      # document servi par un crawler sans JavaScript — <title> qui NOMME la
      # mission, description = son extrait de 150 caractères, meta robots
      # indexable (aucun noindex), canonical de CETTE fiche, og:url et
      # twitter:url accordés, <h1> statique porteur du titre, og:title accordé au
      # <title> — puis suppression et verrou (404 + noindex + carte 404 +
      # sitemap). Rien d'autre ne la jugeait : check-og-images.js et
      # check-seo-production.js lisent les missions du CLIENT (aucune le
      # 12/10/2026, donc deux ::warning déclarés), et le cycle OG ci-dessus ne
      # juge que les cartes. La forme dépendait donc de l'état des DONNÉES du
      # client — un jour sans mission était un jour de silence.
      # Comme le cycle OG, il ÉCRIT (POST puis DELETE) : ici, dans la MongoDB
      # jetable du job (KOJO_BACKEND_URL = backend local), donc AUCUNE écriture en
      # production — et hors loopback, la sonde exige le mandat explicite
      # KOJO_CANARI_ALLOW_WRITE=1 (jamais posé par un run de PR). Quand elle ne
      # peut pas écrire, elle publie un ::warning déclaré (surface
      # job-form-canari:forme, registre scripts/corpus-missions.js) au lieu de
      # passer pour un vert. Toujours AVANT Lighthouse CI, pour que la mission de
      # contrôle ait disparu de la liste quand /jobs est audité.
      - name: Check /jobs/:id FORM (create control mission → judge served document → delete → lock)
        working-directory: frontend
        env:
          LHCI_CI_EMAIL: ${{ secrets.LHCI_CI_EMAIL }}
          LHCI_CI_PASSWORD: ${{ secrets.LHCI_CI_PASSWORD }}
          LHCI_TEST_EMAIL: ${{ secrets.LHCI_TEST_EMAIL }}
          LHCI_TEST_PASSWORD: ${{ secrets.LHCI_TEST_PASSWORD }}
        run: node scripts/check-job-form-canari.js

      # ubuntu-latest embarque Google Chrome : chrome-launcher le détecte
      # automatiquement (pas d'action d'installation nécessaire).
      # KOJO_LHCI_BASE_URL dit QUELLE surface est auditée : une preview Vercel
      # quand elle est résolue (PR), sinon la pile locale de ce job — qui sert
      # alors TOUTES les pages du projet (KOJO_LHCI_LOCAL_STACK=1), pages
      # protégées comprises, avec le plafond TBT élargi d'un runner partagé
      # (lighthouserc.cjs, et son test check-lhci-env.test.js).
      # KOJO_LHCI_AUTH_HEADER authentifie les pages /dashboard,/jobs,/profile.
      - name: Run Lighthouse CI (collect + assert, budgets bloquants)
        working-directory: frontend
        # KOJO_LHCI_BASE_URL et KOJO_LHCI_AUTH_HEADER sont dans l'env via $GITHUB_ENV (steps
        # précédents) — lhci autorun lit process.env.KOJO_LHCI_AUTH_HEADER.
        run: npx lhci autorun --config=lighthouserc.cjs

      # Passe DESKTOP, séparée : le socle ci-dessus est mesuré en condition
      # mobile (CPU ×4 + 4G simulée) et plafonne le TBT à 1200/1600 ms — des
      # plafonds de runner partagé, pas des seuils d'audit. Or les `settings`
      # d'un collect valent pour TOUTES ses URLs : une même passe ne peut pas
      # être mobile pour 13 pages et desktop pour une. C'est pourtant la
      # condition de l'audit qui a relevé 477 ms sur l'accueil desktop
      # (« should be < 200 ms »), et une page peut très bien satisfaire le
      # plafond mobile en le dépassant en desktop.
      # Cette passe n'audite QUE les deux pages dont on a un TBT desktop MESURÉ
      # (/ et /jobs), et n'asserte QUE deux choses par page : le TBT desktop
      # (meilleur des 3 runs) et le plafond CLS mesuré de la route. Le plafond de
      # TBT est PAR ROUTE — 200 ms sur l'accueil (0 / 0 / 15 ms mesurés, dont 3
      # runs avec 4 boucles CPU sur 8 cœurs), 150 ms sur /jobs (27 runs desktop à
      # 0 ms, dans quatre conditions : pile de la CI, 4 boucles CPU, bord de CDN
      # froid, 7 boucles CPU) — chacun adossé à une borne haute du coût de SA
      # page. Les deux tables refusent une route sans mesure : sans valeur
      # mesurée, la page serait auditée sans plafond. Les relevés sont dans
      # frontend/scripts/lhci-cls-budgets.cjs (TBT_DESKTOP_BUDGETS / CLS_BUDGETS)
      # et l'en-tête de frontend/lighthouserc.desktop.cjs. Preuve d'échec :
      # frontend/scripts/__tests__/lhci-desktop-tbt.test.js, rejouée par la suite
      # Vitest du job frontend ; ici, on exécute la passe réelle.
      - name: Run Lighthouse CI desktop (TBT par route — / et /jobs, budget bloquant)
        working-directory: frontend
        run: npx lhci autorun --config=lighthouserc.desktop.cjs

      - name: Fermer la pile locale et vérifier l’environnement final
        if: always()
        working-directory: frontend
        run: |
          set -euo pipefail
          for pidfile in /tmp/kojo-local-rewrites.pid /tmp/kojo-local-backend.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
              rm -f "$pidfile"
            fi
          done
          for _ in $(seq 1 10); do
            if ! node scripts/check-test-environment.js --no-preview-tabs >/dev/null 2>&1; then
              sleep 1
            else
              break
            fi
          done
          if [ "${KOJO_LHCI_LOCAL_STACK:-}" = "1" ]; then
            node scripts/check-test-environment.js --no-preview-tabs
          elif [ -n "${KOJO_LHCI_BASE_URL:-}" ]; then
            node scripts/check-test-environment.js --preview-url "$KOJO_LHCI_BASE_URL"
          else
            node scripts/check-test-environment.js --no-preview-tabs
          fi

      # Rapports consultables dans les artifacts du run (utile pour
      # diagnostiquer un échec de budget). Toujours uploadés, même si le
      # job échoue (if: always()).
      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: frontend/lhci-reports

      # Journaux de la pile locale (démarrage uvicorn, requêtes de rewrites) :
      # sans eux, un rouge sur le repli ne dit pas si c'est le backend, le
      # serveur de rewrites ou le cycle qui a échoué.
      - name: Upload local stack logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-stack-logs
          if-no-files-found: ignore
          path: |
            /tmp/kojo-local-backend.log
            /tmp/kojo-local-rewrites.log

  # ─── Mobile : Capacitor sync + build Android debug ───────────────────────
  mobile-build:
    name: Mobile build (Capacitor + Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # EN PREMIER, avant Node/Java/SDK : ce contrôle répond en 0,17 s (mesuré)
      # là où le step APK ne démarre qu'à +39 s du job (mesuré sur le run
      # 35137466972, setup Node/Java/SDK inclus) et où le build Gradle dure
      # ensuite ~95 s. Un bit exécutable perdu n'échouait donc que là, tard, sous
      # la forme d'un « Permission denied » qui ne désignait pas la cause (le
      # mode git du fichier). Le script distingue le mode perdu DANS GIT du bit
      # non matérialisé PAR LE CHECKOUT, et vérifie aussi le shebang (un CRLF le
      # casserait même avec le bit présent).
      - name: Check executable bits (gradlew) before the Android setup
        run: python3 .github/scripts/check-exec-bits.py

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web assets (webDir = build)
        working-directory: frontend
        run: npm run build

      # Synchronise le web build + les plugins Capacitor dans android/
      # (valide aussi que la config Capacitor et les versions plugins collent)
      - name: Capacitor sync
        working-directory: frontend
        run: npx cap sync android

      # Capacitor 8 compile en Java 21 (source/target 21) : un JDK 17
      # échoue sur « invalid source release: 21 ». Gradle 8.14 et AGP 8.13
      # supportent Java 21.
      - name: Set up Java 21 (Capacitor 8 / AGP 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # android-actions/setup-android installe par défaut `tools platform-tools`
      # (`packages`) ; or le paquet « tools » a été RETIRÉ du dépôt Android SDK :
      # l'action échouait sur « Warning: Failed to find package 'tools' »
      # (sdkmanager exit 1) avant même la compilation. On ne demande donc que
      # les paquets qui existent encore ; AGP télécharge la plateforme 36
      # (compileSdk, variables.gradle) au premier build, les licences étant
      # acceptées juste en dessous.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # compileSdk 36 (variables.gradle) : accepter les licences SDK une
      # fois pour toutes, puis laisser Gradle/AGP télécharger la plateforme
      # et les build-tools dont il a besoin (échec rapide sinon : licences
      # non acceptées pour platforms;android-36).
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # Pas de `chmod +x gradlew` ici : le bit exécutable est porté par git
      # (mode 100755 sur frontend/android/gradlew, commit dcb4e43) et le
      # checkout des runners Linux le restitue — le mode du blob est 0755, donc
      # ./gradlew s'exécute directement. Un chmod défensif faisait plus de mal
      # que de bien : il rendait VERT un job dont le bit avait été perdu et
      # masquait la régression. S'il disparaît à nouveau, ce step échouera sur
      # « Permission denied » — c'est la détection voulue, la corriger est un
      # `git update-index --chmod=+x frontend/android/gradlew`.
      # Le shebang est protégé en parallèle par .gitattributes (`gradlew
      # text eol=lf`) : un shebang en CRLF ferait échouer l'exécution même
      # avec le bit présent.
      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

  # ─── Backend : déploiement Fly.io (verrouillé sur les tests backend) ─────
  # Déployé à chaque push sur main qui touche backend/ — MAIS uniquement si
  # le job backend-tests passe. Un échec frontend/mobile ne bloque PAS le
  # déploiement backend (needs: backend-tests uniquement).
  #
  # Prérequis (une seule fois) :
  #   1. fly tokens create deploy -n "GitHub Actions"
  #   2. Ajouter le token comme secret du dépôt nommé FLY_API_TOKEN
  #      (Settings → Secrets and variables → Actions).
  deploy-fly:
    name: Deploy backend to Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-tests
    # ─── LA POLITIQUE DE CE JOB — écrite ICI, et nulle part ailleurs ────────
    # Ce job ne se contente pas de DIRE s'il a déployé : il VÉRIFIE quelle
    # révision le service exécute. Trois cas, un seul verdict, et c'est le
    # filtre `backend/**` ci-dessous qui les sépare :
    #   • push qui touche `backend/**` (ou ce workflow), ou dispatch manuel
    #     (qui force le déploiement) → le déploiement vient d'avoir lieu, la
    #     révision attendue est CE commit ;
    #   • push qui n'y touche pas → les étapes de déploiement sont `skipped`, et
    #     le service DOIT tourner le DERNIER commit qui a touché `backend/**` :
    #     si la production est restée en arrière (déploiement précédent échoué),
    #     le job rougit au lieu d'afficher le ✓ ambigu « rien n'a été déployé ».
    # La révision comparée est celle que l'IMAGE annonce (`--build-arg
    # KOJO_GIT_SHA` → /health, cf. backend/Dockerfile) : une propriété du build,
    # pas de l'environnement d'exécution.
    # Les étapes qui suivent ne répètent que la mécanique qui leur est propre ;
    # les documents qui décrivent cette politique pointent ici (CI-COVERAGE.md,
    # §2 et F1) au lieu de la recopier.
    #
    # Jamais depuis un PR ; déploiement sur main (push auto OU dispatch manuel).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    # Pas d'annulation en plein vol : un déploiement est étatique (machines
    # Fly) ; les pushes successifs attendent leur tour.
    concurrency:
      group: deploy-fly
      cancel-in-progress: false

    steps:
      # HISTORIQUE COMPLET, exigé par la vérification de révision (politique du
      # job) : sur un clone superficiel, `git rev-list -1 HEAD -- backend/` ne
      # verrait qu'un commit et le garde refuserait de conclure (code 2).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Le filtre qui sépare les deux cas de la politique du job (ci-dessus) :
      # rien à redéployer pour un push qui ne touche que le frontend/docs.
      - name: Detect backend changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

      - name: Setup flyctl
        if: steps.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # v1 (node24)

      # --remote-only : le build se fait sur les builders distants de Fly
      # (Depot), pas de Docker nécessaire sur le runner. fly.toml et
      # Dockerfile sont lus depuis backend/ (working-directory).
      # --build-arg KOJO_GIT_SHA : la révision entre dans l'IMAGE et /health la
      # publie ; sans elle, /health répondrait « inconnue » et le refus nommerait
      # ce champ (politique du job, ci-dessus).
      - name: Deploy to Fly.io
        if: steps.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: backend
        run: flyctl deploy --remote-only --build-arg KOJO_GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # L'étape qui VÉRIFIE (la politique du job est en tête de job : ce n'est
      # pas ici qu'elle se redéfinit). `if: always()` : elle dit aussi la vérité
      # quand le déploiement a échoué — le service tourne alors l'ancienne image,
      # et c'est un échec. Le garde attend ~3 min qu'un déploiement se termine,
      # puis refuse en nommant la révision servie ET l'attendue.
      - name: Le backend servi est-il celui de ce commit ?
        if: always()
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # `-e` REMIS le 12/10/2026 : le step s'en passait sans motif écrit, et un
          # step qui n'abandonne pas sur une commande en échec peut perdre son
          # verdict en route (garde `.github/scripts/check-informative-steps.py`).
          set -euo pipefail
          if [ "$DISPATCH" = "true" ]; then
            ATTENDU="${{ github.sha }}"
            ORIGINE="dispatch manuel (déploiement forcé)"
          else
            ATTENDU="$(git rev-list -1 HEAD -- backend/ .github/workflows/ci.yml)"
            ORIGINE="dernier commit ayant touché backend/** (déploiement sauté s'il n'y en a pas de nouveau)"
          fi
          if [ -z "$ATTENDU" ]; then
            echo "::error::aucune révision attendue calculée — la vérification ne peut pas conclure"
            exit 2
          fi
          echo "Révision attendue : $ATTENDU ($ORIGINE)"
          python3 backend/scripts/check_deployed_revision.py --attendu "$ATTENDU" --tentatives 9 --delai 20

      # L'autre moitié : ÉCRIRE ce que le job a fait (notice + résumé du run),
      # pour que « main est vert » ne se lise plus à tort comme « la production
      # tourne le code de main » (politique du job, en tête).
      - name: Dire si le backend a été déployé
        if: always()
        env:
          BACKEND_CHANGED: ${{ steps.changes.outputs.backend }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$BACKEND_CHANGED" = "true" ] || [ "$DISPATCH" = "true" ]; then
            echo "::notice title=Backend déployé::flyctl deploy a été exécuté sur ce commit — le backend servi correspond à ce run."
            echo "Backend déployé (flyctl deploy exécuté sur ce commit)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=Backend NON déployé::aucun changement dans backend/** sur ce push — le backend servi est celui du déploiement précédent, PAS ce commit."
            echo "Backend non déployé (aucun changement backend/** : le service tourne le déploiement précédent)." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─── Avis de sécurité des dépendances ──────────────────────────────────────
  # Motif : le dépôt n'en avait AUCUN (angle mort assumé de CI-COVERAGE.md §7)
  # — une dépendance vulnérable pouvait donc rester en place indéfiniment sans
  # qu'aucun job le dise. Deux périmètres, deux régimes, et c'est le périmètre
  # qui décide :
  #   • les dépendances de PRODUCTION du frontend (celles qu'un visiteur
  #     télécharge) SONT un gate : 0 avis au 20/09/2026, donc exiger « aucun
  #     avis haut/critique » ne relève pas un seuil, il constate un état ;
  #   • les dépendances de DÉVELOPPEMENT (frontend) SONT un gate depuis le
  #     10/10/2026 : l'audit complet (dev incluses) relève 0 avis après la
  #     migration Tailwind 4 et les overrides LHCI.
  #   • les dépendances PYTHON (backend/requirements.lock, dev incluses) SONT un
  #     gate depuis le 10/10/2026 : pip-audit relève 0 avis après la relève des
  #     épinglages (starlette, pillow, pytest, black). Un avis futur fait
  #     échouer le job, et le résumé du run le nomme avec sa version corrigée.
  dependency-audit:
    name: Dépendances (avis de sécurité)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Depuis le LOCKFILE : aucun `npm ci` n'est nécessaire pour interroger le
      # registre, et le job reste à quelques secondes.
      - name: Avis sur les dépendances frontend, dev incluses — BLOQUANT
        working-directory: frontend
        run: npm audit --audit-level=high

      # `pip-audit` n'est pas dans `requirements.lock` (c'est l'outil qui
      # l'audite) : sa clé de cache est le fichier AUDITÉ, seule chose qui
      # puisse dire de re-résoudre l'arbre — et un audit rejoué à l'identique
      # n'a pas à re-télécharger sa chaîne de dépendances.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Avis sur les dépendances Python (backend/requirements.lock, dev incluses) — BLOQUANT
        working-directory: backend
        run: |
          set -uo pipefail
          python -m pip install --quiet pip-audit
          # L'arbre AUDITÉ est celui qui est INSTALLÉ : `requirements.lock` porte
          # les pins, donc l'avis juge la version expédiée. Auditer
          # `requirements.txt` (des plages) laissait le résolveur choisir une
          # autre version que celle du lock — un avis vert sur du code qui ne
          # part pas, ou rouge sur une version qui ne part pas non plus.
          # pip-audit sort 0 si aucun avis, 1 si au moins un avis (ou si la
          # résolution échoue : le gate échoue alors aussi, c'est voulu).
          #
          # Le statut est CAPTURÉ sans laisser `set -e` tuer l'étape : mesuré le
          # 20/10/2026, un avis réel (Pillow 12.3.0, 8 CVE) terminait le job sur
          # `Process completed with exit code 1` SANS un seul nom de paquet — la
          # boucle qui publie le tableau et les `::error` ne s'exécutait jamais.
          # Une sonde qui échoue sans dire ce qu'elle a vu est le défaut que ce
          # job existe pour éviter.
          STATUT=0
          python -m pip_audit -r requirements.lock --progress-spinner off > /tmp/pip-audit.txt 2>&1 || STATUT=$?
          echo "### Avis de sécurité — dépendances Python (backend/requirements.lock)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUT" -eq 0 ]; then
            echo "Aucun avis : les versions épinglées de requirements.lock sont à jour." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Lignes de tableau « paquet version identifiant version_corrigée » ;
          # la ligne de synthèse « Found N known vulnerabilities » en est exclue.
          LIGNES=$(grep -Ei '^[a-z0-9_.-]+ +[0-9]' /tmp/pip-audit.txt | grep -vi '^found ' | sort -u | head -40 || true)
          if [ -z "$LIGNES" ]; then
            # Sortie sans tableau (erreur de résolution, réseau) : nommée, pas avalée.
            echo "Pip-audit a échoué sans verdict de tableau (voir les lignes en erreur du log)." >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=pip-audit sans verdict::$(tail -n 3 /tmp/pip-audit.txt | tr '\n' ' ')"
          else
            {
              echo "Avis CONSTATÉS (bloquant) :"
              echo '```'
              printf '%s\n' "$LIGNES"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$LIGNES" | while read -r paquet version avis corrige; do
              echo "::error title=Avis Python::$paquet $version — $avis (corrigé en $corrige)"
            done
          fi
          exit 1

  # ─── Secrets : rien ne part sans être scanné ──────────────────────────────
  # Le dépôt épingle ses actions, applique une allowlist aux paiements, exige
  # `JWT_SECRET`/`EMAIL_OTP_SECRET` (fail-fast) et filtre les emails : la
  # surface des CLÉS, elle, n'était jugée par personne. Un jeton collé dans un
  # script, une clé de test qui n'en est pas une, un `.env` déposé par erreur —
  # rien de tout ça ne cassait un test, et une fois fusionné le secret reste
  # dans l'historique même après sa suppression du fichier.
  #
  # La sonde juge donc les commits que CETTE PR apporte (`base...HEAD`), pas
  # l'historique entier : l'historique a eu sa passe unique (relevé du
  # 20/10/2026 : 2 115 commits, 21 constats, 0 secret réel, cf. .gitleaks.toml),
  # et la rejouer à chaque PR rendrait le gate rouge sur des faits anciens
  # qu'aucune PR ne peut corriger. La passe est rejouable à la demande :
  # .github/workflows/secret-scan-history.yml.
  #
  # BLOQUANT, sans exception : ni `continue-on-error`, ni commande neutralisée
  # (cf. check-informative-steps.py — une étape qui ne peut pas rougir ne
  # surveille rien).
  secret-scan:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # La plage se calcule contre la branche de base : sans historique, le
          # `git fetch` ci-dessous ne peut pas matérialiser `origin/<base>` et
          # la plage serait vide — un vert qui n'a rien mesuré.
          fetch-depth: 0

      # Installation ÉPINGLÉE et VÉRIFIÉE (version constante + empreinte
      # SHA-256 de la release) : un binaire téléchargé sans contrôle a le même
      # défaut qu'un `uses:` sur une branche. Source unique de la version pour
      # les deux workflows — deux copies divergeraient en silence.
      - name: Installer gitleaks (version épinglée, empreinte vérifiée)
        run: sh .github/scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"

      # Le verdict est rendu par `.github/scripts/rapport-secrets.py`, qui
      # ANNOTE chaque constat (fichier, ligne, règle) sans publier la valeur,
      # et qui REFUSE de conclure quand la plage n'a pas été parcourue : une
      # plage mal calculée scanne zéro commit et paraîtrait propre. Le nombre
      # attendu vient de `git rev-list --count`, jamais d'une constante.
      - name: Scanner les commits de cette PR — BLOQUANT
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          AVANT: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENEMENT" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "+refs/heads/${BASE_REF:-}:refs/remotes/origin/${BASE_REF:-}"
            PLAGE="origin/${BASE_REF:-}...HEAD"
          elif [ -n "${AVANT:-}" ] && [ -n "$(printf '%s' "$AVANT" | tr -d 0)" ]; then
            # Push : les commits que ce push PUBLIE, pas tout l'historique.
            PLAGE="$AVANT..HEAD"
          else
            # Première publication d'une branche : `before` est le SHA nul, il
            # n'y a pas de « nouveaux commits » à isoler. On juge tout, et la
            # sortie le DIT (le fait est publié, pas glissé).
            PLAGE="--all"
          fi
          ATTENDUS=$(git rev-list --count "$PLAGE")
          echo "Plage jugée : $PLAGE ($ATTENDUS commit(s))"
          {
            echo "### Scan de secrets — plage jugée"
            echo ""
            echo "- \`$PLAGE\` : $ATTENDUS commit(s)"
          } >> "$GITHUB_STEP_SUMMARY"
          gitleaks git . --log-opts="$PLAGE" --config .gitleaks.toml --redact \
            --report-format json --report-path "$RUNNER_TEMP/secrets.json" \
            --exit-code 0 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          python3 .github/scripts/rapport-secrets.py \
            --rapport "$RUNNER_TEMP/secrets.json" \
            --journal "$RUNNER_TEMP/gitleaks.log" \
            --commits-attendus "$ATTENDUS"
