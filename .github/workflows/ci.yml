name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Déploiement backend manuel à la demande (sans attendre un push qui
  # touche backend/**). Bouton « Run workflow » → sélectionner la branche
  # main. Le job deploy-fly s'exécute alors même sans changement de code.
  workflow_dispatch:

jobs:
  # ─── Méta-test des audits : vérifie que les garde-fous échouent sur une
  # régression injectée (sinon ils ne protègent rien). Indépendant : crée des
  # fixtures temporaires, assert exit 1 sur chaque audit, puis nettoie. ─────
  audit-regression-test:
    name: Audits détectent les régressions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (audit_api_returns.cjs requiert @babel/parser)
        working-directory: frontend
        run: npm ci

      - name: Injecter une régression backend (route sans docstring) → échec attendu
        working-directory: backend
        run: |
          cat > tests/fixtures_audit_regression.py <<'PYEOF'
          from fastapi import APIRouter
          router = APIRouter()


          @router.get("/regression/probe")
          async def regression_probe():
              return {"ok": True}
          PYEOF
          set +e
          python scripts/audit_docstrings.py --fail-on-warning tests/fixtures_audit_regression.py > /tmp/audit_out.txt 2>&1
          EXIT_CODE=$?
          set -e
          rm -f tests/fixtures_audit_regression.py
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::error::audit_docstrings.py a PASSÉ alors qu'une route sans docstring était injectée"
            cat /tmp/audit_out.txt
            exit 1
          fi
          echo "✓ audit_docstrings.py échoue sur une route sans docstring (exit $EXIT_CODE)"

      - name: Injecter une régression frontend (endpoint fantôme) → échec attendu
        working-directory: frontend
        run: |
          cat > src/services/fixtureRegression.js <<'JSEOF'
          import { api } from './api';

          export const regressionProbe = {
            /** @returns {Promise<object>} Appel vers un endpoint inexistant. */
            fetchMissing: () => api.get('/totally/missing-endpoint'),
          };
          JSEOF
          set +e
          node scripts/audit_api_returns.cjs --fail-on-warning > /tmp/audit_fe_out.txt 2>&1
          EXIT_CODE=$?
          set -e
          rm -f src/services/fixtureRegression.js
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::error::audit_api_returns.cjs a PASSÉ alors qu'un endpoint fantôme était injecté"
            cat /tmp/audit_fe_out.txt
            exit 1
          fi
          echo "✓ audit_api_returns.cjs échoue sur un endpoint fantôme (exit $EXIT_CODE)"

      - name: Injecter une régression syntaxe Python (py_compile) → échec attendu
        working-directory: backend
        run: |
          cat > tests/fixtures_pycompile_regression.py <<'PYEOF'
          from fastapi import APIRouter
          router = APIRouter()


          @router.get("/break")
          async def broken(  # parenthèse jamais fermée — SyntaxError
          PYEOF
          set +e
          python -m py_compile tests/fixtures_pycompile_regression.py > /tmp/pyc_out.txt 2>&1
          EXIT_CODE=$?
          set -e
          rm -f tests/fixtures_pycompile_regression.py
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::error::py_compile a PASSÉ alors qu'un fichier syntaxiquement invalide était injecté"
            cat /tmp/pyc_out.txt
            exit 1
          fi
          echo "✓ py_compile échoue sur une syntaxe invalide (exit $EXIT_CODE)"

      - name: Injecter une régression pyflakes (nom non défini) → échec attendu
        working-directory: backend
        run: |
          pip install --quiet pyflakes
          cat > kojo_routers_break.py <<'PYEOF'
          from fastapi import APIRouter
          router = APIRouter()


          @router.get("/break")
          async def broken():
              return undefined_variable_xyz
          PYEOF
          UNDEFINED=$(python -m pyflakes kojo_routers_break.py | grep "undefined name" || true)
          rm -f kojo_routers_break.py
          if [ -z "$UNDEFINED" ]; then
            echo "::error::pyflakes a PASSÉ alors qu'un nom non défini était injecté"
            exit 1
          fi
          echo "✓ pyflakes échoue sur un nom non défini"

      - name: Vérifier le passage sans régression (baseline)
        working-directory: backend
        run: |
          python scripts/audit_docstrings.py --fail-on-warning
          python -m py_compile server.py tests/*.py
          cd ../frontend
          node scripts/audit_api_returns.cjs --fail-on-warning
          echo "✓ Baseline : audits, py_compile et pyflakes passent sans régression injectée"

  # ─── Backend : tests Python (FakeDB + vrai MongoDB) ──────────────────────
  backend-tests:
    name: Backend tests (Python + MongoDB)
    runs-on: ubuntu-latest

    # Vrai MongoDB : la suite s'exécute contre une vraie instance (mode
    # TEST_MONGO_URL), ce qui couvre l'atomicité, les indexes et les
    # opérateurs réels que la FakeDB locale ne reproduit pas.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Syntax check (py_compile)
        working-directory: backend
        run: python -m py_compile server.py tests/*.py

      - name: Static check — no undefined names (pyflakes)
        working-directory: backend
        run: |
          pip install --quiet pyflakes
          UNDEFINED=$(python -m pyflakes kojo_*.py server.py | grep "undefined name" || true)
          if [ -n "$UNDEFINED" ]; then
            echo "$UNDEFINED"
            echo "::error::Noms non définis détectés (imports manquants lors du découpage)"
            exit 1
          fi
          echo "✓ Aucun nom non défini dans les modules kojo_*"

      - name: Docstrings des endpoints (audit_docstrings.py, strict)
        working-directory: backend
        run: python scripts/audit_docstrings.py --fail-on-warning

      - name: Run tests against real MongoDB
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-kojo-32-chars-minimum
          EMAIL_OTP_SECRET: ci-otp-secret-kojo-32-chars-minimum
          TEST_MONGO_URL: mongodb://localhost:27017
          DB_NAME: kojo_test
          APP_ENV: test
          REDIS_URL: ""
          DISABLE_TRUSTED_HOST_MIDDLEWARE: "true"
        run: python -m pytest tests/ -q --tb=short

  # ─── Frontend : tests Vitest + build Vite ────────────────────────────────
  frontend-build:
    name: Frontend tests + build (Node/Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Audit des retours des services (audit_api_returns.cjs, strict)
        working-directory: frontend
        run: node scripts/audit_api_returns.cjs --fail-on-warning

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://kojo-backend.fly.dev/api
        run: npm run build

      - name: Check bundle size
        working-directory: frontend
        run: |
          BUILD_SIZE=$(du -sh build/ | cut -f1)
          echo "Bundle size: $BUILD_SIZE"

  # ─── Mobile : Capacitor sync + build Android debug ───────────────────────
  mobile-build:
    name: Mobile build (Capacitor + Android)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web assets (webDir = build)
        working-directory: frontend
        run: npm run build

      # Synchronise le web build + les plugins Capacitor dans android/
      # (valide aussi que la config Capacitor et les versions plugins collent)
      - name: Capacitor sync
        working-directory: frontend
        run: npx cap sync android

      # Capacitor 8 compile en Java 21 (source/target 21) : un JDK 17
      # échoue sur « invalid source release: 21 ». Gradle 8.14 et AGP 8.13
      # supportent Java 21.
      - name: Set up Java 21 (Capacitor 8 / AGP 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 36 (variables.gradle) : accepter les licences SDK une
      # fois pour toutes, puis laisser Gradle/AGP télécharger la plateforme
      # et les build-tools dont il a besoin (échec rapide sinon : licences
      # non acceptées pour platforms;android-36).
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # chmod défensif : le bit exécutable peut être perdu selon l'OS
      # d'origine du commit (ici : Windows). Le fix durable est le mode
      # 100755 sur gradlew dans git.
      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

  # ─── Backend : déploiement Fly.io (verrouillé sur les tests backend) ─────
  # Déployé à chaque push sur main qui touche backend/ — MAIS uniquement si
  # le job backend-tests passe. Un échec frontend/mobile ne bloque PAS le
  # déploiement backend (needs: backend-tests uniquement).
  #
  # Prérequis (une seule fois) :
  #   1. fly tokens create deploy -n "GitHub Actions"
  #   2. Ajouter le token comme secret du dépôt nommé FLY_API_TOKEN
  #      (Settings → Secrets and variables → Actions).
  deploy-fly:
    name: Deploy backend to Fly.io
    runs-on: ubuntu-latest
    needs: backend-tests
    # Jamais depuis un PR ; déploiement sur main (push auto OU dispatch manuel)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    # Pas d'annulation en plein vol : un déploiement est étatique (machines
    # Fly) ; les pushes successifs attendent leur tour.
    concurrency:
      group: deploy-fly
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # Filtre les changements : pas de re-déploiement du backend pour un
      # push qui ne touche que le frontend/docs.
      - name: Detect backend changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

      # Déploiement forcé : un dispatch manuel déploie même sans changement
      # backend (l'utilisateur a explicitement demandé le run).
      - name: Setup flyctl
        if: steps.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        uses: superfly/flyctl-actions/setup-flyctl@master

      # --remote-only : le build se fait sur les builders distants de Fly
      # (Depot), pas de Docker nécessaire sur le runner. fly.toml et
      # Dockerfile sont lus depuis backend/ (working-directory).
      - name: Deploy to Fly.io
        if: steps.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: backend
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
