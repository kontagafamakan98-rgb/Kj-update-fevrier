name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Déploiement backend manuel à la demande (sans attendre un push qui
  # touche backend/**). Bouton « Run workflow » → sélectionner la branche
  # main. Le job deploy-fly s'exécute alors même sans changement de code.
  workflow_dispatch:

jobs:
  # ─── Méta-test des audits : vérifie que les garde-fous échouent sur une
  # régression injectée (sinon ils ne protègent rien). Indépendant : crée des
  # fixtures temporaires, assert exit 1 sur chaque audit, puis nettoie. ─────
  audit-regression-test:
    name: Audits détectent les régressions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (audit_api_returns.cjs requiert @babel/parser)
        working-directory: frontend
        run: npm ci

      - name: Injecter une régression backend (route sans docstring) → échec attendu
        working-directory: backend
        run: |
          cat > tests/fixtures_audit_regression.py <<'PYEOF'
          from fastapi import APIRouter
          router = APIRouter()


          @router.get("/regression/probe")
          async def regression_probe():
              return {"ok": True}
          PYEOF
          set +e
          python scripts/audit_docstrings.py --fail-on-warning tests/fixtures_audit_regression.py > /tmp/audit_out.txt 2>&1
          EXIT_CODE=$?
          set -e
          rm -f tests/fixtures_audit_regression.py
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::error::audit_docstrings.py a PASSÉ alors qu'une route sans docstring était injectée"
            cat /tmp/audit_out.txt
            exit 1
          fi
          echo "✓ audit_docstrings.py échoue sur une route sans docstring (exit $EXIT_CODE)"

      - name: Injecter une régression frontend (endpoint fantôme) → échec attendu
        working-directory: frontend
        run: |
          cat > src/services/fixtureRegression.js <<'JSEOF'
          import { api } from './api';

          export const regressionProbe = {
            /** @returns {Promise<object>} Appel vers un endpoint inexistant. */
            fetchMissing: () => api.get('/totally/missing-endpoint'),
          };
          JSEOF
          set +e
          node scripts/audit_api_returns.cjs --fail-on-warning > /tmp/audit_fe_out.txt 2>&1
          EXIT_CODE=$?
          set -e
          rm -f src/services/fixtureRegression.js
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::error::audit_api_returns.cjs a PASSÉ alors qu'un endpoint fantôme était injecté"
            cat /tmp/audit_fe_out.txt
            exit 1
          fi
          echo "✓ audit_api_returns.cjs échoue sur un endpoint fantôme (exit $EXIT_CODE)"

      - name: Injecter une régression syntaxe Python (py_compile) → échec attendu
        working-directory: backend
        run: |
          cat > tests/fixtures_pycompile_regression.py <<'PYEOF'
          from fastapi import APIRouter
          router = APIRouter()


          @router.get("/break")
          async def broken(  # parenthèse jamais fermée — SyntaxError
          PYEOF
          set +e
          python -m py_compile tests/fixtures_pycompile_regression.py > /tmp/pyc_out.txt 2>&1
          EXIT_CODE=$?
          set -e
          rm -f tests/fixtures_pycompile_regression.py
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::error::py_compile a PASSÉ alors qu'un fichier syntaxiquement invalide était injecté"
            cat /tmp/pyc_out.txt
            exit 1
          fi
          echo "✓ py_compile échoue sur une syntaxe invalide (exit $EXIT_CODE)"

      - name: Injecter une régression pyflakes (nom non défini) → échec attendu
        working-directory: backend
        run: |
          pip install --quiet pyflakes
          cat > kojo_routers_break.py <<'PYEOF'
          from fastapi import APIRouter
          router = APIRouter()


          @router.get("/break")
          async def broken():
              return undefined_variable_xyz
          PYEOF
          UNDEFINED=$(python -m pyflakes kojo_routers_break.py | grep "undefined name" || true)
          rm -f kojo_routers_break.py
          if [ -z "$UNDEFINED" ]; then
            echo "::error::pyflakes a PASSÉ alors qu'un nom non défini était injecté"
            exit 1
          fi
          echo "✓ pyflakes échoue sur un nom non défini"

      - name: Vérifier le passage sans régression (baseline)
        working-directory: backend
        run: |
          python scripts/audit_docstrings.py --fail-on-warning
          python -m py_compile server.py tests/*.py
          cd ../frontend
          node scripts/audit_api_returns.cjs --fail-on-warning
          echo "✓ Baseline : audits, py_compile et pyflakes passent sans régression injectée"

  # ─── Garde-fou permanent des workflows : actionlint + shellcheck ─────────
  # S'exécute à CHAQUE push/PR (comme le reste du workflow) : un changement de
  # workflow invalide (syntaxe YAML cassée, expression ${{ }} erronée, chemin
  # de step/needs inconnu, script shell buggé) fait échouer le run AVANT toute
  # conséquence. Actionlint embarque les problem matchers (annotations inline
  # sur les fichiers concernés).
  workflow-lint:
    name: Workflow lint (actionlint + shellcheck)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # actionlint : validité syntaxe ET sémantique de ci.yml (expressions
      # ${{ }}, if:, needs, uses, concurrency...). L'action officielle scane
      # .github/workflows/*.yml — si CI lui-même est invalide à un commit, ce
      # job échoue (le garde-fou se teste lui-même). Tag ÉPINGLÉ (v1.7.12) :
      # le dépôt rhysd/actionlint ne publie pas de tag flottant « v1 ».
      - name: Lint workflows (actionlint)
        uses: rhysd/actionlint@v1.7.12

      # Épinglage des `uses:` : chaque référence d'action doit viser un tag de
      # VERSION ou un SHA, jamais une branche. Une référence non résoluble fait
      # échouer le job AVANT ses étapes — c'est arrivé le 2026-08-27 avec
      # `rhysd/actionlint@v1` (« Unable to resolve action »), un rouge
      # d'infrastructure sans rapport avec le code. Voir
      # .github/scripts/check-workflow-pins.py.
      #
      # Le garde prend UN chemin : il est donc appelé sur TOUS les fichiers de
      # .github/workflows/. Tant qu'il ne voyait que ci.yml, ajouter un second
      # workflow ouvrait un trou invisible — précisément le défaut qu'il existe
      # pour empêcher (le 18/09/2026, seo-vercel-env.yml est né sans garde).
      #
      # `python3` (et non `python`) : ce job n'installe pas Python via
      # setup-python, seule la commande `python3` de l'image du runner est
      # garantie — le script est en stdlib pure, aucun paquet à installer.
      - name: Check action pins (no branch refs)
        run: |
          for workflow in .github/workflows/*.yml; do
            python3 .github/scripts/check-workflow-pins.py "$workflow"
          done

      # Assertions d'existence sur un export (`callable(...)`, `is not None`
      # comme condition entière, `.toBeDefined()`) : elles restent vertes même
      # quand l'export ne fait plus rien, et elles reviennent au prochain ajout
      # de test. Ce garde empêche le nettoyage du 18/09/2026 de se reperdre —
      # voir .github/scripts/check-test-existence-assertions.py, dont les cas
      # acceptés/refusés sont verrouillés par
      # backend/tests/test_existence_assertion_guard.py.
      - name: Check test assertions describe behaviour (no export existence)
        run: python3 .github/scripts/check-test-existence-assertions.py

      # shellcheck (pré-installé sur ubuntu-latest) : analyse statique des
      # scripts shell du dépôt. Échoue sur les erreurs (les warnings restent
      # informatifs — comportement par défaut de shellcheck).
      - name: Lint shell scripts (shellcheck)
        run: |
          shellcheck .github/scripts/*.sh
          shellcheck backend/scripts/*.sh


  # ─── Fly : comparaison doc↔prod des variables d'environnement ───────────
  # Vérifie que fly.toml [env] (référence commitée) reste synchronisé avec
  # l'environnement réellement servi par la machine Fly, et que chaque
  # secret OBLIGATOIRE (documenté dans DEPLOY_FLYIO.md) a bien un digest
  # déployé. Échoue en cas de DRIFT (fly.toml commité mais jamais
  # redéployé) ou de secret manquant (config incomplète avant boot). Les
  # valeurs des secrets restent illisibles (digests opaques) ; seul leur
  # digest de présence/stabilité est vérifié.
  fly-env-drift:
    name: Fly env doc-prod (drift + secrets)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # FORMAT des variables critiques dans les RÉFÉRENCES du dépôt
      # (fly.toml, .env.example, DEPLOY_FLYIO.md) : CORS_ORIGINS,
      # VAPID_CLAIMS_EMAIL, BACKEND_PUBLIC_URL, FRONTEND_APP_URL,
      # TRUSTED_HOSTS, REDIS_URL, MONGO_URL. Déterministe — SANS token ni
      # réseau (audit local rejouable), lancé à chaque push.
      - name: Audit formats des références (refs-only)
        run: python .github/scripts/check-fly-env-drift.py --refs-only

      # flyctl est requis par le check (flyctl secrets list). Référence ÉPINGLÉE
      # sur un SHA (= tag v1, runtime node24) : elle valait @master, une branche
      # qui suit le travail amont sans revue et peut disparaître (cf. le rouge
      # `actionlint@v1` du 2026-08-27 : un `uses:` non résoluble fait échouer le
      # job avant ses étapes). L'action installe `flyctl` en version latest par
      # défaut, donc épingler l'ACTION ne fige pas la CLI.
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Check fly.toml env vs runtime + secret presence
        run: python .github/scripts/check-fly-env-drift.py
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # ── Sonde email RÉELLE : SPF / DKIM / DMARC lus sur un message reçu ────
      # Le domaine est authentifié (SPF, deux CNAME DKIM chez Brevo, DMARC) et
      # Brevo répond `dkimError: false` — rien de tout cela ne dit qu'un email
      # LIVRÉ passe les trois. La sonde envoie un OTP via l'API de production
      # vers un alias Gmail dédié puis lit l'`Authentication-Results` que Gmail
      # pose à la RÉCEPTION, seul endroit où les verdicts existent : une boîte
      # jetable ne les enregistre pas, et les recalculer sur la copie reçue est
      # impossible (le récepteur réécrit le corps, le `bh` signé ne correspond
      # plus). Échec bruyant si un verdict n'est pas `pass`.
      #
      # main uniquement : un run de PR enverrait un vrai email de production et
      # lirait la boîte de test pour rien. Sans les secrets, la sonde publie une
      # `::notice` et s'arrête en 0 — elle dit qu'elle n'a PAS vérifié au lieu
      # de sortir verte.
      - name: Sonde email authentifié (SPF/DKIM/DMARC lus dans Gmail, main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python .github/scripts/check-email-auth.py
        env:
          KOJO_PROBE_IMAP_USER: ${{ secrets.KOJO_PROBE_IMAP_USER }}
          KOJO_PROBE_IMAP_PASSWORD: ${{ secrets.KOJO_PROBE_IMAP_PASSWORD }}
          # Alignement SPF exigé ? La sonde publie TOUJOURS la phrase
          # d'alignement (enveloppe SPF et `d=` comparés au domaine du From) ;
          # passer cette variable de dépôt à 1 fait ÉCHOUER le job si DMARC ne
          # repose que sur DKIM. À poser quand le sous-domaine brandé de Brevo
          # est en place : le gain est alors verrouillé sans toucher au code.
          #   gh variable set KOJO_REQUIRE_SPF_ALIGNMENT --body 1
          KOJO_REQUIRE_SPF_ALIGNMENT: ${{ vars.KOJO_REQUIRE_SPF_ALIGNMENT }}

  # ─── Backend : tests Python (FakeDB + vrai MongoDB) ──────────────────────
  backend-tests:
    name: Backend tests (Python + MongoDB)
    runs-on: ubuntu-latest

    # Vrai MongoDB : la suite s'exécute contre une vraie instance (mode
    # TEST_MONGO_URL), ce qui couvre l'atomicité, les indexes et les
    # opérateurs réels que la FakeDB locale ne reproduit pas.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Syntax check (py_compile)
        working-directory: backend
        run: python -m py_compile server.py tests/*.py

      - name: Static check — no undefined names (pyflakes)
        working-directory: backend
        run: |
          pip install --quiet pyflakes
          UNDEFINED=$(python -m pyflakes kojo_*.py server.py | grep "undefined name" || true)
          if [ -n "$UNDEFINED" ]; then
            echo "$UNDEFINED"
            echo "::error::Noms non définis détectés (imports manquants lors du découpage)"
            exit 1
          fi
          echo "✓ Aucun nom non défini dans les modules kojo_*"

      - name: Docstrings des endpoints (audit_docstrings.py, strict)
        working-directory: backend
        run: python scripts/audit_docstrings.py --fail-on-warning

      # ── Santé d'import : le VERDICT est publié en annotation de PR ──────────
      # Un fichier présent peut porter un `NameError` que personne ne voit (le
      # 2026-08-27, il a atteint la production alors que toutes les assertions
      # d'existence étaient vertes). Le verdict — périmètre, modules importés, ce
      # qui n'est PAS couvert, et un `::error` par module cassé — est produit par
      # backend/tests/test_import_health.py, comme la sonde SEO publie les siens.
      #
      # Ce fichier tourne aussi dans la suite complète, mais pytest CAPTURE le
      # `print` des tests : ses annotations n'y seraient lues par personne, ni en
      # vert ni en rouge. `--capture=tee-sys` recopie la sortie capturée dans le
      # journal du job, que GitHub transforme en annotations. Deux secondes, et
      # sans MongoDB (importer n'est pas se connecter).
      - name: Santé d'import — verdict publié en annotation
        working-directory: backend
        run: python -m pytest tests/test_import_health.py -q --tb=short --capture=tee-sys

      - name: Run tests against real MongoDB
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-kojo-32-chars-minimum
          EMAIL_OTP_SECRET: ci-otp-secret-kojo-32-chars-minimum
          TEST_MONGO_URL: mongodb://localhost:27017
          DB_NAME: kojo_test
          APP_ENV: test
          REDIS_URL: ""
          DISABLE_TRUSTED_HOST_MIDDLEWARE: "true"
        run: python -m pytest tests/ -q --tb=short

      # Les refus du générateur de cartes OG (frontend/scripts/gen-og-images.py)
      # sont ce qui empêche une carte d'annoncer autre chose que sa page, et
      # backend/tests/test_gen_og_images.py les verrouille. Mais un test qu'on n'a
      # jamais vu échouer ne prouve rien : cette preuve avait été faite à la main
      # (mutations du générateur, restaurées à l'empreinte SHA-1), donc hors du
      # dépôt, et rien ne pouvait la rejouer.
      #
      # Ce garde la rejoue — sur des COPIES temporaires, le dépôt n'est jamais
      # modifié. Il n'a pas de table à tenir : il LIT les refus dans l'arbre du
      # générateur (chaque `raise SystemExit` que porte un `if`), neutralise un
      # refus à la fois (`if <condition>:` devient `if False:`, à la position exacte
      # de la condition) et exige que la suite échoue. Et un rouge quelconque ne
      # suffit pas : il mesure l'appartenance et exige que chaque refus ait un test
      # À LUI, qui rougit sous lui et sous aucun autre — sinon une casse collatérale
      # ferait croire à un refus verrouillé.
      #
      # Quatre choses échouent donc ici : un refus ajouté au générateur que personne
      # n'exerce (il est muté sans qu'on ait à le déclarer), un `raise` sorti du
      # corps de son `if` (la dérivation ne saurait plus quand il tombe), un refus
      # que seul un test partagé fait rougir, et une suite déjà rouge sur les copies
      # intactes — l'état de référence, sans lequel aucun rouge ne serait concluant.
      # Voir .github/scripts/check-og-test-mutations.py, prouvé par
      # backend/tests/test_og_mutation_guard.py.
      #
      # Dans CE job (et pas workflow-lint) : le fichier de test importe le
      # générateur réel, donc Pillow, installé ici par requirements.txt.
      #
      # Cette étape est le SEUL endroit qui rejoue les mutations (3,0 à 5,0 s mesurés
      # sur le runner selon le run) : le test du garde prouve qu'il sait refuser —
      # un refus que personne n'exerce, un test partagé entre deux refus, un `raise`
      # sans `if`, une condition écrite ailleurs — sans jamais lancer pytest : les
      # décisions s'éprouvent sur des verdicts écrits d'avance, et de cette étape la
      # suite ne vérifie que le CÂBLAGE (une occurrence, dans ce job, qui installe ses
      # dépendances). La même preuve n'est donc payée qu'une fois par push.
      - name: Check OG refusals are locked by their tests (mutation replay)
        run: python .github/scripts/check-og-test-mutations.py

  # ─── Frontend : tests Vitest + build Vite ────────────────────────────────
  frontend-build:
    name: Frontend tests + build (Node/Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Audit des retours des services (audit_api_returns.cjs, strict)
        working-directory: frontend
        run: node scripts/audit_api_returns.cjs --fail-on-warning

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.kojoforafrica.cc.cd/api
        run: npm run build

      # Vérifie le PRÉ-RENDU par route dans les artefacts de build : jobs.html
      # et login.html doivent contenir leur shell statique (h1/formulaire →
      # LCP avant React) + og:image dédié, et index.html doit garder #root
      # VIDE. Échoue le job en cas de régression silencieuse (plugin de
      # pré-rendu désactivé, shell perdu, contenu ajouté à l'index).
      - name: Check prerender shells (jobs/login html)
        working-directory: frontend
        run: node scripts/check-prerender-shells.js

      # Les DEUX canaux qui publient les métadonnées d'une page — la coquille
      # pré-rendue (build) et les pages au runtime — doivent annoncer le même
      # titre, la même description et la même carte, lus dans les tables uniques
      # src/config/page-meta.js et og-cards.js. Avant ce garde, chacun les
      # déclarait de son côté (ex. /login) : changer un texte ou une image d'un
      # seul côté ne cassait rien, et /register n'annonçait aucun texte au
      # runtime (l'onglet gardait le titre de la page précédente).
      - name: Check page meta agrees (runtime pages ↔ prerendered shells)
        working-directory: frontend
        run: node scripts/check-page-meta.js

      # Une fiche mission (/jobs/:id) n'a pas de coquille pré-rendue à comparer :
      # son HTML est produit par le backend À LA REQUÊTE. Son contrat app ↔
      # pré-rendu n'était donc vérifié qu'en HTTP, contre un serveur debout et
      # une mission réellement créée en base — jamais sur une PR dont le
      # pré-déploiement est protégé, et jamais contre ce que l'APPLICATION
      # annonce. Ce garde exécute les deux implémentations sur une mission de
      # référence : le pré-rendu en important backend/kojo_job_og.py (module sans
      # dépendance, donc importable avec le python3 du runner), l'application en
      # appelant src/utils/jobSeo.js. Il échoue si un titre, une description ou
      # une carte ne dit plus la même chose des deux côtés.
      - name: Check job OG contract (app ↔ prerender, offline)
        working-directory: frontend
        run: node scripts/check-job-og-contract.js

      # Régression « chunk partagé pack2PageI18n » : le découpage par scope
      # (un dictionnaire par page lazy) ne doit pas réapparaître comme chunk
      # commun portant ≥ 3 dictionnaires (l'ancien monolithe ~60 kB chargé
      # par toutes les pages secondaires). Échoue le job si une fusion de
      # dictionnaires est détectée dans les chunks buildés.
      - name: Check pack2PageI18n chunk splitting (build)
        working-directory: frontend
        run: node scripts/check-pack2-chunks.js

      # Hygiène des dictionnaires pack2PageI18n : une clé qu'aucune page
      # consommatrice n'appelle (pageT statique/dynamique ou clé d'erreur
      # littérale) et un override wo/bm/mos identique à fr (déjà hérité via
      # withBase) sont du poids mort dans le chunk lazy de la page. Ces deux
      # dérives avaient été corrigées à la main dans le scope register ; ce
      # check permanent remplace l'audit manuel (audit-all-scopes.tmp.cjs) que
      # personne ne lançait. Il échoue le job si l'une réapparaît.
      - name: Check pack2PageI18n i18n hygiene (unused keys + redundant overrides)
        working-directory: frontend
        run: node scripts/check-pack2-i18n-hygiene.js

      # Garde-fou du découpage services/api vs services/apiEndpoints : les
      # groupes d'endpoints LAZY (jobsAPI, usersAPI, paymentAPI…) doivent
      # rester confinés dans apiEndpoints — importés uniquement par les pages
      # lazy. Échoue le job si un fichier ré-importe un groupe lazy depuis
      # services/api (niveau source), si un marqueur URL lazy réapparaît dans
      # le chunk d'entrée index-*.js (niveau bundle), ou si un marqueur core
      # (auth/me, login…) disparaît du shell.
      - name: Check services/api split (lazy groups out of entry chunk)
        working-directory: frontend
        run: node scripts/check-api-split.js

      # Garde-fou du lot Open Graph : le pré-rendu par route référence des
      # cartes versionnées dans public/ (og-jobs, og-login, variantes carrées,
      # favicon sombre) que scripts/gen-og-images.py régénère. Le check lit le
      # manifeste DANS ce générateur (dimensions + pages) et échoue si un
      # second générateur apparaît, si un PNG est manquant/invalide, s'il ne
      # respecte pas ses dimensions ou si un og-*.png orphelin subsiste.
      - name: Check Open Graph assets (generator + PNG dimensions)
        working-directory: frontend
        run: node scripts/check-og-assets.js

      # Garde-fou de la famille « icônes » : les icônes PWA et le favicon clair,
      # produits par public/icons/generate_icons.py. Ce générateur est en stdlib
      # pure (ni police, ni Pillow), donc son résultat est comparable sur ce
      # runner — encore faut-il comparer la bonne chose : la zlib variant d'une
      # installation à l'autre, les OCTETS d'un PNG regénéré diffèrent de ceux
      # committés alors que les PIXELS sont identiques (mesuré : 101 592 contre
      # 101 049). Le check compare donc les empreintes de PIXELS du manifeste,
      # REJOUE le générateur en dossier temporaire, et échoue aussi sur un
      # favicon.ico invalide (celui qui était committé faisait 100 octets de
      # zéros, alors qu'index.html le référence comme favicon principal), sur une
      # copie qui diverge, sur un actif sans générateur modifié et sur une icône
      # qui n'est déclarée par personne.
      - name: Check generated icons family (pixels + manifest)
        working-directory: frontend
        run: node scripts/check-generated-icons.js

      # Garde-fou du manifeste PWA : il déclarait « any maskable » sur ses deux
      # icônes alors qu'AUCUNE ne tenait dans la zone de sécurité (contenu à un
      # rayon de 0,495 pour une limite de 0,400) et que le fichier « -maskable »
      # invoqué était un duplicata au pixel près de l'icône normale. Le check
      # croise manifest.json avec l'inventaire de la famille (existence,
      # dimensions, type, purpose) et exige qu'un « maskable » soit PROUVÉ par
      # la mesure, dans les deux sens : aucune fausse revendication, et aucune
      # variante fabriquée pour le masque qui ne serait jamais servie.
      - name: Check PWA manifest (declared icons + maskable safe zone)
        working-directory: frontend
        run: node scripts/check-pwa-manifest.js

      # Garde-fou du ROUTAGE complet : le rewrite « /jobs/(.*) » → backend
      # (route OG déclarée côté backend), le proxy /api, sitemap/robots, CHAQUE
      # route de production de src/App.js (deux formes : /route et /route/),
      # l'absence de catch-all (une URL inconnue doit répondre 404, pas 200),
      # et les règles exactes rendues inatteignables par un motif placé avant
      # (le bug réel : /jobs/ après /jobs/(.*) → 404 JSON en production).
      # Ce garde couvre la CONFIGURATION qui achemine la requête ; le cycle
      # complet, lui, tourne désormais sur chaque PR contre la pile locale du
      # job lighthouse-ci (check-og-job-200.js) et en processus via
      # backend/tests/test_job_og_cycle.py.
      - name: Check SPA routing (vercel.json rewrites, routes App.js, URL inconnue → 404)
        working-directory: frontend
        run: node scripts/check-spa-routes.js

      # Garde-fou du shell statique de l'ACCUEIL : sans lui, le HTML servi à
      # « / » ne contient que `<div id="root"></div>` — un crawler sans
      # JavaScript y voit 19 mots, aucun h1, aucun lien interne, aucun lien de
      # contact (mesuré par un audit SEO externe le 16/09/2026). Le shell
      # reproduit Home.js avec les textes de src/i18n/fr.json ; ce check exige
      # un h1 unique, un title ≤ 60, une description ≤ 160, ≥ 300 mots, des
      # liens internes et tel:/mailto:, le N.A.P. identique à
      # src/config/contact.json, le LocalBusiness, et que chaque classe
      # Tailwind du shell existe bien dans le CSS du build (vite.config.js
      # n'est PAS scanné par Tailwind : une classe inventée ne serait jamais
      # stylée).
      - name: Check home page static shell (h1, contenu, liens, N.A.P., SEO local)
        working-directory: frontend
        run: node scripts/check-home-shell.js

      # Budgets RÉELS (JS initial, plus gros chunk, build total) : l'ancienne
      # version se contentait d'afficher `du -sh build/` et ne pouvait donc
      # jamais échouer — un bundle doublé passait en vert. Les seuils sont
      # documentés dans scripts/check-bundle-size.js (mesure du 16/09/2026 :
      # 98,5 Ko gzip de JS initial, chunk vendor-sentry 156,4 Ko, build 2,81 Mo)
      # et le check est couvert par scripts/__tests__/check-bundle-size.test.js.
      - name: Check bundle size
        working-directory: frontend
        run: node scripts/check-bundle-size.js

  # ─── Frontend : rapport de taille publié en commentaire de PR ────────────
  # `check-bundle-size.js` est un garde BINAIRE (« dans les budgets » ou
  # « dépassé ») : il ne dit pas COMBIEN un changement coûte, et ses seuils
  # (~30-40 % de marge) laissent passer une dérive. Ce job publie les trois
  # mesures réelles avec leur écart :
  #   • vs la dernière mesure de `main` — « l'effet de cette PR par rapport à
  #     la base », la référence étant transportée par le cache Actions ;
  #   • vs la mesure précédente de CETTE PR — relue dans la charge utile du
  #     commentaire précédent, donc « depuis le dernier push ».
  # Si une référence manque, la colonne est omise et la raison est écrite
  # dans le commentaire : un écart calculé contre une référence douteuse
  # serait pire que pas d'écart du tout.
  #
  # Job ADVISORY : il ne fait PAS partie des 8 checks requis de la protection
  # de branche, donc un échec ici ne bloque aucune fusion. Les mesures sont de
  # toute façon écrites dans le résumé du run ($GITHUB_STEP_SUMMARY) : le
  # commentaire n'est qu'un canal plus lisible, pas la seule trace.
  bundle-size-report:
    name: Bundle size report (PR comment)
    runs-on: ubuntu-latest
    needs: frontend-build
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Même commande et même env que frontend-build : les artefacts ne sont
      # pas partagés entre jobs (aucun upload de build/), donc on rebuild —
      # mais avec exactement les mêmes entrées, sinon les tailles mesurées ici
      # et celles du garde ne seraient pas comparables entre elles.
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.kojoforafrica.cc.cd/api
        run: npm run build

      # Référence = dernière mesure de `main`. La clé embarque le SHA (donc
      # n'est jamais réutilisée telle quelle) et `restore-keys` sélectionne la
      # plus récente : sur une PR, GitHub autorise la restauration des caches
      # de la branche de base — c'est exactement « la mesure de main ».
      # Absente au tout premier run : le rapport le dit au lieu d'inventer un
      # écart (« première mesure »).
      - name: Restore size baseline (main)
        uses: actions/cache/restore@v4
        with:
          path: frontend/.bundle-size
          key: bundle-size-baseline-${{ github.sha }}
          restore-keys: |
            bundle-size-baseline-

      # Au premier run de `main`, .bundle-size/baseline.json n'existe pas : le
      # script le détecte (existsSync) et rend un rapport sans écarts.
      - name: Mesurer, comparer et publier (commentaire de PR)
        working-directory: frontend
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/bundle-size-report.js \
            --baseline .bundle-size/baseline.json \
            --out .bundle-size/current.json \
            --markdown .bundle-size/comment.md \
            --summary "$GITHUB_STEP_SUMMARY" \
            --post

      # La mesure du run devient la référence des runs suivants — sur `main`
      # UNIQUEMENT : sauvegarder aussi depuis les PR ferait proliférer des
      # caches par PR et fausserait « la mesure de main ».
      - name: Publish size baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: frontend
        run: cp .bundle-size/current.json .bundle-size/baseline.json

      - name: Save size baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: frontend/.bundle-size
          key: bundle-size-baseline-${{ github.sha }}

  # ─── Performance : budgets Lighthouse CI (10 pages : publiques, protégées) ──
  # Audite le DÉPLOIEMENT VERCEL RÉEL en condition mobile simulée (Slow 4G
  # + CPU 4x) et BLOQUE la PR si un budget est dépassé.
  #
  # URLs auditées (multi-URL, cf. frontend/lighthouserc.cjs, dont les
  # DEPLOYMENT_PATHS sont la LISTE DES PAGES DU PROJET : la table route → carte
  # OG des gardes en DÉRIVE, aucun second exemplaire à tenir à jour) :
  #   • /          — accueil (publique)
  #   • /register, /forgot-password — pages d'authentification PUBLIQUES, dont
  #     le CLS a été corrigé par les PR #19 (wrapper Register en min-h-full) et
  #     #20 (ForgotPasswordSkeleton calibré) : les auditer est ce qui empêche la
  #     correction de régresser sans que personne ne le voie. C'est vrai depuis
  #     le 18/09/2026 seulement : leur budget CLS propre (0,015 pour /register,
  #     scripts/lhci-cls-budgets.cjs) attrape la valeur d'avant #19 (0,0165),
  #     que le plafond global de 0,15 tolérait.
  #   • /login, /how-it-works, /support, /payment — pages pré-rendues qui
  #     n'étaient mesurées nulle part (ajoutées le 18/09/2026) ; /payment est
  #     protégée, les trois autres sont publiques.
  #   • /dashboard, /jobs, /profile — pages PROTÉGÉES, authentifiées via un
  #     token Bearer obtenu en se connectant avec le COMPTE CLIENT DÉDIÉ CI
  #     (secrets LHCI_CI_EMAIL / LHCI_CI_PASSWORD). Ce compte est distinct des
  #     comptes de test e2e partagés (README) : il n'est jamais touché à la
  #     main, donc les pages auditées ont un état déterministe et les budgets
  #     Lighthouse restent stables d'un run à l'autre. Les identifiants ne sont
  #     JAMAIS en clair dans le workflow ni dans le repo.
  #
  # Résolution de l'URL cible SANS VERCEL_TOKEN (seul FLY_API_TOKEN existait
  # dans les secrets, on a depuis ajouté LHCI_TEST_*) :
  #   • pull_request → l'app GitHub « Vercel » poste un commentaire avec
  #     l'URL de preview ; on la lit via l'API GitHub (GITHUB_TOKEN auto).
  #   • main (push) → URL de production kojoforafrica.cc.cd (alias Vercel :
  #     kj-update-fevrier.vercel.app redirige vers ce domaine).
  #   • Sinon → repli sur une pile LOCALE « forme production » : MongoDB +
  #     backend de la PR + serveur local qui rejoue la table de rewrites de
  #     vercel.json devant le build (cf. plus bas).
  #
  # ── Le cycle /jobs/:id s'exécute désormais SUR LES PR ──────────────────────
  # La fiche mission n'existe que par le rewrite `/jobs/(.*)` → backend. Sur une
  # PR, la preview Vercel est protégée : resolve-vercel-url.sh retombait sur un
  # serveur statique nu, qui ne sert pas cette route, et check-og-job-200.js
  # sortait en 0 avec un ::notice — le cycle HTTP (création → fiche OG →
  # suppression → 404 + noindex + sitemap) ne tournait donc JAMAIS sur une PR,
  # et une régression ne se voyait qu'après fusion.
  # Le repli local rejoue maintenant la CONFIGURATION de production (la table
  # de rewrites, lue dans vercel.json) devant le CODE de la PR : le cycle
  # s'exécute en vraies requêtes HTTP, sur une base MongoDB jetable, sans
  # écriture en production et sans aucun secret supplémentaire.
  lighthouse-ci:
    name: Lighthouse performance budgets
    runs-on: ubuntu-latest
    needs: frontend-build

    # MongoDB éphémère du repli local : c'est LUI qui rend le cycle /jobs/:id
    # possible sur une PR (création / suppression / sitemap). Aucun accès à une
    # base distante, donc aucune écriture en production depuis une PR.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Même env que le job frontend-build : l'app appelle le backend prod
      # en cross-origin pendant l'audit (les requêtes vers Fly sont réelles).
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.kojoforafrica.cc.cd/api
        run: npm run build

      # Résout l'URL du déploiement Vercel à auditer : commentaire Vercel
      # de la PR (API GitHub, sans token supplémentaire) ou URL de prod sur
      # main. Sortie KOJO_LHCI_BASE_URL → lighthouserc.cjs l'utilise comme collect.url
      # (repli build local si non résolue). Logique dans
      # .github/scripts/resolve-vercel-url.sh.
      - name: Resolve Vercel deployment URL
        id: vercel-url
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/resolve-vercel-url.sh

      # ── Sonde SEO de la PRODUCTION — main uniquement, INFORMATIVE ──────────
      # Quatre intégrations réclamées par un audit SEO (balise GA4, meta Search
      # Console, `sameAs` des profils sociaux, domaines GA/Plausible dans la CSP)
      # n'existent que si leur variable est définie AU MOMENT DU BUILD. Le build
      # de CI ne les définit jamais — une balise tierce dans l'artefact audité
      # fausserait les scores Lighthouse — donc `seo-extras-injection.test.js`
      # prouve l'INJECTION, jamais la CONFIGURATION : une variable oubliée sur
      # Vercel ne se voyait que par un audit externe (F9 de CI-COVERAGE.md,
      # constaté le 17/09/2026 : les quatre étaient absentes du projet).
      #
      # Cette sonde lit le HTML réellement servi et publie un `::notice` par
      # intégration (présente / absente + la variable à poser). Elle ne fait
      # JAMAIS échouer le job : une configuration incomplète est un fait
      # d'exploitation, pas une régression de code.
      #
      # main uniquement : sur une PR, la base peut être une preview ou la pile
      # locale, et un « absent » n'y dirait rien de la production (le script
      # refuse d'ailleurs de conclure sur une base loopback).
      - name: Sonde SEO de la production (informatif, main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: frontend
        run: node scripts/check-seo-production.js

      # ── Garde CORS de la PRODUCTION — main uniquement, BLOQUANTE ───────────
      # Le 18/09/2026, la bascule du frontend sur `kojoforafrica.cc.cd` a cassé
      # le site SANS une ligne de journal serveur : `allow_origins` était
      # construit sans `FRONTEND_APP_URL`, le motif Vercel (`allow_origin_regex`)
      # couvrait la production tant que le site vivait sous `*.vercel.app`, et
      # après la bascule Starlette refusait le préflight en 400 — AVANT les
      # routes, donc aucune trace applicative. Seules les consoles des visiteurs
      # le disaient.
      #
      # La sonde rejoue la paire que le navigateur exige (origine canonique du
      # site ↔ API inlinée par le build), préflight + GET crédité, et ÉCHOUE si
      # l'origine n'est pas autorisée — un `::notice` serait passé inaperçu,
      # c'est précisément ce qui s'est produit. Elle échoue aussi quand l'API
      # reste injoignable : une vérification qui n'a pas pu s'exécuter doit se
      # voir. Les réessais internes (6 × 15 s) absorbent la fenêtre du
      # déploiement Fly, qui tourne dans ce même run et peut encore servir une
      # instance ancienne — celle qui refuse la nouvelle origine.
      #
      # ⚠️ main uniquement, et c'est structurel : la sonde mesure la paire
      # DÉPLOYÉE. Sur une PR de migration de domaine, la production porte encore
      # l'ancienne configuration — un rouge y serait un faux positif au moment
      # même où il faut fusionner. L'ordre qui évite la panne reste : backend
      # (`FRONTEND_APP_URL` / `CORS_ORIGINS`) d'abord, frontend ensuite.
      - name: Garde CORS de la production (préflight réel, main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: frontend
        run: node scripts/check-cors-preflight.js

      # ── Repli local « forme production » (aucune preview Vercel exploitable) ─
      # Preview PROTÉGÉE par Deployment Protection (détectée par
      # resolve-vercel-url.sh) ou commentaire Vercel absent : on rejoue en local
      # ce que Vercel fait, devant le code de la PR.
      #
      # Les quatre steps suivants ne tournent QUE dans ce cas (`if` sur la
      # variable écrite par le résolveur : un déploiement réel audité sur main
      # n'a pas besoin de tout ça).
      # ⚠️ Le nom de la variable n'est PAS `LHCI_URL` : lhci active yargs
      # `.env('LHCI')`, donc toute variable `LHCI_<x>` devient l'option `--<x>`
      # du CLI. `LHCI_URL` devenait `--url`, une URL UNIQUE qui écrasait le
      # tableau d'URLs de lighthouserc.cjs (constaté : « 1 URL(s) » auditées
      # en CI, les pages protégées jamais mesurées). Le préfixe `KOJO_LHCI_`
      # n'est capturé par aucun motif yargs, et un test l'exige.
      - name: Set up Python 3.11 (repli local)
        if: ${{ !env.KOJO_LHCI_BASE_URL }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Le BACKEND DE LA PR est lancé pour de vrai (uvicorn) : c'est lui qui
      # sert le pré-rendu de la fiche /jobs/:id et les cartes Pillow, donc le
      # code backend de la PR est exercé en HTTP, pas seulement en processus.
      - name: Install backend dependencies (repli local)
        if: ${{ !env.KOJO_LHCI_BASE_URL }}
        working-directory: backend
        run: pip install -r requirements.txt

      # Compte client VÉRIFIÉ dans la base jetable : POST /api/jobs exige
      # user_type=client et DELETE /api/jobs/:id exige d'être la propriétaire.
      # Le mot de passe est généré à chaque run et ne quitte jamais le runner
      # (il ne protège qu'une MongoDB éphémère) : aucune valeur que seul
      # l'utilisateur possède n'est nécessaire pour exercer ce cycle.
      - name: Provision the local CI client account (repli local)
        if: ${{ !env.KOJO_LHCI_BASE_URL }}
        working-directory: backend
        run: |
          set -euo pipefail
          # Le service container MongoDB met quelques secondes à accepter les
          # connexions : sans cette attente, la provision échouerait au hasard
          # du démarrage (serverSelectionTimeoutMS = 10 s du script).
          MONGO_READY=""
          for _ in $(seq 1 30); do
            if python -c "import pymongo; pymongo.MongoClient('mongodb://localhost:27017', serverSelectionTimeoutMS=1000).admin.command('ping')" 2>/dev/null; then
              MONGO_READY=1
              break
            fi
            sleep 1
          done
          if [ -z "$MONGO_READY" ]; then
            echo "::error::MongoDB (service container) injoignable sur localhost:27017"
            exit 1
          fi
          PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"
          # Domaine RÉEL (kojo.sn, comme les fixtures de backend/tests) et non
          # un domaine réservé (`.test`, `.example`…) : /api/auth/login valide
          # l'adresse avec pydantic/email-validator, qui refuse les domaines à
          # usage spécial — mesuré sur le run du 17/09/2026.
          echo "KOJO_LHCI_LOCAL_EMAIL=ci-og-cycle@kojo.sn" >> "$GITHUB_ENV"
          echo "KOJO_LHCI_LOCAL_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          CI_PASSWORD="$PASSWORD" python scripts/provision_ci_test_account.py \
            "mongodb://localhost:27017/kojo_lhci_ci" "ci-og-cycle@kojo.sn"

      # Backend local + serveur de rewrites, puis PREUVE que la pile sert
      # réellement la fiche /jobs/:id (sonde 404 + noindex) : sans ce contrôle,
      # une pile mal démarrée ferait « ignorer » le cycle en vert, c'est-à-dire
      # exactement le trou qu'on ferme.
      #
      # FRONTEND_APP_URL = l'adresse de CE serveur : le pré-rendu backend
      # construit les og:image et le canonical de la fiche à partir d'elle, et
      # check-og-job-200.js compare les deux (KOJO_ORIGIN).
      # KOJO_BACKEND_URL = le backend LOCAL : la création et la suppression de
      # la mission de test ne touchent donc jamais la production.
      #
      # Serveurs en arrière-plan : nohup + log redirigé pour survivre aux steps
      # suivants (les logs sont publiés en artifact en cas d'échec).
      - name: Serve local stack (backend + table de rewrites de vercel.json)
        if: ${{ !env.KOJO_LHCI_BASE_URL }}
        working-directory: backend
        run: |
          set -euo pipefail
          LOCAL_BASE="http://127.0.0.1:4174"
          LOCAL_BACKEND="http://127.0.0.1:8000"

          nohup env \
            MONGO_URL="mongodb://localhost:27017" \
            DB_NAME="kojo_lhci_ci" \
            APP_ENV="test" \
            REDIS_URL="" \
            DISABLE_TRUSTED_HOST_MIDDLEWARE="true" \
            EMAIL_PROVIDER="none" \
            JWT_SECRET="$(openssl rand -hex 32)" \
            EMAIL_OTP_SECRET="$(openssl rand -hex 32)" \
            FRONTEND_APP_URL="$LOCAL_BASE" \
            uvicorn server:app --host 127.0.0.1 --port 8000 \
            > /tmp/kojo-local-backend.log 2>&1 &

          for _ in $(seq 1 45); do
            curl -sf "$LOCAL_BACKEND/health" >/dev/null 2>&1 && break
            sleep 1
          done
          if ! curl -sf "$LOCAL_BACKEND/health" >/dev/null 2>&1; then
            echo "::error::le backend local n'a pas répondu sur $LOCAL_BACKEND/health"
            tail -50 /tmp/kojo-local-backend.log
            exit 1
          fi

          nohup node ../frontend/scripts/vercel-rewrite-server.js \
            --port 4174 --root ../frontend/build \
            --config ../frontend/vercel.json --backend "$LOCAL_BACKEND" \
            > /tmp/kojo-local-rewrites.log 2>&1 &

          for _ in $(seq 1 30); do
            curl -sf "$LOCAL_BASE/" >/dev/null 2>&1 && break
            sleep 1
          done
          if ! curl -sf "$LOCAL_BASE/" >/dev/null 2>&1; then
            echo "::error::le serveur de rewrites n'a pas répondu sur $LOCAL_BASE"
            tail -50 /tmp/kojo-local-rewrites.log
            exit 1
          fi

          # Sonde de capacité : la fiche inconnue doit répondre 404 + noindex.
          # C'est la MÊME observation que celle des scripts (elle décide si le
          # cycle s'exécute) : la vérifier ici nomme la cause au lieu de laisser
          # le cycle s'annoncer « ignoré ».
          PROBE_HEADERS="$(curl -sS -D - -o /dev/null "$LOCAL_BASE/jobs/00000000-0000-4000-8000-000000000000")"
          PROBE_STATUS="$(printf '%s' "$PROBE_HEADERS" | head -1 | awk '{print $2}')"
          if [ "$PROBE_STATUS" != "404" ] || ! printf '%s' "$PROBE_HEADERS" | grep -qi 'noindex'; then
            echo "::error::la pile locale ne sert pas la route /jobs/:id (HTTP $PROBE_STATUS) — le cycle ne pourrait pas s'exécuter"
            printf '%s\n' "$PROBE_HEADERS" | head -20
            exit 1
          fi
          echo "Sonde /jobs/:id : 404 + noindex (pré-rendu backend servi par la pile locale)"

          # Jeton du compte local : le cycle et l'audit des pages protégées
          # utilisent le même en-tête que sur un déploiement réel.
          LOGIN_JSON="$(curl -sS -X POST "$LOCAL_BACKEND/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$KOJO_LHCI_LOCAL_EMAIL\",\"password\":\"$KOJO_LHCI_LOCAL_PASSWORD\"}")"
          TOKEN="$(printf '%s' "$LOGIN_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")"
          if [ -z "$TOKEN" ]; then
            echo "::error::login du compte CI local échoué — réponse: ${LOGIN_JSON:0:200}"
            exit 1
          fi
          AUTH_HEADER="$(python3 -c "import json,sys; print(json.dumps({'Authorization': 'Bearer ' + sys.argv[1]}))" "$TOKEN")"

          {
            echo "KOJO_LHCI_BASE_URL=$LOCAL_BASE"
            echo "KOJO_BACKEND_URL=$LOCAL_BACKEND"
            echo "KOJO_ORIGIN=$LOCAL_BASE"
            echo "KOJO_LHCI_AUTH_HEADER=$AUTH_HEADER"
            echo "KOJO_LHCI_LOCAL_STACK=1"
          } >> "$GITHUB_ENV"
          echo "Pile locale prête : $LOCAL_BASE (build frontend + $LOCAL_BACKEND + table de rewrites)"

      # Authentifie les pages protégées : se connecte au backend prod avec le
      # COMPTE CLIENT DÉDIÉ CI (secrets LHCI_CI_EMAIL/LHCI_CI_PASSWORD) et
      # stocke le token Bearer dans KOJO_LHCI_AUTH_HEADER. Ce compte est isolé des
      # comptes e2e partagés → l'état audité (/dashboard,/jobs,/profile) est
      # déterministe. Pendant la transition, on retombe sur les anciens
      # secrets LHCI_TEST_* s'ils sont encore définis. Les pages reçoivent cet
      # en-tête lors du collect → le shell React les rend authentifiées
      # (sinon /auth/me → 401 et redirection vers /login).
      - name: Authenticate CI test account (fetch Bearer token)
        id: ci-auth
        # Le repli local a déjà posé son propre jeton (compte provisionné dans
        # la base jetable) : les secrets ne servent que sur un déploiement réel.
        if: env.KOJO_LHCI_LOCAL_STACK != '1'
        env:
          LHCI_CI_EMAIL: ${{ secrets.LHCI_CI_EMAIL }}
          LHCI_CI_PASSWORD: ${{ secrets.LHCI_CI_PASSWORD }}
          LHCI_TEST_EMAIL: ${{ secrets.LHCI_TEST_EMAIL }}
          LHCI_TEST_PASSWORD: ${{ secrets.LHCI_TEST_PASSWORD }}
        run: |
          EMAIL="${LHCI_CI_EMAIL:-$LHCI_TEST_EMAIL}"
          PASSWORD="${LHCI_CI_PASSWORD:-$LHCI_TEST_PASSWORD}"
          if [ -z "$EMAIL" ]; then
            echo "::error::Secrets LHCI_CI_EMAIL/LHCI_CI_PASSWORD (ou LHCI_TEST_* en transition) non définis — les pages protégées ne seront pas auditées"
            exit 1
          fi
          LOGIN_JSON=$(curl -sS -X POST "https://api.kojoforafrica.cc.cd/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")
          TOKEN=$(printf '%s' "$LOGIN_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$TOKEN" ]; then
            echo "::error::Login du compte CI dédié échoué (vérifier les secrets) — réponse: ${LOGIN_JSON:0:200}"
            exit 1
          fi
          # JSON sérialisé pour l'env : {\"Authorization\": \"Bearer <token>\"}
          AUTH_HEADER=$(python3 -c "import json,sys; print(json.dumps({'Authorization': 'Bearer ' + sys.argv[1]}))" "$TOKEN")
          echo "KOJO_LHCI_AUTH_HEADER=$AUTH_HEADER" >> "$GITHUB_ENV"
          echo "Token récupéré (${#TOKEN} chars, compte: $EMAIL)"

      # Vérifie que chaque page auditée sert un og:image ABSOLU et spécifique
      # par route — le HTML servi est exactement ce que reçoit un crawler sans
      # JS (le pré-rendu OG). Échoue le job (→ PR bloquée) si un og:image est
      # absent, relatif, ou ne correspond pas à la carte attendue de la route
      # (/, /jobs, /login). KOJO_LHCI_BASE_URL (résolue plus haut : déploiement
      # réel, sinon pile locale) est lue par le script via process.env. Le script
      # OBSERVE si la base auditée sert /jobs/:id (sonde 404 + noindex) : sur la
      # pile locale elle le sert, donc la fiche y est vérifiée aussi.
      - name: Check OG images per route (crawler view)
        working-directory: frontend
        run: node scripts/check-og-images.js

      # Verrouille les DEUX chemins de /jobs/:id. Chemin 200 : crée une mission
      # de test avec le COMPTE CLIENT CI, vérifie la carte OG RÉELLE de cette
      # mission (og:image wide + carrée, og:title présent, PNG 1200x630 /
      # 1200x1200) puis la SUPPRIME — toujours, y compris si la vérification
      # échoue (finally). Sans lui, ce chemin n'était exercé que les jours où
      # une mission existait en base : check-og-images se rabattait alors sur le
      # chemin 404. Toujours AVANT Lighthouse CI, pour que la mission de test
      # ait disparu de la liste quand /jobs est audité (et parce qu'un échec de
      # nettoyage doit bloquer le job, pas passer inaperçu).
      # Chemin 404 (APRÈS le DELETE, donc plus aucun effet de bord en base) : la
      # fiche doit répondre 404 + noindex, sa carte Pillow 404, et le sitemap ne
      # plus la lister — une fiche morte restée en 200 garde sa carte et reste
      # indexable. Contrepartie vérifiée AVANT suppression : la mission doit
      # APPARAÎTRE dans le sitemap, sinon « absente du sitemap » serait vrai à
      # vide. Les sondes post-suppression portent un paramètre de cache-busting
      # car la fiche vivante est servie avec s-maxage=3600 (l'URL nue pourrait
      # renvoyer un 200 sorti du cache CDN).
      # Ce script ne saute QUE si la base auditée ne sert pas la route (sonde de
      # capacité) : un serveur statique nu. La pile locale du repli REJOUE la
      # table de rewrites devant le backend de la PR, donc le cycle s'y exécute
      # — c'est ce qui ferme le seul trou de couverture des PR. La mission de
      # test est créée et supprimée dans la MongoDB JETABLE du job
      # (KOJO_BACKEND_URL = backend local) : aucune écriture en production.
      # KOJO_LHCI_BASE_URL, KOJO_BACKEND_URL, KOJO_ORIGIN et
      # KOJO_LHCI_AUTH_HEADER sont déjà dans l'environnement (steps précédents,
      # via $GITHUB_ENV) ; les secrets servent de repli si le jeton n'a pas été
      # résolu par le login du déploiement réel.
      - name: Check /jobs/:id OG path (create → 200 → delete → 404 + noindex + sitemap)
        working-directory: frontend
        env:
          LHCI_CI_EMAIL: ${{ secrets.LHCI_CI_EMAIL }}
          LHCI_CI_PASSWORD: ${{ secrets.LHCI_CI_PASSWORD }}
          LHCI_TEST_EMAIL: ${{ secrets.LHCI_TEST_EMAIL }}
          LHCI_TEST_PASSWORD: ${{ secrets.LHCI_TEST_PASSWORD }}
        run: node scripts/check-og-job-200.js

      # ubuntu-latest embarque Google Chrome : chrome-launcher le détecte
      # automatiquement (pas d'action d'installation nécessaire). KOJO_LHCI_BASE_URL
      # (si définie) fait auditer l'URL Vercel réelle, sinon la pile locale —
      # adresse LOOPBACK, que lighthouserc.cjs traite comme le repli local (audit
      # de l'accueil seul, plafond TBT élargi) : les pages protégées n'ont pas
      # de données réelles derrière un serveur local.
      # KOJO_LHCI_AUTH_HEADER authentifie les pages /dashboard,/jobs,/profile.
      - name: Run Lighthouse CI (collect + assert, budgets bloquants)
        working-directory: frontend
        # KOJO_LHCI_BASE_URL et KOJO_LHCI_AUTH_HEADER sont dans l'env via $GITHUB_ENV (steps
        # précédents) — lhci autorun lit process.env.KOJO_LHCI_AUTH_HEADER.
        run: npx lhci autorun --config=lighthouserc.cjs

      # Rapports consultables dans les artifacts du run (utile pour
      # diagnostiquer un échec de budget). Toujours uploadés, même si le
      # job échoue (if: always()).
      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: frontend/lhci-reports

      # Journaux de la pile locale (démarrage uvicorn, requêtes de rewrites) :
      # sans eux, un rouge sur le repli ne dit pas si c'est le backend, le
      # serveur de rewrites ou le cycle qui a échoué.
      - name: Upload local stack logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-stack-logs
          if-no-files-found: ignore
          path: |
            /tmp/kojo-local-backend.log
            /tmp/kojo-local-rewrites.log

  # ─── Mobile : Capacitor sync + build Android debug ───────────────────────
  mobile-build:
    name: Mobile build (Capacitor + Android)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # EN PREMIER, avant Node/Java/SDK : ce contrôle répond en 0,17 s (mesuré)
      # là où le step APK ne démarre qu'à +39 s du job (mesuré sur le run
      # 35137466972, setup Node/Java/SDK inclus) et où le build Gradle dure
      # ensuite ~95 s. Un bit exécutable perdu n'échouait donc que là, tard, sous
      # la forme d'un « Permission denied » qui ne désignait pas la cause (le
      # mode git du fichier). Le script distingue le mode perdu DANS GIT du bit
      # non matérialisé PAR LE CHECKOUT, et vérifie aussi le shebang (un CRLF le
      # casserait même avec le bit présent).
      - name: Check executable bits (gradlew) before the Android setup
        run: python3 .github/scripts/check-exec-bits.py

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web assets (webDir = build)
        working-directory: frontend
        run: npm run build

      # Synchronise le web build + les plugins Capacitor dans android/
      # (valide aussi que la config Capacitor et les versions plugins collent)
      - name: Capacitor sync
        working-directory: frontend
        run: npx cap sync android

      # Capacitor 8 compile en Java 21 (source/target 21) : un JDK 17
      # échoue sur « invalid source release: 21 ». Gradle 8.14 et AGP 8.13
      # supportent Java 21.
      - name: Set up Java 21 (Capacitor 8 / AGP 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # android-actions/setup-android installe par défaut `tools platform-tools`
      # (`packages`) ; or le paquet « tools » a été RETIRÉ du dépôt Android SDK :
      # l'action échouait sur « Warning: Failed to find package 'tools' »
      # (sdkmanager exit 1) avant même la compilation. On ne demande donc que
      # les paquets qui existent encore ; AGP télécharge la plateforme 36
      # (compileSdk, variables.gradle) au premier build, les licences étant
      # acceptées juste en dessous.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # compileSdk 36 (variables.gradle) : accepter les licences SDK une
      # fois pour toutes, puis laisser Gradle/AGP télécharger la plateforme
      # et les build-tools dont il a besoin (échec rapide sinon : licences
      # non acceptées pour platforms;android-36).
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # Pas de `chmod +x gradlew` ici : le bit exécutable est porté par git
      # (mode 100755 sur frontend/android/gradlew, commit dcb4e43) et le
      # checkout des runners Linux le restitue — le mode du blob est 0755, donc
      # ./gradlew s'exécute directement. Un chmod défensif faisait plus de mal
      # que de bien : il rendait VERT un job dont le bit avait été perdu et
      # masquait la régression. S'il disparaît à nouveau, ce step échouera sur
      # « Permission denied » — c'est la détection voulue, la corriger est un
      # `git update-index --chmod=+x frontend/android/gradlew`.
      # Le shebang est protégé en parallèle par .gitattributes (`gradlew
      # text eol=lf`) : un shebang en CRLF ferait échouer l'exécution même
      # avec le bit présent.
      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

  # ─── Backend : déploiement Fly.io (verrouillé sur les tests backend) ─────
  # Déployé à chaque push sur main qui touche backend/ — MAIS uniquement si
  # le job backend-tests passe. Un échec frontend/mobile ne bloque PAS le
  # déploiement backend (needs: backend-tests uniquement).
  #
  # Prérequis (une seule fois) :
  #   1. fly tokens create deploy -n "GitHub Actions"
  #   2. Ajouter le token comme secret du dépôt nommé FLY_API_TOKEN
  #      (Settings → Secrets and variables → Actions).
  deploy-fly:
    name: Deploy backend to Fly.io
    runs-on: ubuntu-latest
    needs: backend-tests
    # Jamais depuis un PR ; déploiement sur main (push auto OU dispatch manuel)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    # Pas d'annulation en plein vol : un déploiement est étatique (machines
    # Fly) ; les pushes successifs attendent leur tour.
    concurrency:
      group: deploy-fly
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # Filtre les changements : pas de re-déploiement du backend pour un
      # push qui ne touche que le frontend/docs.
      - name: Detect backend changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

      # Déploiement forcé : un dispatch manuel déploie même sans changement
      # backend (l'utilisateur a explicitement demandé le run).
      - name: Setup flyctl
        if: steps.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # v1 (node24)

      # --remote-only : le build se fait sur les builders distants de Fly
      # (Depot), pas de Docker nécessaire sur le runner. fly.toml et
      # Dockerfile sont lus depuis backend/ (working-directory).
      - name: Deploy to Fly.io
        if: steps.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: backend
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
