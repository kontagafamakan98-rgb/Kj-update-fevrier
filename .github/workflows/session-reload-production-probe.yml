name: Session reload production probe (daily)

# ─── Pourquoi cette sonde est PUBLIÉE, et pas seulement écrite ───────────────
# Toutes les sondes de production du dépôt lisent des faits de SERVEUR : le HTML
# servi (seo-production-probe), l'état de /health (backend-health-probe), une
# paire préflight/GET (check-cors-preflight, dans ci.yml). Aucune n'observe ce
# que le NAVIGATEUR garde d'une session, ni ce que l'application en fait quand
# la mémoire JavaScript a disparu — et c'est exactement là que se logent les
# régressions : un cookie qui ne survit pas à un rechargement (périmètre,
# SameSite, hôte) et une garde d'amorçage qui ne relit pas la session (le
# prérequis du proxy même-origine, écrit dans AuthContext.js).
#
# Un rechargement ne se teste pas en HTTP : il faut un vrai navigateur, un vrai
# formulaire servi, et une vraie page rechargée. La sonde ouvre donc Chromium,
# se connecte avec le COMPTE CLIENT DÉDIÉ CI (les mêmes secrets
# LHCI_CI_EMAIL/LHCI_CI_PASSWORD que le job Lighthouse), recharge, puis juge
# séparément le justificatif (a-t-il survécu ?) et l'application (l'a-t-elle
# restauré ?) — deux refus, deux corrections.
#
# Elle tourne une fois par jour au lieu de chaque push, à dessein : elle dépend
# d'un compte réel et d'un réseau public, donc elle ne bloque aucune PR. Mais
# elle ÉCHOUE (code 1) au lieu de publier une note, parce que ce qu'elle
# vérifie est un invariant : si la session ne survit pas au rechargement, le
# site est cassé pour ses utilisateurs connectés. Code 2 = prémisse (aucun
# verdict rendu) : compte CI absent, session impossible à ouvrir — le code de
# sortie ne se confond pas avec une session perdue.
#
# Aucune écriture : la sonde LIT une session existante (aucune inscription,
# aucun compte créé), et chaque tentative est jetée avec son contexte.
on:
  schedule:
    # 06:47 UTC : après la sonde SEO (06:17) et la sonde de santé (06:30), hors
    # des heures pleines pour ne pas concurrencer les crons d'autres dépôts.
    - cron: '47 6 * * *'
  # Le dispatch sert à juger une AUTRE surface que la production : la même
  # sonde, la même commande, un `--base` et un `--cross-site` de plus.
  #
  # PRÉPRODUCTION (une preview Vercel) : deux réglages, aucun du dépôt. (1) Le
  # jeton « Protection Bypass for Automation » — sans lui la page de connexion
  # d'une preview répond 302 vers vercel.com/sso-api (mesuré le 16/10/2026) —
  # vient d'un SECRET, jamais d'une entrée de dispatch : une entrée est publiée
  # dans les journaux du run. (2) `cross_site_api` demande le jugement
  # CROSS-SITE (drapeau même-origine d'exécution désactivé), parce que sur un
  # déploiement Vercel le bundle utilise le proxy /api : juger le cross-site sans
  # ce drapeau ferait accuser le frontend à tort (« aucun appel authentifié »).
  # Sur le cron, les deux entrées sont vides : la surface jugée reste la
  # production, par son proxy même-origine — la conduite quotidienne ne change
  # pas d'un iota.
  workflow_dispatch:
    inputs:
      site:
        description: "Origine frontend à juger (défaut : vide = production)"
        required: false
        default: ""
      cross_site_api:
        description: "Origine de l'API pour un jugement cross-site (défaut : vide = proxy même-origine de `site`)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    name: Session et attributs du cookie (production)
    runs-on: ubuntu-latest
    # Plafond : sans lui, une production qui ne répond plus laisserait le job
    # patienter jusqu'à l'abandon du runner (360 min) au lieu de rougir.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright Chromium binaries
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # `restore-keys` : la clé exacte reste liée au lock, mais un changement
          # de dépendance (même sans rapport avec Playwright) ne fait plus
          # retélécharger Chromium — `install --with-deps` réutilise le cache
          # restauré et ne prend que ce qui manque. Même correctif que `ci.yml`,
          # qui a payé ce téléchargement pour rien le 22/10/2026.
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Playwright Chromium dependencies (and binary if cache miss)
        working-directory: frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # La sonde refuse de conclure, en nommant les secrets, s'ils sont absents :
      # un run rouge doit dire quelle variable poser.
      # Même sonde : le cookie Chromium doit rester HttpOnly, Secure et
      # SameSite=None après connexion ET après rechargement. Valeur jamais loggée.
      # Le jeton de contournement, lui non plus : il est lu de l'environnement et
      # passé en en-tête par la sonde, jamais écrit dans la commande (une commande
      # de `run:` est publiée dans les journaux du run).
      - name: Vérifier la session et les attributs réels du cookie (surface et API jugées)
        working-directory: frontend
        env:
          LHCI_CI_EMAIL: ${{ secrets.LHCI_CI_EMAIL }}
          LHCI_CI_PASSWORD: ${{ secrets.LHCI_CI_PASSWORD }}
          LHCI_TEST_EMAIL: ${{ secrets.LHCI_TEST_EMAIL }}
          LHCI_TEST_PASSWORD: ${{ secrets.LHCI_TEST_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SITE_A_JUGER: ${{ inputs.site }}
          API_CROSS_SITE: ${{ inputs.cross_site_api }}
        run: |
          arguments=()
          if [ -n "$SITE_A_JUGER" ]; then
            arguments+=(--base "$SITE_A_JUGER")
          fi
          if [ -n "$API_CROSS_SITE" ]; then
            arguments+=(--cross-site "$API_CROSS_SITE")
          fi
          node scripts/check-session-reload-production.js ${arguments[@]+"${arguments[@]}"}
