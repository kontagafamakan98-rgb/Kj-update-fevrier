name: Sauvegardes Atlas (quotidien)

# ─── Les sauvegardes continues d'Atlas sont-elles ACTIVES ? ────────────────
# Une case cochée dans un tableau de bord n'est pas un fait mesuré : Atlas peut
# avoir `backupEnabled` vrai et `pitEnabled` faux (snapshots seuls, jusqu'à 6 h
# de pertes), ou les deux faux sur un palier partagé (M0/M2/M5 ne fournissent
# pas la restauration continue). Personne ne s'en aperçoit avant le jour où il
# faut restaurer.
#
# Trois sorties, jamais deux (backend/scripts/check_atlas_backups.py) :
#   0 — sauvegardes ET PITR actives ;
#   1 — l'un des deux est faux : le run est ROUGE, l'annotation nomme lequel
#       et le remède ;
#   2 — impossible de juger (clés absentes, 401/403/404, réseau, réponse sans
#       les champs) : le run est ROUGE aussi, mais pour une PRÉMISSE nommée —
#       une surface aveugle se déclare, elle ne vaut pas un vert.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   ATLAS_PUBLIC_KEY, ATLAS_PRIVATE_KEY, ATLAS_PROJECT_ID, ATLAS_CLUSTER
# Tant qu'ils manquent, ce workflow est rouge PARCE QUE la sonde ne peut rien
# juger — c'est volontaire, et le message le dit.
#
# Procédure de restauration et exercice daté : backend/SAUVEGARDES_ATLAS.md
on:
  schedule:
    # 06:45 UTC : après la sonde de santé (06:30) et avant la sonde de session
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas-backups:
    name: Sauvegardes Atlas (PITR)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer requests
        run: python -m pip install --quiet requests

      - name: Interroger Atlas (backupEnabled + pitEnabled)
        env:
          ATLAS_PUBLIC_KEY: ${{ secrets.ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.ATLAS_PRIVATE_KEY }}
          ATLAS_PROJECT_ID: ${{ secrets.ATLAS_PROJECT_ID }}
          ATLAS_CLUSTER: ${{ secrets.ATLAS_CLUSTER }}
        run: python backend/scripts/check_atlas_backups.py
