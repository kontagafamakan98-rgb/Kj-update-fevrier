[pytest]
asyncio_mode = auto
# Boucle d'événements partagée pour toute la session : nécessaire en mode
# réel (TEST_MONGO_URL) car le client Motor est un singleton créé à l'import.
# Avec une boucle par test (défaut), la 2e opération DB échoue avec
# « Event loop is closed ». Une boucle unique reproduit aussi le comportement
# de production (uvicorn = une seule boucle).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Affiche les logs de niveau WARNING et plus pendant les tests
log_cli = true
log_cli_level = WARNING
log_format = %(asctime)s %(levelname)s %(message)s

# Arrête à la première erreur inattendue (pas un échec de test)
# pour éviter des cascades difficiles à déboguer
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:pydantic.*

# Un test qui n'aboutit pas ne doit pas ressembler à une suite qui tourne.
# Mesuré le 02/11/2026 : la suite locale atteignait 58 % en 200 s sans qu'on
# puisse distinguer « lent » de « bloqué » — le seul repère était la CI. Au-delà
# de 180 s sur UN cas, pytest imprime le cas et le compte en échec : la suite
# redevient rejouable hors CI, avec un verdict nommé au lieu d'une attente.
timeout = 180
