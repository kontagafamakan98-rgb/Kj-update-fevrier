[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Affiche les logs de niveau WARNING et plus pendant les tests
log_cli = true
log_cli_level = WARNING
log_format = %(asctime)s %(levelname)s %(message)s

# Arrête à la première erreur inattendue (pas un échec de test)
# pour éviter des cascades difficiles à déboguer
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:pydantic.*
