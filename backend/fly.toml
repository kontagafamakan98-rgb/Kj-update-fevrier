# fly.toml app configuration file generated for kojo-backend on 2026-08-17T01:22:23+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kojo-backend'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENV = 'production'
  DB_NAME = 'kojo_db'
  FRONTEND_APP_URL = 'https://kojoforafrica.cc.cd'
  VERCEL_PROJECT_NAME = 'kj-update-fevrier'
  # URL publique du backend → callbacks IPN PayDunya (et hôtes de confiance si
  # le TrustedHostMiddleware reste activé). Hôte Kojo depuis le 17/09/2026 :
  # `kojo-backend.fly.dev` reste servi (applications mobiles déjà installées,
  # moniteurs, rollback) mais n'est plus ANNONCÉ nulle part.
  BACKEND_PUBLIC_URL = 'https://api.kojoforafrica.cc.cd'
  # TrustedHostMiddleware : ACTIF en prod (secret DISABLE_TRUSTED_HOST_MIDDLEWARE
  # retiré le 27/08/2026, plan exécuté : health check passé en TCP ci-dessous
  # puis `fly secrets unset DISABLE_TRUSTED_HOST_MIDDLEWARE`). Les checks HTTP
  # précédents échouaient en 400 « Invalid host header » — le Host interne des
  # sondes Fly n'était couvert par aucun motif de build_trusted_hosts()
  # (probablement l'adresse IPv6 interne découpée sur ':' par Starlette).
  # build_trusted_hosts() couvre désormais localhost, *.vercel.app,
  # *.onrender.com, *.internal, *.flycast.internal, *.fly.dev et les hôtes
  # dérivés de FRONTEND_APP_URL / BACKEND_PUBLIC_URL / CORS_ORIGINS /
  # TRUSTED_HOSTS : le trafic public (Vercel, moniteurs UptimeRobot/Render)
  # arrive via le proxy Fly avec Host *.fly.dev → servi normalement.
  TRUSTED_HOSTS = '*.internal,*.flycast.internal,kojo-backend.fly.dev,api.kojoforafrica.cc.cd'
  # IDENTIFIANT DE MESURE GA4, PUBLIÉ DANS LA CSP DES FICHES `/jobs/:id` et
  # `/workers/:id` (`kojo_csp.py`). Il doit être la MÊME valeur que
  # `VITE_GA_MEASUREMENT_ID` du build Vercel : la sonde
  # `csp-documents-production-probe.yml` compare la politique du SITE à celle de
  # chaque document, et une valeur absente d'un côté produit deux politiques
  # concurrentes. Mesuré le 24/10/2026, ce réglage manquait : l'accueil
  # autorisait `www.googletagmanager.com`, `www.google-analytics.com` et
  # `region1.google-analytics.com`, les fiches ne les autorisaient pas — un
  # visiteur arrivé par un lien partagé n'avait donc pas l'analytique du site.
  # Ce n'est pas un secret : la valeur est publique dans chaque page servie.
  GA_MEASUREMENT_ID = 'G-4HTDD40F4T'

# Syntaxe complète [[services]] (et non [http_service]) : le raccourci
# [http_service] ne sait exprimer QUE des checks HTTP (protocol http/https),
# pas de check TCP — le déploiement échoue avec « HTTP protocol is not
# included in the list ». Un check TCP est requis pour que le
# TrustedHostMiddleware reste activable : les sondes HTTP de Fly traversent
# le middleware et échouent en 400 « Invalid host header » sur le Host
# interne. La disponibilité applicative (GET /health) reste couverte par les
# moniteurs externes (UptimeRobot/Render) via le Host public *.fly.dev.
[[services]]
  internal_port = 8080
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # CONNEXIONS et non requêtes : les notifications et les messages passent
  # désormais par un flux SSE (kojo_live.py), donc chaque session connectée
  # TIENT une connexion au lieu d'envoyer une requête toutes les 30 s.
  #
  # DIMENSIONNÉ SUR LA MESURE, pas sur une envie (18/10/2026) : le banc
  # `scripts/charge/mesure_memoire_flux.py` relève le RSS du serveur à 0, 100,
  # 200 et 400 flux ouverts — +166 Ko par session, 374 Ko au pire palier, pour
  # une base de 166 Mo (poste Windows : majorant, l'interpréteur Linux est plus
  # léger). Avec 512 Mo et 75 % pour les sessions, la formule
  # `base + hard_limit × coût_pire ≤ RAM × 0,75` donnait 166 + 400×0,374 ≈ 316 Mo
  # des 384 Mo disponibles : c'est POURQUOI 400, et 800 ne tenaient pas (les
  # 256 Mo d'avant n'en tenaient que ~130). `soft_limit` fait ajouter une
  # machine avant que la limite dure ne refuse : la promesse par machine reste
  # honnête, l'échelle vient de l'horizontal.
  # Source unique : `backend/scripts/charge/mesure_memoire.json`, relue par
  # `backend/tests/test_dimensionnement_machine.py` (un `hard_limit` au-dessus
  # de la RAM fait rougir le test au lieu d'attendre un OOM en production).
  [services.concurrency]
    type = 'connections'
    hard_limit = 400
    soft_limit = 200

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['http', 'tls']

  # Health check TCP : simple connexion sur internal_port (8080), ne traverse
  # pas le middleware → le TrustedHostMiddleware peut rester actif en prod.
  [[services.tcp_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'

[[vm]]
  size = 'shared-cpu-1x'
  # 512 Mo et non 256 : à 256, la base (166 Mo) plus 400 sessions (150 Mo)
  # dépassait la RAM disponible, et une machine Fly ne refuse pas proprement —
  # elle se fait tuer. La mesure et le calcul vivent dans SCALING.md §« machine ».
  memory = '512mb'
  cpus = 1
  memory_mb = 512
