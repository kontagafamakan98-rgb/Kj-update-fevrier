# fly.toml app configuration file generated for kojo-backend on 2026-08-17T01:22:23+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kojo-backend'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENV = 'production'
  DB_NAME = 'kojo_db'
  FRONTEND_APP_URL = 'https://kj-update-fevrier.vercel.app'
  VERCEL_PROJECT_NAME = 'kj-update-fevrier'
  # URL publique du backend → callbacks IPN PayDunya (et hôtes de confiance si
  # le TrustedHostMiddleware reste activé)
  BACKEND_PUBLIC_URL = 'https://kojo-backend.fly.dev'
  # TrustedHostMiddleware : DÉSACTIVÉ en prod via le secret
  # DISABLE_TRUSTED_HOST_MIDDLEWARE=true. Constat (vérifié le 22/08/2026) :
  # retirer ce secret fait échouer les health checks HTTP de Fly en 400
  # « Invalid host header » — le Host envoyé par les sondes n'est couvert par
  # AUCUN motif de build_trusted_hosts() (*.internal, *.flycast.internal,
  # *.flycast, *.fly.dev testés), probablement l'adresse IPv6 interne que le
  # parseur de Starlette découpe sur ':' (host.split(':')[0]). Risque réel
  # faible : Fly normalise le Host du trafic public et tous les liens du
  # backend sont construits depuis FRONTEND_APP_URL statique (pas de
  # host-header poisoning exploitable). Pour réactiver proprement : passer
  # le health check de HTTP à TCP dans [http_service] (les checks TCP ne
  # traversent pas le middleware), puis `fly secrets unset
  # DISABLE_TRUSTED_HOST_MIDDLEWARE`.
  TRUSTED_HOSTS = '*.internal,*.flycast.internal,kojo-backend.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 50
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
