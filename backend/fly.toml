# fly.toml app configuration file generated for kojo-backend on 2026-08-17T01:22:23+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kojo-backend'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENV = 'production'
  DB_NAME = 'kojo_db'
  FRONTEND_APP_URL = 'https://kj-update-fevrier.vercel.app'
  VERCEL_PROJECT_NAME = 'kj-update-fevrier'
  # URL publique du backend → callbacks IPN PayDunya (et hôtes de confiance si
  # le TrustedHostMiddleware reste activé)
  BACKEND_PUBLIC_URL = 'https://kojo-backend.fly.dev'
  # TrustedHostMiddleware : ACTIF en prod (secret DISABLE_TRUSTED_HOST_MIDDLEWARE
  # retiré le 27/08/2026, plan exécuté : health check passé en TCP ci-dessous
  # puis `fly secrets unset DISABLE_TRUSTED_HOST_MIDDLEWARE`). Les checks HTTP
  # précédents échouaient en 400 « Invalid host header » — le Host interne des
  # sondes Fly n'était couvert par aucun motif de build_trusted_hosts()
  # (probablement l'adresse IPv6 interne découpée sur ':' par Starlette).
  # build_trusted_hosts() couvre désormais localhost, *.vercel.app,
  # *.onrender.com, *.internal, *.flycast.internal, *.fly.dev et les hôtes
  # dérivés de FRONTEND_APP_URL / BACKEND_PUBLIC_URL / CORS_ORIGINS /
  # TRUSTED_HOSTS : le trafic public (Vercel, moniteurs UptimeRobot/Render)
  # arrive via le proxy Fly avec Host *.fly.dev → servi normalement.
  TRUSTED_HOSTS = '*.internal,*.flycast.internal,kojo-backend.fly.dev'

# Syntaxe complète [[services]] (et non [http_service]) : le raccourci
# [http_service] ne sait exprimer QUE des checks HTTP (protocol http/https),
# pas de check TCP — le déploiement échoue avec « HTTP protocol is not
# included in the list ». Un check TCP est requis pour que le
# TrustedHostMiddleware reste activable : les sondes HTTP de Fly traversent
# le middleware et échouent en 400 « Invalid host header » sur le Host
# interne. La disponibilité applicative (GET /health) reste couverte par les
# moniteurs externes (UptimeRobot/Render) via le Host public *.fly.dev.
[[services]]
  internal_port = 8080
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [services.concurrency]
    type = 'connections'
    hard_limit = 50
    soft_limit = 20

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['http', 'tls']

  # Health check TCP : simple connexion sur internal_port (8080), ne traverse
  # pas le middleware → le TrustedHostMiddleware peut rester actif en prod.
  [[services.tcp_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
