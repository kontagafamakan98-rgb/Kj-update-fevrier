<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- Favicon dédié aux surfaces SOMBRES (onglets en mode sombre, cartes
         de partage sur fond foncé) : fond graphite + K dégradé, là où
         l'icône claire disparaîtrait. Généré par scripts/gen-og-images.py. -->
    <link rel="icon" media="(prefers-color-scheme: dark)" href="/icons/icon-dark.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- Titre et description : calibrés pour les SERP (title ≤ 60, description
         ≤ 160 caractères — au-delà, Google tronque et un audit SEO le
         signale). Le titre est EXACTEMENT celui que Home applique au runtime
         (t('homeMetaTitle') dans src/i18n/fr.json) : un crawler sans JS et un
         navigateur voient donc le même titre, et le pré-rendu n'a rien à
         réécrire pour « / » (contrairement aux routes, cf. plugin
         prerender-route-meta dans vite.config.js). -->
    <title>Kojo — Services et travailleurs en Afrique de l'Ouest</title>
    <meta
      name="title"
      content="Kojo — Services et travailleurs en Afrique de l'Ouest"
    />
    <meta
      name="description"
      content="Trouvez un plombier, électricien ou mécanicien vérifié au Mali, au Sénégal, au Burkina Faso et en Côte d'Ivoire. Publiez une mission en toute sécurité."
    />
    <meta
      name="keywords"
      content="Kojo, services, travailleurs, Mali, Sénégal, Burkina Faso, Côte d'Ivoire, mécanicien, électricien, plombier, réparation, travaux, Afrique de l'Ouest"
    />
    <meta name="author" content="Kojo - Famakan Kontaga" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="French" />
    <meta name="geo.region" content="ML;SN;BF;CI" />
    <meta name="geo.placename" content="West Africa" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kojoforafrica.cc.cd/" />
    <meta
      property="og:title"
      content="Kojo — Services et travailleurs en Afrique de l'Ouest"
    />
    <meta
      property="og:description"
      content="Connectez-vous avec les meilleurs travailleurs en Afrique de l'Ouest. Services de qualité au Mali, Sénégal, Burkina Faso et Côte d'Ivoire."
    />
    <!-- Image Open Graph dédiée 1200x630 (format recommandé) : générée via
         scripts/gen-og-images.py (dégradé hero + logo K + le TITRE et la
         DESCRIPTION de la page, lus dans fr.json — la carte de partage annonce
         donc exactement ce que la page publie). Ne PAS
         réutiliser l'icône 512x512 : trop petite pour les cartes de partage
         (LinkedIn/Twitter recadrent les 1200x630 ; une image plus petite est
         floue ou ignorée). -->
    <!-- og:image en URL ABSOLUE : les crawlers de partage exigent une URL
         complète dans og:image — une URL relative (/og-image-1200x630.png)
         serait ignorée. C'est aussi le shell servi par /dashboard et
         /profile (catch-all SPA) : leur carte de partage est donc celle-ci. -->
    <meta property="og:image" content="https://kojoforafrica.cc.cd/og-image-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <!-- Variante CARRÉE 1200x1200 pour les réseaux qui RECADRENT la carte en
         vignette 1:1 (WhatsApp, Telegram, iMessage, LinkedIn, aperçus
         Twitter) : composition centrée dans la zone sûre — un recadrage
         central conserve logo + accroche. Les crawlers choisissent la
         variante adaptée à leur rendu (dimensions déclarées). -->
    <meta property="og:image" content="https://kojoforafrica.cc.cd/og-square-1200x1200.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:site_name" content="Kojo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://kojoforafrica.cc.cd/" />
    <meta name="twitter:title" content="Kojo — Services et travailleurs en Afrique de l'Ouest" />
    <meta
      name="twitter:description"
      content="Trouvez des travailleurs qualifiés pour tous vos besoins en Afrique de l'Ouest."
    />
    <meta name="twitter:image" content="https://kojoforafrica.cc.cd/og-image-1200x630.png" />
    <link rel="manifest" href="/manifest.json?v=3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#ea580c" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kojo" />
    <link rel="apple-touch-startup-image" href="/icons/icon-512x512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/icons/icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="96x96" href="/icons/icon-96x96.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/icons/icon-128x128.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="384x384" href="/icons/icon-384x384.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png" />
    <meta name="msapplication-TileColor" content="#ea580c" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <link rel="canonical" href="https://kojoforafrica.cc.cd/" />

    <!-- Analytics Plausible : chargé depuis un module bundlé (src/utils/
         analytics.js) et NON en script inline — la CSP production est
         `script-src 'self'` (pas d'unsafe-inline) : un script inline serait
         bloqué avec une erreur console. Le module injecte le script externe
         (autorisé par script-src quand VITE_PLAUSIBLE_DOMAIN est défini). -->

    <!-- Données structurées (SEO) : organisation + site web -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Kojo",
        "url": "https://kojoforafrica.cc.cd/",
        "logo": "https://kojoforafrica.cc.cd/icons/icon-512x512.png",
        "description": "Kojo connecte clients et travailleurs en Afrique de l'Ouest : plomberie, électricité, mécanique, construction au Mali, Sénégal, Burkina Faso et Côte d'Ivoire.",
        "areaServed": ["Mali", "Sénégal", "Burkina Faso", "Côte d'Ivoire"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Kojo",
        "url": "https://kojoforafrica.cc.cd/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://kojoforafrica.cc.cd/jobs?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <!-- LocalBusiness (SEO local) : N.A.P. RÉEL — le téléphone, l'e-mail et
         l'adresse sont exactement ceux publiés par l'application
         (src/pages/Support.js : CONTACT_INFO). Aucun horaire ni
         priceRange inventé : une donnée structurée fausse est pire que pas de
         donnée. `sameAs` est rempli au build par le plugin
         inject-seo-extras (vite.config.js) avec les profils sociaux déclarés
         par VITE_SOCIAL_* ; laissé vide, Google ignore la propriété. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Kojo",
        "url": "https://kojoforafrica.cc.cd/",
        "logo": "https://kojoforafrica.cc.cd/icons/icon-512x512.png",
        "image": "https://kojoforafrica.cc.cd/og-image-1200x630.png",
        "description": "Kojo met en relation clients et travailleurs vérifiés en Afrique de l'Ouest : plomberie, électricité, mécanique, construction, ménage. Paiement séquestre jusqu'à la fin de la mission.",
        "telephone": "+18193003507",
        "email": "Kojoapp98@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Hamdallaye ACI 2000",
          "addressLocality": "Bamako",
          "addressCountry": "ML"
        },
        "hasMap": "https://www.google.com/maps/search/?api=1&query=Hamdallaye+ACI+2000%2C+Bamako%2C+Mali",
        "areaServed": ["Mali", "Sénégal", "Burkina Faso", "Côte d'Ivoire"],
        "availableLanguage": ["fr", "en"],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "telephone": "+18193003507",
          "email": "Kojoapp98@gmail.com",
          "availableLanguage": ["fr", "en"]
        },
        "sameAs": []
      }
    </script>
  </head>
  <body>
    <noscript>Vous devez activer JavaScript pour utiliser cette application.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
